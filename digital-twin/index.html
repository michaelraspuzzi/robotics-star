oltage substation"}}, {"years": "2025-26", "title": "Network twins as a platform", "text": "Siemens pitches Gridscale X as one twin for planning, operations and maintenance, and Schneider/ETAP a physics-based twin for resilience and time-to-power. Both lean on virtualized protection and control.", "items": [{"name": "Siemens previews Gridscale X T&D twin and virtualized protection at DTECH (Feb 3, 2026)", "kind": "product", "year": 2026, "url": "https://news.siemens.com/de-de/autonomous-grids-dtech-2026/", "verified": true}, {"name": "Schneider Electric and ETAP unveil physics-based digital twin for utility grid resilience (Feb 2026)", "kind": "product", "year": 2026, "url": "https://www.hpcwire.com/off-the-wire/schneider-electric-and-etap-unveil-physics-based-digital-twin-for-utility-grid-resilience", "verified": false}], "img": {"src": "img/power-grids-3.jpg", "credit": "Novoklimov / CC0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:High-voltage_transformer_750_kV_%D0%A2%D1%80%D0%B0%D0%BD%D1%81%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%82%D0%BE%D1%80_750_%D0%BA%D0%92.jpg", "alt": "750 kV high-voltage transformer at a substation"}}], "Wind, solar & energy assets": [{"years": "1940s-1990s", "title": "First megawatt turbine", "text": "The Smith-Putnam turbine fed Vermont's grid from Oct 1941, the first wind machine to supply a utility's high-voltage lines. A bearing failure and a thrown blade ended it by 1945.", "items": [{"name": "Smith-Putnam 1.25 MW turbine synchronized with the Vermont grid, Oct 19 1941", "kind": "milestone", "year": 1941, "url": "https://law.stanford.edu/2016/10/19/the-unlikely-birth-of-modern-renewable-energy-on-a-mountain-top-in-vermont-75-years-ago-today/", "verified": true}, {"name": "Guinness World Records: first megawatt wind turbine", "kind": "milestone", "year": 1941, "url": "https://www.guinnessworldrecords.com/world-records/640987-first-megawatt-wind-turbine", "verified": false}], "img": {"src": "img/wind-solar-energy-assets-0.jpg", "credit": "United States Government / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Wind_turbine_1941.jpg", "alt": "Smith-Putnam wind turbine on Grandpa's Knob, Vermont"}}, {"years": "2000s-2010s", "title": "Offshore and SCADA analytics", "text": "Offshore farms such as Horns Rev 1 (2002) made remote monitoring a business necessity. Operators relied on 10-minute SCADA statistics and periodic vibration checks.", "items": [{"name": "Horns Rev 1, 160 MW offshore wind farm in Denmark (2002)", "kind": "milestone", "year": 2002, "url": "https://en.wikipedia.org/wiki/Horns_Rev_Offshore_Wind_Farm", "verified": false}, {"name": "Commercial turbines scale from kW to multi-MW rotors, history of wind power", "kind": "milestone", "year": null, "url": "https://en.wikipedia.org/wiki/History_of_wind_power", "verified": false}], "img": {"src": "img/wind-solar-energy-assets-1.jpg", "credit": "Thomas Dahlstrøm Nielsen / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Horns_Rev_1_offshore_wind_farm.jpg", "alt": "Horns Rev 1 offshore wind farm, Denmark"}}, {"years": "2020-2024", "title": "Physics-ML farm twins", "text": "Siemens Gamesa used NVIDIA's physics-ML stack to replace weeks-long CFD with near-real-time wake simulation. Operators reported measured turbine wear below design assumptions.", "items": [{"name": "Siemens Gamesa and NVIDIA wind-farm twins: up to 4,000x faster CFD (Mar 22, 2022)", "kind": "milestone", "year": 2022, "url": "https://blogs.nvidia.com/blog/siemens-gamesa-wind-farms-digital-twins", "verified": true}, {"name": "WindEnergy Hamburg 2024: Siemens Gamesa wind-farm twin goal; Vattenfall found wear lower than design", "kind": "report", "year": 2024, "url": "https://hamburg-messe.de/fileadmin/user_upload/WEH24_Digitalisierung_30_07_2024.pdf", "verified": false}], "img": {"src": "img/wind-solar-energy-assets-2.jpg", "credit": "Σ64 / CC BY 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Nacelle_of_Wind_Turbine_01.jpg", "alt": "Nacelle of a wind turbine at Hiyama Plateau Wind Farm"}}, {"years": "2025-26", "title": "The gap to practice", "text": "A 2026 review finds a substantial gap between academic wind twins and practical O&M use and proposes a closed-loop framework. Funded projects are testing design-to-maintenance twins.", "items": [{"name": "Li et al.: Empowering digital twins for wind energy O&M, Renewable and Sustainable Energy Reviews 235 (2026)", "kind": "paper", "year": 2026, "url": "https://research.chalmers.se/en/publication/551678", "verified": true}, {"name": "winDTwin: Austrian project on wind-farm design, operation and predictive maintenance (phase 2 to Aug 2026)", "kind": "report", "year": 2026, "url": "https://projekte.ffg.at/projekt/5cef453e-f36b-1410-861a-00d3c07d99bb/pdf", "verified": false}, {"name": "Wind farm digital-twin-as-a-service market est. ~$680M in 2025 to $3.15B by 2034 (paid-report estimate)", "kind": "report", "year": 2025, "url": "https://www.htfmarketintelligence.com/report/global-wind-farm-digital-twin-as-a-service-market", "verified": false}, {"name": "Hannover Messe 2025: PTC shows Vestas turbine with AI-powered digital thread", "kind": "product", "year": 2025, "url": "https://www.hannovermesse.de/en/news/news-articles/a-breath-of-fresh-air-at-the-wind-farm", "verified": false}], "img": {"src": "img/wind-solar-energy-assets-3.jpg", "credit": "Cjp24 / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Wind_turbine_construction,_Pougny,_E6-09,_nacelle_and_crane.jpg", "alt": "Nacelle and crane during wind turbine construction"}}], "Nuclear plants": [{"years": "1950s-1980s", "title": "Reactors, then simulators after TMI", "text": "EBR-I produced the first nuclear electricity in 1951. After Three Mile Island (1979), inquiries concluded operators were under-trained, and plant-specific simulator training became standard.", "items": [{"name": "EBR-I lights four bulbs with nuclear electricity, Dec 1951 (Idaho)", "kind": "milestone", "year": 1951, "url": "https://en.wikipedia.org/wiki/Experimental_Breeder_Reactor_I", "verified": false}, {"name": "After TMI, inquiries found operators were under-trained; simulator scenarios became standard", "kind": "milestone", "year": 1979, "url": "https://blog.ucs.org/dlochbaum/nuclear-worker-training/", "verified": false}], "img": {"src": "img/nuclear-plants-0.jpg", "credit": "ENERGY.GOV / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Experimental_breeder_reactor_1_-_c_1953.jpg", "alt": "Exterior of the experimental breeder reactor building at the National Reactor Testing Station, Idaho, c.1953"}}, {"years": "1990s-2010s", "title": "Full-scope training simulators", "text": "ANSI/ANS-3.5 set fidelity requirements for simulators used in US operator certification. IAEA guidance spread control-room simulators across fleets.", "items": [{"name": "IAEA: Use of control room simulators for training of nuclear power plant personnel", "kind": "report", "year": null, "url": "https://www.iaea.org/publications/7097/use-of-control-room-simulators-for-training-of-nuclear-power-plant-personnel", "verified": false}, {"name": "INL report summary: simulated emergency scenarios become standard operator training (NUREG-0660)", "kind": "report", "year": null, "url": "https://inldigitallibrary.inl.gov/sites/sti/sti/Sort_60932.pdf", "verified": false}], "img": {"src": "img/nuclear-plants-1.jpg", "credit": "Nuclear Regulatory Commission from US / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Presentation_at_Three_Mile_Island_Nuclear_Plant_Simulator_(28751374767).jpg", "alt": "Nuclear plant simulator at the Three Mile Island site"}}, {"years": "2020-2024", "title": "First reactor twins", "text": "INL built twins of the MAGNET microreactor testbed and Idaho State's AGN-201 that predict heat-pipe temperatures and reactor behavior from live data. Westinghouse presented ML and twin work to the NRC in 2020.", "items": [{"name": "First digital twin of a nuclear reactor (INL/Idaho State AGN-201)", "kind": "milestone", "year": null, "url": "https://www.enlit.world/library/first-digital-twin-of-a-nuclear-reactor", "verified": false}, {"name": "Frontiers in Energy Research: NPP digital twin for robot navigation and interaction (2024)", "kind": "paper", "year": 2024, "url": "https://www.frontiersin.org/journals/energy-research/articles/10.3389/fenrg.2024.1356624/epub", "verified": false}, {"name": "INL DICE: NRC digital twin workshop (includes Westinghouse ML/DT talk, 2020)", "kind": "report", "year": 2020, "url": "https://dice.inl.gov/digital-twin-workshop/", "verified": false}], "img": {"src": "img/nuclear-plants-2.jpg", "credit": "Whharris917 / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Idaho_National_Lab_CAES.jpg", "alt": "Idaho National Laboratory Center for Advanced Energy Studies building"}}, {"years": "2025-26", "title": "Autonomy and AI-scale partners", "text": "Labs now pair twins with cloud AI and supercomputers aiming at autonomous operation and faster licensing. Argonne published a whole-system twin method for advanced reactors in June 2025.", "items": [{"name": "INL and AWS to build SMR digital twins for 20-300 MW reactors (Jul 29, 2025)", "kind": "milestone", "year": 2025, "url": "https://interestingengineering.com/energy/idaho-lab-amazon-ai-nuclear-reactors", "verified": true}, {"name": "Argonne: whole-system digital twin methodology for advanced reactors, Nuclear Technology (Jun 2025)", "kind": "paper", "year": 2025, "url": "https://www.ans.org/news/step-1749067898/", "verified": false}, {"name": "INL and NVIDIA partner under DOE Genesis Mission to halve reactor build time (Feb 18, 2026)", "kind": "milestone", "year": 2026, "url": "https://www.letsdatascience.com/news/idaho-national-laboratory-applies-ai-to-accelerate-reactors-6dba80bd", "verified": true}, {"name": "INL links HPC, AI and a digital twin to adjust Purdue's PUR-1 research reactor remotely", "kind": "milestone", "year": 2025, "url": "https://www.hpcwire.com/off-the-wire/inl-links-hpc-ai-and-digital-twin-to-control-research-reactor-remotely/", "verified": false}], "img": {"src": "img/nuclear-plants-3.png", "credit": "OLCF / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Science_at_Exascale-_Simulating_Small_Modular_Reactor_Operations_-_49749891898.png", "alt": "ExaSMR coupled simulation of a small modular reactor (OLCF)"}}], "Railways": [{"years": "1960s-1990s", "title": "Track recording and interlockings", "text": "Measuring cars logged track geometry on a schedule while relay interlockings enforced signalling logic. State lived on paper and in the signalman's head.", "items": [{"name": "Track geometry car: measures rail position, gauge and alignment", "kind": "milestone", "year": 1960, "url": "https://en.wikipedia.org/wiki/Track_geometry_car", "verified": false}, {"name": "Interlocking: logic that prevents conflicting train movements", "kind": "milestone", "year": 1990, "url": "https://en.wikipedia.org/wiki/Interlocking", "verified": false}], "img": {"src": "img/railways-0.jpg", "credit": "Unknown / Public domain / Wikimedia Commons", "alt": "Rural railway signal box, home of manual interlocking control", "page": "https://commons.wikimedia.org/wiki/File:Bundamba_railway_station_signal_box.jpg"}}, {"years": "2000s-2010s", "title": "ETCS and model-based design", "text": "ETCS moved signalling state into onboard and trackside computers, and BIM gave civil assets a structured digital model. The two stayed separate datasets.", "items": [{"name": "European Train Control System (ETCS) specification and rollouts", "kind": "milestone", "year": 2005, "url": "https://en.wikipedia.org/wiki/European_Train_Control_System", "verified": false}, {"name": "Building information modeling adopted for rail infrastructure design", "kind": "milestone", "year": 2010, "url": "https://en.wikipedia.org/wiki/Building_information_modeling", "verified": false}], "img": {"src": "img/railways-1.jpg", "credit": "Steven Duhig from Bowie, Maryland, USA / CC BY-SA 2.0 / Wikimedia Commons", "alt": "Track-measuring dynamometer coach at a station platform", "page": "https://commons.wikimedia.org/wiki/File:Glasgow_Queen_Street_track_measuring_Dynometer_coach_TDM395279.jpg"}}, {"years": "2020s", "title": "Route-wide twins in programmes", "text": "Programme-scale twins federate thousands of design models and datasets so clashes and possessions are planned virtually. Siemens digitises signalling inventory first.", "items": [{"name": "Network Rail/Jacobs TransPennine twin on Bentley iTwin: 6,000+ models, 600+ datasets", "kind": "product", "year": 2023, "url": "https://bentley.com/cs-network-rail-ltr-en-lr", "verified": false}, {"name": "Siemens digital twin to inventory Deutsche Bahn signalling ahead of ETCS (EUR 12.7B programme)", "kind": "company", "year": 2025, "url": "https://geospatial.trimble.com/en/resources/blog/siemens-mobility-s-ai-enabled-digital-twin-signals-new-approach-to-rail-modernization", "verified": true}], "img": {"src": "img/railways-2.jpg", "credit": "photobeppus / CC BY-SA 2.0 / Wikimedia Commons", "alt": "Modern high-speed electric trainset at a station platform", "page": "https://commons.wikimedia.org/wiki/File:Frecciarossa_(ETR_500)_train_at_Milano_Centrale_(Milano,_Italy)_(7706246780).jpg"}}, {"years": "2025-26", "title": "Rolling-stock and track maintenance twins", "text": "Wayside systems now build per-wagon twins and track models couple sensor data with AI for predictive maintenance. A 2026 review finds most deployments still one-directional.", "items": [{"name": "Siemens Mobility and Sogeclair: high-fidelity Mireo trainset twin for operator training", "kind": "product", "year": 2025, "url": "https://railwaynews.net/siemens-sogeclair-digital-twin-revolutionizes-rail-training.html", "verified": true}, {"name": "PolyU RGC Research Impact Fund 2025/26: HK$7.84M track digital twin with AI", "kind": "report", "year": 2025, "url": "https://www.polyu.edu.hk/cee/news-and-events/newsletter/2026aprspring/research-excellence/rgc-research-impact-fund-2025-26-awarded-research/", "verified": true}, {"name": "RailWatch EUR 3.5M grant for freight-wagon digital twin measurement", "kind": "startup", "year": 2025, "url": "https://www.railjournal.com/technology/railwatch-to-improve-digital-train-measurement-system-with-e3-5m-grant/", "verified": true}, {"name": "Systematic review (2026): railway predictive maintenance twins mostly unidirectional", "kind": "paper", "year": 2026, "url": "https://research.birmingham.ac.uk/en/publications/digitalised-predictive-maintenance-in-railways-a-systematic-revie/", "verified": true}], "img": null}], "Ships & ports": [{"years": "1950s-1990s", "title": "Containerisation and tracked fleets", "text": "Standard boxes made cargo and berth time quantifiable; AIS later gave every ship a broadcast position. Hull and engine data stayed in noon reports.", "items": [{"name": "Containerization: standard boxes reshape ship and berth planning", "kind": "milestone", "year": 1956, "url": "https://en.wikipedia.org/wiki/Containerization", "verified": false}, {"name": "Automatic Identification System: ship position broadcast standard", "kind": "milestone", "year": 2000, "url": "https://en.wikipedia.org/wiki/Automatic_identification_system", "verified": false}], "img": {"src": "img/ships-ports-0.jpg", "credit": "SP5 Stanley D. Lasby / Public domain / Wikimedia Commons", "alt": "Early container ship arriving at a US port", "page": "https://commons.wikimedia.org/wiki/File:The_Sea_Land_Container_ship_SS_%22Raphael_Semmes%22_arrives_at_Newport.jpg"}}, {"years": "2000s-2010s", "title": "Performance models and port simulation", "text": "Data-driven models estimated fouling speed loss from onboard sensors, and ports began visualising shipping and infrastructure data. Rotterdam's twin with IBM tracks vessels, weather and water depth.", "items": [{"name": "Data-driven ship twin for speed loss from marine fouling (Coraddu et al.)", "kind": "paper", "year": 2019, "url": "https://strathprints.strath.ac.uk/69284", "verified": true}, {"name": "Port of Rotterdam digital twin with IBM", "kind": "milestone", "year": 2019, "url": "https://www.cio-platform.nl/en/weblog/nieuws-extern-detailpagina/2019/06/24/port-of-rotterdam-with-digital-twin-the-smartest-port", "verified": true}], "img": {"src": "img/ships-ports-1.jpg", "credit": "USDAgov / Public domain / Wikimedia Commons", "alt": "Container terminal with ship-to-shore cranes at Wando Welch", "page": "https://commons.wikimedia.org/wiki/File:Shipping_-_South_Carolina_-_Wando_Welch_Terminal_(20201119-TFAA-LSC-0475).jpg"}}, {"years": "2020s", "title": "Port-wide twins reach maturity level 4", "text": "Maturity assessments place the largest hubs near the top tier, using scenario runs on past, present and future data. Chinese ports pair twins with 5G.", "items": [{"name": "Assessing the Maturity of Digital Twinning Solutions for Ports (arXiv)", "kind": "paper", "year": 2022, "url": "https://arxiv.org/pdf/2212.07722", "verified": true}, {"name": "Huawei and Tianjin Port Group announce port digital twin project", "kind": "milestone", "year": 2023, "url": "https://www.rcrwireless.com/20230224/featured/huawei-tianjin-port-group-develop-digital-twin-port", "verified": true}], "img": {"src": "img/ships-ports-2.jpg", "credit": "Olivier Cleynen / CC BY 4.0 / Wikimedia Commons", "alt": "Aerial view of the Port of Rotterdam terminals", "page": "https://commons.wikimedia.org/wiki/File:Aerial_photograph_of_the_port_of_Rotterdam_in_2017_(1).jpg"}}, {"years": "2025-26", "title": "AI twins spread to more ports", "text": "Indian ports plan camera and computer-vision twins for berth schedules and crane operations. Hull-fouling estimators target double-digit lifetime fuel savings, per conference abstracts.", "items": [{"name": "Deendayal Port Authority plans AI digital twin for berthing, cranes, traffic", "kind": "milestone", "year": 2025, "url": "https://indianinfrastructure.com/2025/11/10/charting-a-digital-course-leveraging-technology-for-seamless-maritime-trade/", "verified": true}, {"name": "JNPA to deploy AI digital twin of port operations", "kind": "milestone", "year": 2026, "url": "https://www.renascence.io/news/31822/jnpa-to-deploy-ai-digital-twin-technology-at-india-port", "verified": false}], "img": {"src": "img/ships-ports-3.jpg", "credit": "Calistemon / CC BY-SA 4.0 / Wikimedia Commons", "alt": "Container ship in harbour, April 2026", "page": "https://commons.wikimedia.org/wiki/File:Container_ship_Express_Black_Sea_in_Fremantle_Harbour,_April_2026_01.jpg"}}], "Road traffic & mobility": [{"years": "1960s-1990s", "title": "Adaptive signal control", "text": "Loop detectors fed centralised plan selection and then cycle-by-cycle optimisers. The model was the controller, not a separate twin.", "items": [{"name": "SCATS: Sydney Coordinated Adaptive Traffic System", "kind": "product", "year": 1970, "url": "https://en.wikipedia.org/wiki/Sydney_Coordinated_Adaptive_Traffic_System", "verified": false}, {"name": "SCOOT: Split Cycle Offset Optimisation Technique", "kind": "product", "year": 1980, "url": "https://en.wikipedia.org/wiki/Split_Cycle_Offset_Optimisation_Technique", "verified": false}], "img": {"src": "img/road-traffic-mobility-0.jpg", "credit": "Mwkruse / CC BY 3.0 / Wikimedia Commons", "alt": "1931 traffic signal at a Kansas City intersection", "page": "https://commons.wikimedia.org/wiki/File:1931_traffic_signal_in_the_intersection_of_Linwood_Boulevard_and_The_Paseo,_KC,_MO.jpg"}}, {"years": "2000s-2010s", "title": "Microsimulation and ITS", "text": "Vehicle-level simulators were calibrated offline on counts, and traffic centres aggregated cameras and probe data. Evaluation of timing plans still ran off-line.", "items": [{"name": "Traffic simulatio ng", "text": "Agent-based models on census-derived synthetic populations let analysts compare interventions on identical populations.", "items": [{"name": "FRED agent-based system built on census-derived synthetic populations (Pittsburgh)", "kind": "product", "year": 2013, "url": "https://www.krellinst.org/csgf/conf/2023/abstracts/kitson2021", "verified": false}, {"name": "Agent-based modelling of epidemics on individual-level populations", "kind": "milestone", "year": 2008, "url": "https://en.wikipedia.org/wiki/Agent-based_model", "verified": false}], "img": null}, {"years": "2020s", "title": "Pandemic modelling goes policy-critical", "text": "COVID-19 forced models into daily decisions and led CDC to build a permanent forecasting centre.", "items": [{"name": "Imperial College COVID-19 Response Team models informed lockdown policy", "kind": "milestone", "year": 2020, "url": "https://en.wikipedia.org/wiki/Imperial_College_COVID-19_Response_Team", "verified": false}, {"name": "CDC CFA begins bi-weekly national and state flu forecasts (2023)", "kind": "milestone", "year": 2023, "url": "https://Www.Cdc.Gov/forecast-outbreak-analytics/annualreports/2024-annual-report.html", "verified": true}], "img": {"src": "img/epidemics-public-health-2.jpg", "credit": "Nrbelex at nl.en.wikipedia / CC BY-SA 2.5 / Wikimedia Commons", "alt": "CDC headquarters campus, Atlanta", "page": "https://commons.wikimedia.org/wiki/File:CDC_HDR_I.jpg"}}, {"years": "2025-26", "title": "Scenario twins for measles, H5N1 and mass events", "text": "Public simulators and city-scale twins run intervention scenarios, and Insight Net modelled importation risk for the FIFA World Cup 2026.", "items": [{"name": "CDC Insight Net: 180 partners; World Cup 2026 importation and spread modelling", "kind": "report", "year": 2026, "url": "https://www.cdc.gov/insight-net/php/about/", "verified": true}, {"name": "Johns Hopkins CORI H5N1 scenario-based human health risk assessment (updated Apr 2026)", "kind": "report", "year": 2026, "url": "https://cori.centerforhealthsecurity.org/wp-content/uploads/2026/06/CORI_HPAI_SBRA_Methods.pdf", "verified": true}, {"name": "CitySEIRCast: city-scale agent-based pandemic twin (Complex & Intelligent Systems)", "kind": "paper", "year": 2025, "url": "https://bura.brunel.ac.uk/handle/2438/30859", "verified": true}, {"name": "CDC interactive measles outbreak simulator", "kind": "product", "year": 2025, "url": "https://www.cdc.gov/cfa-behind-the-model/php/data-research/btm/index.html", "verified": true}], "img": null}], "Economies & agent-based societies": [{"years": "1990s", "title": "Sugarscape and artificial societies", "text": "Epstein and Axtell grow wealth, trade and conflict from simple local rules on a resource landscape. The 2050 Project (Brookings, WRI, Santa Fe Institute) frames it as a policy tool.", "items": [{"name": "Sugarscape: Growing Artificial Societies (Epstein and Axtell, MIT/Brookings Press)", "kind": "milestone", "year": 1996, "url": "https://en.wikipedia.org/wiki/Sugarscape", "verified": true}, {"name": "MIT Technology Review on artificial societies and the 2050 Project", "kind": "report", "year": 1997, "url": "https://www.technologyreview.com/1997/04/01/41624/artifical-societies/", "verified": true}], "img": {"src": "img/economies-agent-based-societies-0.png", "credit": "The Financial Post / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Standard_Stock_and_Mining_Exchange_trading_floor,_Toronto.png", "alt": "Brokers on a stock exchange trading floor, Toronto, early 20th century"}}, {"years": "2008-2023", "title": "Central banks adopt ABMs", "text": "The 2007-09 crisis exposed the blind spots of equilibrium models and pushed central banks toward heterogeneous-agent simulation. Research prototypes begin pairing households, firms, banks and a policy agent.", "items": [{"name": "Central bank ABM work grows after 2007-09 crisis, per Bank of England survey", "kind": "report", "year": 2025, "url": "https://www.bankofengland.co.uk/working-paper/2025/agent-based-modeling-at-central-banks-recent-developments-and-new-challenges", "verified": true}, {"name": "ABIDES-Economist: households, firms, central bank and government with multi-agent RL (JPMorgan AI Research)", "kind": "paper", "year": 2024, "url": "https://arxiv.org/abs/2402.09563v1", "verified": true}], "img": null}, {"years": "2024-2025", "title": "Million-agent city twins", "text": "AgentTorch runs 8.4 million LLM-flavoured agents for New York City on commodity hardware. MIT describes validation against census data, though that claim is promotional.", "items": [{"name": "AgentTorch: LLM-guided ABM with 8.4M agents for New York City (MIT Media Lab)", "kind": "paper", "year": 2024, "url": "https://arxiv.org/html/2409.10568v1", "verified": true}, {"name": "Bank of England SWP 1,122: Agent-based modeling at central banks", "kind": "paper", "year": 2025, "url": "https://www.bankofengland.co.uk/working-paper/2025/agent-based-modeling-at-central-banks-recent-developments-and-new-challenges", "verified": true}], "img": {"src": "img/economies-agent-based-societies-2.jpg", "credit": "Robin Sones / CC BY-SA 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Bank_of_England,_Threadneedle_Street_-_geograph.org.uk_-_6558813.jpg", "alt": "Bank of England building on Threadneedle Street, London"}}, {"years": "2025-2026", "title": "ABMs inside policy workflows", "text": "Central banks and ministries now convene around ABMs as routine complements to DSGE models. A UK government-linked model initialised on household microdata feeds the Seventh Carbon Budget.", "items": [{"name": "ECB ABM4Policy workshop, Frankfurt, with Bank of Canada, BoE and IMF speakers", "kind": "milestone", "year": 2025, "url": "https://www.ecb.europa.eu/press/conferences/html/20250626_abm4policy.fi.html", "verified": true}, {"name": "On the limits of agency in agent-based models (MIT Media Lab, AAMAS 2025)", "kind": "paper", "year": 2025, "url": "https://www.media.mit.edu/posts/new-paper-on-limits-of-agency-at-aamas-2025/", "verified": true}, {"name": "Agent-based macroeconomics for the UK's Seventh Carbon Budget (INET Oxford with DESNZ)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/html/2602.15607v1", "verified": true}], "img": null}], "Disasters & emergency response": [{"years": "1950s-1990s", "title": "Surge models after 1953", "text": "The 1953 North Sea flood drove Dutch surge modelling and the Delta Works. In the US, FEMA and NIBS built HAZUS97 as a standard earthquake loss-estimation model.", "items": [{"name": "North Sea flood of 1953 and the Delta Works response", "kind": "milestone", "year": 1953, "url": "https://en.wikipedia.org/wiki/North_Sea_flood_of_1953", "verified": false}, {"name": "HAZUS97: FEMA/NIBS standard loss-estimation methodology", "kind": "product", "year": 1997, "url": "https://en.wikipedia.org/wiki/HAZUS", "verified": true}], "img": {"src": "img/disasters-emergency-response-0.jpg", "credit": "J.D. (Daan) Noske / CC0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Bezoek_koningin_Juliana_aan_Nieuw-Vossemeer_na_de_Watersnood_van_1953.jpg", "alt": "Queen Juliana visiting a flooded Dutch village after the 1953 North Sea flood"}}, {"years": "2000s-2010s", "title": "Multi-hazard loss modelling", "text": "HAZUS-MH extends the GIS loss model to river and coastal flood and hurricane wind. Hurricane Katrina in 2005 showed how little live data fed these static models.", "items": [{"name": "HAZUS-MH adds flood and hurricane wind to FEMA loss estimation", "kind": "product", "year": 2003, "url": "https://www.enr.com/articles/30346-hazard-modeling-tool-will-be-free-1-27-2003", "verified": true}, {"name": "FEMA/NIBS HAZUS history and 1999 earthquake release", "kind": "report", "year": 1999, "url": "https://nextgov.com/digital-government/1999/12/fema-updates-hazard-software/195714", "verified": true}], "img": {"src": "img/disasters-emergency-response-1.jpg", "credit": "NASA / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:NASA_Michoud_Katrina_Flooding.jpg", "alt": "Flooded New Orleans area around NASA Michoud after Hurricane Katrina, 2005"}}, {"years": "2018-2024", "title": "AI flood forecasts at scale", "text": "Hydrologic plus inundation models run continuously for river basins worldwide. The Netherlands' Maeslant barrier is the older model-driven closure system, still decided by computer.", "items": [{"name": "Google Flood Hub: river forecasts for about 700M people in 100+ countries", "kind": "product", "year": 2024, "url": "https://blog.google/technology/ai/expanding-flood-forecasting-coverage-helping-partners/", "verified": true}, {"name": "Maeslantkering storm surge barrier closes on computer-driven surge forecasts", "kind": "milestone", "year": 1997, "url": "https://en.wikipedia.org/wiki/Maeslantkering", "verified": false}, {"name": "Destination Earth phase three runs to June 2028", "kind": "milestone", "year": 2025, "url": "https://www.alphagalileo.org/en-gb/Item-Display/ItemId/274826", "verified": true}], "img": {"src": "img/disasters-emergency-response-2.jpg", "credit": "DeltaWorks Online - Eszter Simonfi / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Maeslantkering.jpg", "alt": "Maeslant storm surge barrier in the Netherlands"}}, {"years": "2025-2026", "title": "Earth twins feed crisis rooms", "text": "DestinE data entered the EU emergency centre's operational products in June 2025. Startups and labs pair evacuation behaviour models with wildfire and flood twins.", "items": [{"name": "DestinE data first used in ERCC operational products, Nigeria flood response", "kind": "milestone", "year": 2025, "url": "https://civil-protection-knowledge-network.europa.eu/stories/innovation-operations-how-destination-earth-strengthens-eu-crisis", "verified": true}, {"name": "NASA-funded wildfire digital twin at George Mason University", "kind": "paper", "year": 2026, "url": "https://www.gmu.edu/news/2026-01/nasa-funded-wildfire-digital-twin-could-save-assets-and-lives-pollution-prediction", "verified": true}, {"name": "WUI-Go! wins $1.23M NSF SBIR Phase II for wildfire evacuation twin", "kind": "startup", "year": 2026, "url": "https://its.berkeley.edu/node/6595", "verified": true}], "img": {"src": "img/disasters-emergency-response-3.jpg", "credit": "Reddalo / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Aerial_view_of_ECMWF_in_Bologna,_Italy_-_2024.jpg", "alt": "Aerial view of the ECMWF data centre campus in Bologna, Italy"}}], "Cardiac & organ twins": [{"years": "1990s-2000s", "title": "CFD meets the coronary tree", "text": "Stanford's Taylor and Zarins spent about 15 years turning CT angiograms into blood-flow and pressure fields. The aim: replace invasive pressure wires with computed FFR.", "items": [{"name": "Noble model of cardiac pacemaker cell electrophysiology", "kind": "paper", "year": 1962, "url": "https://en.wikipedia.org/wiki/Denis_Noble", "verified": false}, {"name": "HeartFlow co-founders cite 15 years of Stanford CFD research behind first trial", "kind": "milestone", "year": 2011, "url": "https://heartflow.com/our-story", "verified": true}], "img": {"src": "img/cardiac-organ-twins-0.png", "credit": "Henry Vandyke Carter / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Gray_internal_structure_of_heart.png", "alt": "Engraving of the internal structure of the human heart from Gray's Anatomy"}}, {"years": "2010s", "title": "First trials and an FDA pact", "text": "DISCOVER-FLOW tested the CT-derived FFR against invasive FFR in 103 patients. Dassault's Living Heart Project then signed with FDA to test device review on a simulated heart.", "items": [{"name": "DISCOVER-FLOW first-in-human FFR-CT trial, 103 patients (JACC)", "kind": "paper", "year": 2011, "url": "https://www.tctmd.com/news/discover-flow-published-noninvasive-ffr-shows-high-diagnostic-accuracy", "verified": true}, {"name": "FDA and Dassault Systemes collaborate on the Living Heart Project", "kind": "milestone", "year": 2014, "url": "https://www.todaysmedicaldevelopments.com/news/medical-device-design-dassault-systemes-living-heart-project-fda-111314", "verified": true}, {"name": "FDA-Dassault collaboration extended five years for device review and in silico trials", "kind": "milestone", "year": 2019, "url": "https://www.3ds.com/newsroom/press-releases/dassault-systemes-and-fda-extend-collaboration-inform-cardiovascular-device-review-process-and-accelerate-access-new-treatments", "verified": true}], "img": {"src": "img/cardiac-organ-twins-1.jpg", "credit": "Goleisureintl / CC BY 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Coronary_CT_Angiography_Scan.jpg", "alt": "Coronary CT angiography scan of the heart"}}, {"years": "2020-2024", "title": "Cleared planning twins", "text": "Pre-procedure heart models reach clinics under 510(k). Ten-year follow-up shows FFR-CT predicts outcomes as well as invasive FFR.", "items": [{"name": "FEops HEARTguide gets FDA clearance for left atrial appendage occlusion planning", "kind": "product", "year": 2022, "url": "https://www.businesswire.com/news/home/20220404005502/en/FEops-HEARTguide-Receives-FDA-Clearance-for-LAAo-Planning-Capabilities", "verified": true}, {"name": "inHEART gets FDA clearance for AI 3D heart models used in VT ablation planning", "kind": "product", "year": 2024, "url": "https://www.auntminnie.com/clinical-news/ct/article/15666685/fda-clears-inhearts-digital-twin-of-the-heart", "verified": false}, {"name": "10-year DISCOVER-FLOW follow-up: FFR-CT as predictive as invasive FFR", "kind": "paper", "year": 2024, "url": "https://markets.financialcontent.com/ricentral/article/gnwcq-2024-3-12-heartflow-announces-publication-of-10-year-follow-up-data-from-the-discover-flow-study-in-the-journal-of-cardiovascular-computed-tomography", "verified": true}], "img": {"src": "img/cardiac-organ-twins-2.jpg", "credit": "Neoflash / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Herzkatheterlabor_modern.jpeg", "alt": "Modern cardiac catheterization laboratory"}}, {"years": "2025-2026", "title": "Public markets and a first trial", "text": "HeartFlow went public and won its own reimbursement code for plaque analysis. Johns Hopkins reported a 10-patient twin-guided VT ablation study in NEJM.", "items": [{"name": "HeartFlow Nasdaq IPO (HTFL), gross proceeds reported at $316.7M-$364.2M", "kind": "company", "year": 2025, "url": "https://www.medtechdive.com/news/heartflow-prices-ipo/756660/", "verified": true}, {"name": "TWIN-VT: cardiac digital twin guides VT ablation, 10 patients, no recurrence at 1+ year (NEJM, Johns Hopkins)", "kind": "paper", "year": 2026, "url": "https://hub.jhu.edu/2026/04/01/digital-twin-hearts-arrhythmia-trial/", "verified": true}, {"name": "HeartFlow Plaque Analysis gets own US reimbursement code from Jan 2026", "kind": "milestone", "year": 2026, "url": "https://www.fiercebiotech.com/medtech/heartflow-pumps-ipo-plans-300m", "verified": true}], "img": null}], "Cancer & oncology": [{"years": "1990s-2000s", "title": "Reaction-diffusion glioma models", "text": "Murray's group defined proliferation-invasion equations for glioma. Swanson and colleagues added faster motility in white matter on an anatomical brain.", "items": [{"name": "Reaction-Diffusion Models for Glioma Tumor Growth (review of the Murray/Swanson line)", "kind": "paper", "year": 2017, "url": "https://arxiv.org/pdf/1707.09409", "verified": true}, {"name": "Murray group proliferation-invasion model of glioma defined in the early 1990s", "kind": "milestone", "year": 1993, "url": "https://mobile.jci.org/references/scholar/32804/B24", "verified": false}], "img": {"src": "img/cancer-oncology-0.jpg", "credit": "The Armed Forces Institute of Pathology / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:AFIP-00405558-Glioblastoma-Radiology.jpg", "alt": "Radiology image of a glioblastoma brain tumour"}}, {"years": "2008-2022", "title": "Predicting radiotherapy response", "text": "Rockne and Swanson fit the model to serial MRI to predict radiotherapy response in individual glioblastoma patients. NCI-DOE launches seed twin projects across tumour types.", "items": [{"name": "Predicting efficacy of radiotherapy in individual glioblastoma patients in vivo (Rockne, Swanson et al.)", "kind": "paper", "year": 2010, "url": null, "verified": false}, {"name": "NCI-DOE seed digital-twin projects: pancreatic, melanoma, lung, others", "kind": "report", "year": 2022, "url": "https://www.frontiersin.org/journals/digital-health/articles/10.3389/fdgth.2022.1007784/pdf", "verified": true}], "img": {"src": "img/cancer-oncology-1.jpg", "credit": "Hellerhoff / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Glioblastoma_multiforme_-_MRT_T1KM_ax.jpg", "alt": "Contrast-enhanced MRI of a glioblastoma"}}, {"years": "2023-2024", "title": "Bayesian tumour twins", "text": "UT Austin's brain tumour twin starts from population priors and updates per patient from serial MRI. Simulated schedules gave equivalent tumour control with lower total radiation.", "items": [{"name": "UT Austin Oden Institute digital twins of brain tumors", "kind": "paper", "year": 2023, "url": "https://oden.utexas.edu/news-and-events/news/digital-twins-brain-tumors-computational-scientists-cancer-care/", "verified": true}, {"name": "NCI-DOE report on cancer patient digital twins, progress and next steps", "kind": "report", "year": 2023, "url": "https://datascience.cancer.gov/news-events/news/cancer-patient-digital-twins-progress-report-and-next-steps", "verified": true}], "img": {"src": "img/cancer-oncology-2.png", "credit": "Lin Zheng, Zhi-Rui Zhou, QianQian Yu, Minghan Shi, Yang Yang / CC BY 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Glioblastoma_radiation_treatment_plan.png", "alt": "Radiation treatment plan overlaid on a glioblastoma"}}, {"years": "2025-2026", "title": "First products, still research-use", "text": "SOPHiA GENETICS ships an oncology twin for lung cancer from clinical, imaging and genomic data. Academic work now spans prostate radiotherapy models and cervical cancer twins.", "items": [{"name": "SOPHiA DDM Digital Twins launched for lung cancer, research use only", "kind": "product", "year": 2025, "url": "https://www.aap.com.au/aapreleases/cision20251016ae99202", "verified": true}, {"name": "Editorial: multiscale cancer modeling, in silico oncology and digital twins (prostate radiotherapy model checked on 3 patients)", "kind": "paper", "year": 2025, "url": "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12146175/", "verified": true}, {"name": "MD Anderson / Oden / TACC seed funding for patient-specific cervical cancer twin", "kind": "milestone", "year": 2026, "url": "https://www.mdanderson.org/newsroom/new-funded-projects-from-joint-center-for-computational-oncology.h00-159859290.html", "verified": false}], "img": null}], "ICU & patient monitoring": [{"years": "1950s-1980s", "title": "Ventilators and physiology models", "text": "The 1952 Copenhagen polio epidemic created intensive care around mechanical ventilation. Guyton's 1972 computer circulation model and APACHE II scoring made physiology quantitative.", "items": [{"name": "Copenhagen polio epidemic of 1952 and the birth of intensive care", "kind": "milestone", "year": 1952, "url": "https://en.wikipedia.org/wiki/Intensive_care_medicine", "verified": false}, {"name": "Guyton, Coleman and Granger large computer model of circulatory control", "kind": "paper", "year": 1972, "url": "https://folia.unifr.ch/unifr/documents/301131", "verified": true}, {"name": "APACHE II severity score, validated on 5,815 ICU admissions at 13 hospitals", "kind": "paper", "year": 1985, "url": "https://pubmed.ncbi.nlm.nih.gov/3928249/", "verified": true}], "img": {"src": "img/icu-patient-monitoring-0.jpg", "credit": "The U.S. Food and Drug Administration / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Iron_Lung_(061)_(7184148409).jpg", "alt": "Iron lung respirator, the mechanical ventilator of the polio era"}}, {"years": "2000s-2010s", "title": "Tele-ICU command centers", "text": "Central stations watch vitals for every bed and alert remote intensivists. Philips eICU reports oversight of nearly 7,000 beds and over 20% of US adult ICU beds (company figures).", "items": [{"name": "Philips eICU enterprise tele-ICU program", "kind": "product", "year": 2008, "url": "https://www.philips.fi/healthcare/e/enterprise-telehealth/eicu", "verified": true}, {"name": "Epic Sepsis Model external validation found missed cases and many false alerts (JAMA Intern Med)", "kind": "paper", "year": 2021, "url": "https://doi.org/10.1001/jamainternmed.2021.2626", "verified": false}], "img": {"src": "img/icu-patient-monitoring-1.jpg", "credit": "U.S. Navy photo by Photographer's Mate 1st Class Shane T. McCoy / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:US_Navy_030423-N-6967M-090_A_central_computer_system_monitors_the_heart_rates_of_each_patient_in_the_Intensive_Care_Unit_(ICU)_to_ensure_a_quick.jpg", "alt": "Central computer station monitoring the heart rate of every ICU patient aboard a US Navy hospital ship"}}, {"years": "2024", "title": "Adaptive sepsis twins", "text": "An adaptive digital twin updated vitals about every 15 minutes and predicted adverse outcomes in ICU sepsis patients. LLMs trained on EHR data start forecasting patient trajectories.", "items": [{"name": "CHEST 2024: digital twin model predicts adverse outcomes in ICU sepsis patients", "kind": "milestone", "year": 2024, "url": "https://mdedge9-ma1.mdedge.com/node/271438/path_term/6", "verified": true}, {"name": "Large language models forecast patient health trajectories enabling digital twins (medRxiv)", "kind": "paper", "year": 2024, "url": "https://www.medrxiv.org/content/10.1101/2024.07.05.24309957.full.pdf", "verified": true}], "img": {"src": "img/icu-patient-monitoring-2.jpg", "credit": "Ismael Olea / CC BY 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:20250808_Intensive_care_unit_bed.jpg", "alt": "Intensive care unit bed with monitoring equipment"}}, {"years": "2025-2026", "title": "Funded ICU twins", "text": "DT-GPT beat baselines on an ICU benchmark by a small margin and ARPA-H bet $38M on an immune-response twin. New 2026 preprints test generative twins for sepsis treatment control.", "items": [{"name": "DT-GPT in npj Digital Medicine: ICU scaled MAE 1.3% below best baseline", "kind": "paper", "year": 2025, "url": "https://www.medrxiv.org/content/10.1101/2024.07.05.24309957.full.pdf", "verified": true}, {"name": "UVM wins up to $38M ARPA-H CIRCLE award for ReSCUED ICU immune twin", "kind": "milestone", "year": 2026, "url": "https://www.uvm.edu/uvmnews/news/your-ai-twin-could-save-your-life-uvm-awarded-38m-build-digital-twins-treating", "verified": true}, {"name": "EHR-MPC: inference-time control for sepsis treatment with generative patient twins", "kind": "paper", "year": 2026, "url": "https://arxiv.org/pdf/2607.08793", "verified": true}], "img": null}], "Virtual patients & in-silico trials": [{"years": "1970s-2000s", "title": "Simulated people take shape", "text": "Bergman and Cobelli's minimal model gave glucose-insulin kinetics a usable equation set. The Visible Human data and the Virtual Physiological Human effort supplied anatomy to match.", "items": [{"name": "Bergman-Cobelli minimal model of glucose kinetics", "kind": "paper", "year": 1979, "url": "https://pubmed.ncbi.nlm.nih.gov/37743740/", "verified": true}, {"name": "UVA/Padova simulator introduced with 300 virtual type 1 diabetes subjects", "kind": "milestone", "year": 2007, "url": "https://pubmed.ncbi.nlm.nih.gov/37743740/", "verified": true}, {"name": "NLM Visible Human Project", "kind": "milestone", "year": 1994, "url": "https://en.wikipedia.org/wiki/Visible_Human_Project", "verified": false}], "img": {"src": "img/virtual-patients-in-silico-trials-0.jpg", "credit": "The Visible Human Project / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:NLM_Visible_Human_Project_-_section_through_the_abdomen_of_a_human_male.jpg", "alt": "Cross-section through the abdomen from the NLM Visible Human Project, a reference dataset for virtual anatomy"}}, {"years": "2008-2019", "title": "Regulators accept simulators", "text": "FDA accepted the UVA/Padova simulator for preclinical insulin-strategy testing in 2008. Dassault's Living Heart in silico trial targeted pacemaker leads and device performance in virtual cohorts.", "items": [{"name": "FDA accepts UVA/Padova simulator as substitute for animal trials, Jan 2008", "kind": "milestone", "year": 2008, "url": "https://pubmed.ncbi.nlm.nih.gov/37743740/", "verified": true}, {"name": "Epsilon Group launches FDA-accepted Type 1 Diabetes Metabolic Simulator (T1DMS)", "kind": "product", "year": 2008, "url": "https://www.genomeweb.com/informatics/epsilon-group-launches-fda-approved-type-1-diabetes-simulator", "verified": true}, {"name": "FDA and Dassault extend Living Heart work, including an in silico clinical trial", "kind": "milestone", "year": 2019, "url": "https://www.3ds.com/newsroom/press-releases/dassault-systemes-and-fda-extend-collaboration-inform-cardiovascular-device-review-process-and-accelerate-access-new-treatments", "verified": true}], "img": {"src": "img/virtual-patients-in-silico-trials-1.png", "credit": "Gregory Marcus, MD, MAS, FACC / CC BY 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Fluoroscopy_pacemaker_leads_right_atrium_ventricle.png", "alt": "Fluoroscopy image of pacemaker leads in the right atrium and ventricle"}}, {"years": "2022-2024", "title": "Credibility rules and twin controls", "text": "EMA qualified Unlearn's twin-based covariate adjustment and FDA said it fits current guidance. FDA's final guidance on computational model credibility followed.", "items": [{"name": "EMA qualifies Unlearn PROCOVA digital-twin analysis for Phase 2/3 trials", "kind": "milestone", "year": 2022, "url": "https://www.clinicaltrialsarena.com/news/ema-qualifies-unlearn-approach/", "verified": true}, {"name": "Unlearn raises $50M Series C led by Altimeter", "kind": "startup", "year": 2024, "url": "https://dcvc.com/press-releases/unlearn-raises-50-million-series-c-to-optimize-clinical-research-with-ai-powered-digital-twin-technology", "verified": true}, {"name": "FDA final guidance on credibility of computational modeling in device submissions", "kind": "report", "year": 2023, "url": "https://www.hpnonline.com/regulatory/news/53078879/fda-issues-final-guidance-assessing-the-credibility-of-computational-modeling-and-simulation-in-medical-device-submissions", "verified": true}], "img": null}, {"years": "2025-2026", "title": "Policy pull toward in silico", "text": "FDA's April 2025 roadmap to cut animal testing names computational models as a pathway. Reviews now map where virtual patients are regulator-ready by physiological system.", "items": [{"name": "FDA roadmap to reduce animal testing: in silico models and other NAMs", "kind": "report", "year": 2025, "url": "https://www.hklaw.com/en/insights/publications/2025/04/fda-announces-plan-to-phase-out-animal-testing-requirement", "verified": true}, {"name": "In silico clinical trials in drug development: virtual patients, applications and regulatory convergence (Clin Pharmacol Ther)", "kind": "paper", "year": 2025, "url": "https://www.citedrive.com/en/discovery/in-silico-clinical-trials-in-drug-development-virtual-patients-applications-and-regulatory-convergence/", "verified": true}, {"name": "Advancing In Silico Clinical Trials for Regulatory Adoption and Innovation (IEEE JBHI)", "kind": "paper", "year": 2025, "url": "https://pubmed.ncbi.nlm.nih.gov/39514353/", "verified": true}], "img": null}], "Hospital operations": [{"years": "1990s-2010", "title": "Queueing and discrete-event simulation", "text": "Operations researchers modelled beds, ED flow and OR block time offline. LeanTaaS started in 2010 applying lean methods and predictive analytics as a service.", "items": [{"name": "Discrete-event simulation for bed, ED and OR capacity planning enters hospital operations", "kind": "milestone", "year": 1998, "url": null, "verified": false}, {"name": "LeanTaaS founded to sell lean, predictive capacity optimization as a service", "kind": "company", "year": 2010, "url": "https://leantaas.com/about/", "verified": false}], "img": {"src": "img/hospital-operations-0.jpg", "credit": "Unknown author / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Johns_Hopkins_Hospital,_early_photo.jpg", "alt": "Early photograph of the Johns Hopkins Hospital"}}, {"years": "2016-2021", "title": "NASA-style command centers", "text": "Johns Hopkins and GE built a mission-control room fusing bed, transport and OR data. Results: patients assigned beds 30% faster and critical care teams dispatched 63 minutes sooner.", "items": [{"name": "Johns Hopkins launches NASA-inspired Capacity Command Center", "kind": "milestone", "year": 2016, "url": "https://www.beckershospitalreview.com/healthcare-information-technology/johns-hopkins-hospital-launches-nasa-inspired-command-center-to-enhance-hospital-operations.html", "verified": true}, {"name": "HFM: command center leads to more efficient facility operations", "kind": "report", "year": 2016, "url": "https://www.hfmmagazine.com/articles/2595-command-center-leads-to-more-efficient-facility-operations", "verified": true}, {"name": "Capacity Command Center celebrates 5 years", "kind": "report", "year": 2021, "url": "https://www.hopkinsmedicine.org/news/articles/2021/03/capacity-command-center-celebrates-5-years-of-improving-patient-safety-access", "verified": true}], "img": {"src": "img/hospital-operations-1.jpg", "credit": "Adam Cuerden / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Eugene_F._Kranz_at_his_console_at_the_NASA_Mission_Control_Center.jpg", "alt": "Flight director Gene Kranz at his console in NASA Mission Control"}}, {"years": "2024-2025", "title": "Simulation twins on engagement terms", "text": "GE HealthCare builds a custom hospital simulation twin in roughly five months and uses it for surge and new-build planning. LeanTaaS wins Best in KLAS 2025 for capacity optimization.", "items": [{"name": "LeanTaaS Best in KLAS 2025, 200 health systems and 1,200+ hospitals", "kind": "report", "year": 2025, "url": "https://leantaas.com/press-releases/leantaas-recognized-as-best-in-klas-2025-for-capacity-optimization-management", "verified": true}, {"name": "GE HealthCare: capacity decisions with hospital digital twin (Children's Mercy, AdventHealth)", "kind": "product", "year": 2025, "url": "https://www.gehealthcare.com/insights/article/making-informed-capacity-decisions-with-digital-twin-technology", "verified": true}], "img": {"src": "img/hospital-operations-2.jpg", "credit": "Art Anderson / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Johns_Hopkins_Hospital,_No._1_for_21_Years_in_a_row_-_panoramio.jpg", "alt": "Johns Hopkins Hospital building in Baltimore"}}, {"years": "2025-2026", "title": "Twins feed AI operations software", "text": "LeanTaaS adds clinic-to-OR coordination. A 2026 JMIR report says GE HealthCare announced collaborations with two US health systems on AI operations software using twin inputs.", "items": [{"name": "JMIR 2026 report: can virtual mirrors fix hospital patient bottlenecks", "kind": "paper", "year": 2026, "url": "https://www.jmir.org/2026/1/e98113/PDF", "verified": true}, {"name": "LeanTaaS iQueue for Surgical Clinics launches for clinic-to-OR coordination", "kind": "product", "year": 2025, "url": "https://leantaas.com/press-releases/leantaas-launches-enhanced-iqueue-product-suites-to-maximize-efficiency-for-infusion-centers-operating-rooms-and-hospital-beds", "verified": false}], "img": null}], "Surgery & musculoskeletal": [{"years": "1990s", "title": "CT planning and the first robots", "text": "CT-based 3D planning and active robots entered orthopaedics in the 1990s. Materialise received its first FDA 510(k) for patient-specific anatomical models in 1997.", "items": [{"name": "ROBODOC active surgical robot for hip replacement", "kind": "product", "year": 1992, "url": "https://en.wikipedia.org/wiki/ROBODOC", "verified": false}, {"name": "Materialise first FDA 510(k) clearance", "kind": "company", "year": 1997, "url": "https://510kdatabase.net/materialise-nv", "verified": true}], "img": {"src": "img/surgery-musculoskeletal-0.jpg", "credit": "Hiroshi Inui, Shuji Taketomi, Kensuke Nakamura, Seira Takei et al. / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Radiograph_with_knee_angles.jpg", "alt": "Knee radiograph annotated with alignment angles"}}, {"years": "2010s", "title": "Haptic robots and cutting guides", "text": "Patient-specific cutting guides from CT or MRI reached FDA clearance for knee procedures. Stryker bought MAKO Surgical's haptic-boundary robot.", "items": [{"name": "Materialise osteotomy-around-the-knee planning clearance (2014)", "kind": "product", "year": 2014, "url": "https://510kdatabase.net/materialise-nv", "verified": false}, {"name": "Stryker acquires MAKO Surgical", "kind": "milestone", "year": 2013, "url": "https://en.wikipedia.org/wiki/Mako_Surgical", "verified": false}], "img": {"src": "img/surgery-musculoskeletal-1.jpg", "credit": "Nicoleon / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Chirurgien_son_robot_da-vinci.JPG", "alt": "Surgeon operating at a da Vinci surgical robot console"}}, {"years": "2024-2025", "title": "Robotics as the default", "text": "Stryker shows next-generation Mako at AAOS 2025 and reports more than 1.5M procedures. Materialise holds 60 clearances from 60 submissions.", "items": [{"name": "Stryker showcases next generation of Mako SmartRobotics at AAOS 2025", "kind": "product", "year": 2025, "url": "https://www.stryker.com/us/en/about/news/2025/stryker-showcases-next-generation-of-mako-smartrobotics--at-aaos.html", "verified": true}, {"name": "Materialise reaches 60 FDA 510(k) clearances (aggregator tally)", "kind": "report", "year": 2026, "url": "https://510kdatabase.net/materialise-nv", "verified": true}], "img": {"src": "img/surgery-musculoskeletal-2.jpg", "credit": "Jmarchn / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Knee_arthroplasty_due_to_a_chondrosarcoma.jpg", "alt": "X-ray of a knee replacement implant"}}, {"years": "2025-2026", "title": "Handheld robots and startup twins", "text": "Stryker launched Mako RPS, a handheld knee robot with intraoperative planning. Seed-stage twin startups and HSS push preoperative twins.", "items": [{"name": "Stryker launches Mako RPS handheld robotic knee system; platform tops 2.5M procedures", "kind": "product", "year": 2026, "url": "https://www.stryker.com/us/en/about/news/2026/stryker-expands-mako-robotics-portfolio.html", "verified": true}, {"name": "Twinsight closes EUR 1.6M seed after FDA 510(k) for SurgiTwin 3D", "kind": "startup", "year": 2026, "url": "https://www.orthoworld.com/wp-content/uploads/2026/07/twinsight_071726.pdf", "verified": true}, {"name": "Kinomatic raises $4M seed for knee and hip replacement planning and recovery", "kind": "startup", "year": 2026, "url": "https://www.beckersspine.com/orthopedic/ai-joint-replacement-company-raises-4m-names-chief-medical-officer/", "verified": true}, {"name": "Significant gift funds HSS Digital Twin Platform for orthopedic care", "kind": "milestone", "year": 2025, "url": "https://www.eagletribune.com/region/significant-gift-funds-development-of-the-hss-digital-twin-platform-for-optimizing-orthopedic-care/article_56566b52-74dd-557c-931a-326d73f1ea1c.html", "verified": false}], "img": null}], "Metabolic & personal health twins": [{"years": "1970s-2000s", "title": "The minimal model", "text": "Bergman and Cobelli's 1979 minimal model turned glucose-insulin dynamics into a handful of fittable parameters. Meal and insulin-absorption subsystems grew it into the UVA/Padova simulator with 300 virtual subjects in 2007.", "items": [{"name": "Minimal model of glucose kinetics (Bergman and Cobelli, 1979)", "kind": "paper", "year": 1979, "url": "https://pubmed.ncbi.nlm.nih.gov/37743740/", "verified": true}, {"name": "UVA/Padova simulator introduced with 300 virtual subjects", "kind": "milestone", "year": 2007, "url": "https://pubmed.ncbi.nlm.nih.gov/37743740/", "verified": true}], "img": {"src": "img/metabolic-personal-health-twins-0.jpg", "credit": "Christidy at English Wikipedia / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Glucose_meters.jpg", "alt": "Handheld blood glucose meters"}}, {"years": "2008-2021", "title": "Simulators gate closed-loop devices", "text": "With FDA accepting the simulator in 2008, insulin control algorithms could be tested in silico before human trials. Twin Health raised a $140M Series C in 2021 for its whole-body twin.", "items": [{"name": "FDA accepts UVA/Padova simulator for preclinical insulin strategy testing", "kind": "milestone", "year": 2008, "url": "https://pubmed.ncbi.nlm.nih.gov/37743740/", "verified": true}, {"name": "Twin Health raises $140M Series C", "kind": "startup", "year": 2021, "url": "https://www.drugdeliverybusiness.com/metabolic-disease-reversal-tech-company-twin-health-raises-140m-series-c/", "verified": true}], "img": {"src": "img/metabolic-personal-health-twins-1.jpg", "credit": "WikiFish1385 / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Insulin_pump_Medtronic_Paradigm_754.jpg", "alt": "Medtronic Paradigm insulin pump"}}, {"years": "2023-2024", "title": "Automated insulin delivery at scale", "text": "Model-based controllers now run for tens of thousands of users. Omnipod 5 users in the real-world analysis spent 93.7% of time in automated mode (company-reported).", "items": [{"name": "Real-world Omnipod 5 AID use in 69,902 people with type 1 diabetes", "kind": "paper", "year": 2024, "url": "https://pubmed.ncbi.nlm.nih.gov/38375861/", "verified": true}, {"name": "Developing the UVA/Padova Type 1 Diabetes Simulator: modeling, validation, refinements, utility", "kind": "paper", "year": 2023, "url": "https://pubmed.ncbi.nlm.nih.gov/37743740/", "verified": true}], "img": {"src": "img/metabolic-personal-health-twins-2.jpg", "credit": "Thirunavukkarasye-Raveendran / CC BY 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:FreeStyle_libre_am_Oberarm_und_Auslesegerät-4.JPG", "alt": "Continuous glucose sensor worn on the upper arm with its reader"}}, {"years": "2025-2026", "title": "Whole-body twins and CGM AI", "text": "Twin Health sells a per-member twin to employers and health plans on outcome-based terms. Signos layers AI on Dexcom's over-the-counter CGM as a GLP-1 companion.", "items": [{"name": "Twin Health $53M Series E at $950M+ valuation; NEJM Catalyst study with Cleveland Clinic", "kind": "startup", "year": 2025, "url": "https://www.fortune.com/2025/08/21/exclusive-twin-health-metabolic-health-startup-raises-53-million-series-e-at-950-million-valuation", "verified": true}, {"name": "Signos takes $20M from GV, BCBS Alabama and Dexcom; AI on Dexcom Stelo", "kind": "startup", "year": 2026, "url": "https://insider.fitt.co/signos-pushes-cgms-beyond-tracking/", "verified": true}], "img": {"src": "img/metabolic-personal-health-twins-3.jpg", "credit": "MailariX / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Medtronic_MiniMed_780G_insulinpump.jpg", "alt": "Medtronic MiniMed 780G automated insulin pump"}}], "Protocol & deck simulation": [{"years": "1980s-1990s", "title": "Robot arms, hand-taught", "text": "Zymark's Zymate (shown at Pittcon 1982) put a bench robot arm in labs; methods were taught by hand and debugged on real samples. Zymark sold thousands of systems, but each method lived on one machine.", "items": [{"name": "Zymark Zymate robot shown at PittCon 1982; Zymark later cited 2,500+ robotic systems built", "kind": "product", "year": 1982, "url": "https://msuweb.montclair.edu/~olsenk/robot.htm", "verified": true}, {"name": "Zymark sponsored the ISLAR lab-robotics symposium, 1983-2003", "kind": "milestone", "year": 1983, "url": "https://msuweb.montclair.edu/~olsenk/robot.htm", "verified": true}], "img": {"src": "img/protocol-deck-simulation-0.jpg", "credit": "National Institute of Allergy and Infectious Diseases / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Robot_arm_handles_an_assay_plate.jpg", "alt": "Laboratory robot arm handling an assay plate"}}, {"years": "2000s-2013", "title": "Vendor method editors", "text": "Pipetting-robot vendors added method editors with deck layouts and basic dry-run checks. Simulation stayed proprietary and tied to each vendor's hardware.", "items": [{"name": "Eppendorf epMotion and Biomek-class workstations used deck-layout method editors in core labs", "kind": "product", "year": 2008, "url": "https://commons.wikimedia.org/wiki/File:BioMek_FX_P200_96_liquid_handling_robot.jpg", "verified": false}], "img": {"src": "img/protocol-deck-simulation-1.jpg", "credit": "NIAID / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:BioMek_FX_P200_96_liquid_handling_robot.jpg", "alt": "Biomek FX 96-channel liquid handling robot"}}, {"years": "2014-2023", "title": "Open-source robots, Python protocols", "text": "Opentrons made the protocol a Python file that could be simulated on a laptop before touching hardware. Funding followed as labs adopted the API.", "items": [{"name": "Opentrons announces $200M Series C led by SoftBank Vision Fund 2", "kind": "report", "year": 2021, "url": "https://opentrons.com/archives/news/press-release-opentrons-announces-200-million-series-c-round-led-by-softbank", "verified": true}, {"name": "opentrons PyPI package: opentrons_simulate CLI and simulate() for Flex and OT-2", "kind": "product", "year": 2023, "url": "https://pypi.org/project/opentrons", "verified": true}], "img": {"src": "img/protocol-deck-simulation-2.jpg", "credit": "Junta de Andalucía / CC BY-SA 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:2020_06_11_Puesta_en_marcha_de_las_estaci%C3%B3n_robotizada_del_Hospital_Regional_de_M%C3%A1laga.jpg", "alt": "Opentrons pipetting robot station commissioned at a hospital lab"}}, {"years": "2024-2026", "title": "Simulate the AI's plan", "text": "LLM agents now write protocols, so pre-flight simulation becomes the safety layer. Opentrons is pairing its robots with NVIDIA physical-AI tooling.", "items": [{"name": "Opentrons Labworks and NVIDIA announce physical-AI lab robotics work, SLAS 2026", "kind": "milestone", "year": 2026, "url": "https://www.businesswire.com/news/home/20260205776615/en", "verified": false}, {"name": "Opentrons App 9.0 listed as adding simulation and visualization for AI-generated experiment plans (release not confirmed)", "kind": "product", "year": 2026, "url": "https://opentrons.com/", "verified": false}, {"name": "Opentrons names James Atwood CEO, July 2025", "kind": "milestone", "year": 2025, "url": "https://opentrons.com/", "verified": false}], "img": null}], "Deck state & vision": [{"years": "1990s-2010s", "title": "Trust the operator", "text": "Deck setup was a printed layout and a human check. Barcode scanning on plates helped, but tip racks, lids and fills were mostly unchecked.", "items": [{"name": "Eppendorf thesis topic seeks CNN labware/configuration classification for the epMotion 507x (shows the gap persisted)", "kind": "paper", "year": 2018, "url": "https://tams.informatik.uni-hamburg.de/theses/eppendorf/DeckVerification.pdf", "verified": false}], "img": {"src": "img/deck-state-vision-0.jpg", "credit": "Nadina Wiórkiewicz (Nad) / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Pipette_tips_boxes.jpg", "alt": "Racks of disposable pipette tips in tip boxes"}}, {"years": "2018-2022", "title": "Overview cameras appear", "text": "Vendors began bolting a single overview camera over the deck to flag wrong consumables or missing items before a run.", "items": [{"name": "CSEM DeckCheck: deep-learning deck check integrated into Tecan Fluent", "kind": "product", "year": 2022, "url": "https://csem.ch/en/news/digital-support-for-lab-techs-helps-them-avoid-mistakes", "verified": true}, {"name": "US patent application 20220276274: laboratory deck setup verification with neural-network labware ID", "kind": "patent", "year": 2022, "url": "https://patents.justia.com/patent/20220276274", "verified": true}], "img": {"src": "img/deck-state-vision-1.jpg", "credit": "Richard Summers / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Sanger_Institute_liquid_handling_robot.jpg", "alt": "Liquid handling robot with labware on its deck at the Sanger Institute"}}, {"years": "2023-2025", "title": "Shipped add-ons", "text": "Deck verification became a product line: camera, classifier, and a compare-to-protocol step that blocks the run on mismatch.", "items": [{"name": "Revvity Deck Verification kit for Fontus and JANUS G3: detects wrong consumables, misplaced labware", "kind": "product", "year": 2024, "url": "https://revvity.com/product/kit-deck-verification-cls159537", "verified": true}, {"name": "Roboflow lab-automation cameras: vision models trained per lab", "kind": "product", "year": 2025, "url": "https://roboflow.com/ai-cameras/lab-automation-cameras", "verified": false}], "img": {"src": "img/deck-state-vision-2.jpg", "credit": "Magnus Manske / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Eppendorf_epMotion_5075_liquid_handling_robot.JPG", "alt": "Eppendorf epMotion liquid handler with labware positions on the deck"}}, {"years": "2025-2026", "title": "Camera as reconciler", "text": "Newer work treats the camera feed as live state: a $50 camera plus segmentation and classification models checked against the active protocol.", "items": [{"name": "US patent publication 12517146: image-based deck verification before processing", "kind": "patent", "year": 2025, "url": "https://image-ppubs.uspto.gov/dirsearch-public/print/downloadPdf/12517146", "verified": true}, {"name": "US patent publication 12523668: laboratory deck setup verification", "kind": "patent", "year": 2026, "url": "https://image-ppubs.uspto.gov/dirsearch-public/print/downloadPdf/12523668", "verified": true}, {"name": "UCLA Undergraduate Research Week 2026 abstract: $50-camera deck detection against active protocol", "kind": "paper", "year": 2026, "url": "https://my.ucla.edu/conference/urweek2026/93/46563", "verified": false}], "img": null}], "Instrument twins & interop": [{"years": "1990s-2000s", "title": "Serial ports and drivers", "text": "Instruments spoke private serial or vendor-DLL protocols, so every integration was a custom driver. Status meant reading a front-panel light.", "items": [{"name": "SiLA consortium founded 2008 to standardize lab-instrument communication (founding date from background knowledge)", "kind": "milestone", "year": 2008, "url": "https://intuitionlabs.ai/articles/lab-instrument-integration-sila-2-allotrope-lims", "verified": false}], "img": {"src": "img/instrument-twins-interop-0.jpg", "credit": "Pdcook / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Microplate_reader.jpg", "alt": "Microplate reader instrument"}}, {"years": "2010s", "title": "SiLA, Allotrope, AnIML", "text": "Open standards for commands (SiLA) and data (Allotrope)
