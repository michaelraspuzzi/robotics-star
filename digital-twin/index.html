lus PLS models gave online glucose, lactate and titre estimates.", "items": [{"name": "Review: Raman and NIR enable real-time multi-parameter bioreactor monitoring", "kind": "paper", "year": 2023, "url": "https://arxiv.org/pdf/2310.09991", "verified": false}], "img": {"src": "img/bioprocess-bioreactor-twins-1.jpg", "credit": "RickLawless (talk) (Uploads) / CC BY 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:BTEC_Bioreactors.jpg", "alt": "Stainless-steel bioreactors at a biomanufacturing training center"}}, {"years": "2019-2024", "title": "Hybrid mechanistic-ML twins", "text": "Neural nets predict rates and yields that feed ODE mass balances, combining mechanism and data.", "items": [{"name": "Hybrid-model approach with Bayesian deep network feeding ODEs (PharmaLex blog)", "kind": "report", "year": 2023, "url": "https://pharmalex.com/thought-leadership/blogs/biologic-production-how-digital-twins-and-hybrid-modelling-optimize-cell-culture-process-for-better-production", "verified": false}, {"name": "Siemens: bioprocess digital twins for soft sensing, monitoring, optimization", "kind": "product", "year": 2023, "url": "https://resources.sw.siemens.com/en-US/bioprocess-digital-twins/", "verified": false}], "img": {"src": "img/bioprocess-bioreactor-twins-2.jpg", "credit": "CC1998USA / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Single-use_bioreactor.jpg", "alt": "Single-use bioreactor"}}, {"years": "2025-2026", "title": "Predictive twins and Raman fusion", "text": "Preprints push probabilistic hybrid twins and latent-ODE forecasting fused with Raman data.", "items": [{"name": "bioRxiv: hybrid modeling framework for predictive digital twins of CHO cell culture", "kind": "paper", "year": 2025, "url": "https://www.biorxiv.org/content/10.1101/2025.11.24.690194.full.pdf", "verified": true}, {"name": "arXiv review: Digital twins in biopharmaceutical manufacturing, human-machine collaborative intelligence", "kind": "paper", "year": 2025, "url": "https://arxiv.org/pdf/2504.00286", "verified": true}, {"name": "arXiv: Multipath adaptive gated bottleneck latent ODE with Raman data fusion for cell culture forecasting", "kind": "paper", "year": 2026, "url": "https://arxiv.org/pdf/2606.26520", "verified": false}], "img": {"src": "img/bioprocess-bioreactor-twins-3.jpg", "credit": "King of the north Snow / CC BY 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Scale_down_bioreactor_types.jpg", "alt": "Scale-down bioreactor types used to build process models"}}], "Cell & gene therapy manufacturing": [{"years": "1990s-2000s", "title": "Manual, open processing", "text": "Autologous cell products were made by technicians in open cleanroom steps. Chain of identity was paper and barcodes.", "items": [{"name": "Lonza partners with institutes on Cocoon closed autologous system (2020 report)", "kind": "report", "year": 2020, "url": "https://www.biopharma-reporter.com/Article/2020/03/10/Lonza-partners-with-three-institutes-on-Cocoon-system", "verified": false}], "img": {"src": "img/cell-gene-therapy-manufacturing-0.jpg", "credit": "Caron A. Jacobson and Jerome Ritz / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:CAR-Engineered_T-Cell_Adoptive_Transfer.jpg", "alt": "Schematic of CAR T cell engineering and adoptive transfer"}}, {"years": "2017-2022", "title": "First CAR-T approvals, closed devices", "text": "CAR-T approvals created demand for scalable closed, automated platforms that log every step.", "items": [{"name": "Lonza Cocoon: closed automated patient-scale autologous platform", "kind": "product", "year": 2021, "url": "https://www.bioprocessintl.com/therapeutic-class/lonza-looks-to-cocoon-to-drive-autologous-cell-therapy-paradigm-shift", "verified": false}], "img": {"src": "img/cell-gene-therapy-manufacturing-1.jpg", "credit": "CC1998USA / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Single-use_bag_in_ISO7_cleanrooms_by_TECNIC.jpg", "alt": "Single-use bag in an ISO 7 cleanroom"}}, {"years": "2023-2025", "title": "Automation as a factory", "text": "Cellares and Ori moved from instrument to integrated factory with software and data layers.", "items": [{"name": "Ori Biotech $120M pact to deploy automated platform for a commercial cell therapy", "kind": "milestone", "year": 2024, "url": "https://www.fiercepharma.com/pharma/ori-locks-down-120m-pact-deploy-automated-production-platform-unnamed-commercial-cell", "verified": true}, {"name": "Cellares turns from R&D to commercialization with automated manufacturing", "kind": "report", "year": 2025, "url": "https://www.pharmamanufacturing.com/home/article/55270813/cellares-turns-the-page-from-rd-to-commercialization-with-automated-cell-therapy-manufacturing", "verified": true}], "img": {"src": "img/cell-gene-therapy-manufacturing-2.webp", "credit": "Mohsen Sheykhhasan and Hamed Manoochehri / CC BY 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:CAR_T_cell_manufacturing_and_therapy.webp", "alt": "CAR T cell manufacturing and therapy workflow"}}, {"years": "2026", "title": "Commercial smart factories", "text": "Cellares raised its largest round and reported first GMP doses on the Cell Shuttle, with commercial-scale manufacturing planned from 2027.", "items": [{"name": "Cellares $257M Series D (co-led by BlackRock and Eclipse funds), total raised $612M", "kind": "startup", "year": 2026, "url": "https://www.fiercepharma.com/manufacturing/cellares-series-d-round-draws-257m-it-readies-commercial-production", "verified": true}, {"name": "Cellares Series D expanded to $327M with $50M from Prime Radiant Partners", "kind": "startup", "year": 2026, "url": "https://pulse2.com/cellares-expands-series-d-to-327-million-with-50-million-investment-from-prime-radiant-partners/", "verified": false}], "img": null}], "Pharma manufacturing, QC & PAT": [{"years": "2004-2013", "title": "PAT framework", "text": "FDA's 2004 PAT guidance invited real-time analytics and model-based control; adoption was slow outside pilots.", "items": [{"name": "FDA Emerging Technology Program established late 2014 to engage early on novel manufacturing", "kind": "milestone", "year": 2014, "url": "https://fda.gov/media/173811/download", "verified": true}], "img": {"src": "img/pharma-manufacturing-qc-pat-0.jpg", "credit": "The U.S. Food and Drug Administration / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:FDA_Bldg_64_-_Lab_(5160771733).jpg", "alt": "Laboratory in FDA Building 64, White Oak campus"}}, {"years": "2014-2022", "title": "Continuous lines approved", "text": "Continuous oral-solid lines combined weighing, blending, compression and RTRT, cutting release time to about a day for one product.", "items": [{"name": "EMA approves Janssen continuous manufacturing of HIV drug; line enables real-time release", "kind": "milestone", "year": 2016, "url": "https://www.fiercepharma.com/manufacturing/ema-gives-nod-to-janssen-for-continuous-manufacturing-hiv-drug", "verified": false}, {"name": "ICH Q13 on continuous manufacturing endorsed June 2021", "kind": "report", "year": 2021, "url": "https://intuitionlabs.ai/articles/ich-q13-continuous-manufacturing-regulatory-guide", "verified": true}], "img": {"src": "img/pharma-manufacturing-qc-pat-1.jpg", "credit": "RICHI Machinery / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Twin_screw_extruder.jpg", "alt": "Twin-screw extruder, a core unit of continuous manufacturing lines"}}, {"years": "2023-2025", "title": "Twins in the validation lifecycle", "text": "Reviews link digital twins to process validation stages and Q8-Q13 expectations.", "items": [{"name": "IJPharm X review: digital twins from drug discovery to continuous manufacturing (Sept 2025)", "kind": "paper", "year": 2025, "url": "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12516570/", "verified": true}], "img": null}, {"years": "2025-2026", "title": "PreCheck and onshoring", "text": "Onshoring policy pulls advanced controls into facility readiness reviews.", "items": [{"name": "FDA announces PreCheck program for new US drug facilities (Type V DMF)", "kind": "milestone", "year": 2025, "url": "https://www.arnoldporter.com/en/perspectives/advisories/2025/08/fda-announces-new-fda-precheck-program", "verified": true}, {"name": "USP comment letter: PAT and RTRT under PreCheck (Oct 2025)", "kind": "report", "year": 2025, "url": "https://qualitymatters.usp.org/fda-precheck-can-use-science-based-standards-and-methods-strengthen-us-drug-manufacturing", "verified": true}, {"name": "2026 preprint: digital twins across the three-stage validation lifecycle", "kind": "paper", "year": 2026, "url": "https://www.preprints.org/manuscript/202602.1643/v1", "verified": false}], "img": {"src": "img/pharma-manufacturing-qc-pat-3.jpg", "credit": "The U.S. Food and Drug Administration / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:FDA_Entrance_(16792957331).jpg", "alt": "FDA White Oak campus entrance"}}], "LIMS/ELN & lab data twins": [{"years": "1980s-2000s", "title": "LIMS and paper notebooks", "text": "Labs ran LIMS for samples and results while experiment records stayed in paper notebooks.", "items": [{"name": "Paper lab notebooks (Hahn 1938; LBNL lab book) show the record the ELN replaced", "kind": "milestone", "year": 1938, "url": "https://commons.wikimedia.org/wiki/File:Otto_Hahn%27s_notebook_1938_-_Deutsches_Museum_-_Munich.jpg", "verified": false}], "img": {"src": "img/lims-eln-lab-data-twins-0.jpg", "credit": "J Brew / CC BY-SA 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Otto_Hahn%27s_notebook_1938_-_Deutsches_Museum_-_Munich.jpg", "alt": "Otto Hahn's 1938 paper laboratory notebook"}}, {"years": "2010s", "title": "Cloud ELN", "text": "Cloud notebooks and registries moved biotech R&D records into SaaS.", "items": [{"name": "Benchling raised $100M Series F at $6.1B valuation", "kind": "startup", "year": 2021, "url": "https://sacra.com/c/benchling/", "verified": false}], "img": {"src": "img/lims-eln-lab-data-twins-1.jpg", "credit": "Daderot / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Lab_book_-_Lawrence_Berkeley_National_Laboratory_-_DSC08822.JPG", "alt": "Paper lab book at Lawrence Berkeley National Laboratory"}}, {"years": "2020-2024", "title": "Data clouds", "text": "Vendor-agnostic data platforms harmonized instrument output for analytics.", "items": [{"name": "TetraScience raises $80M to help life-science companies analyze data", "kind": "startup", "year": 2021, "url": "https://venturebeat.com/business/tetrascience-raises-80m-to-help-life-sciences-companies-analyze-data", "verified": false}], "img": {"src": "img/lims-eln-lab-data-twins-2.jpg", "credit": "Carl Lender from Sunrise, USA / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Datacenter_Server_Racks_(22370909788).jpg", "alt": "Data center server racks"}}, {"years": "2025-2026", "title": "AI agents on lab data", "text": "ELNs add agents; instrument makers partner with data platforms.", "items": [{"name": "Benchling launches AI agents (Deep Research, Compose, Data Entry), Oct 2025 (secondary source)", "kind": "product", "year": 2025, "url": "https://sacra.com/c/benchling/", "verified": false}, {"name": "Thermo Fisher teams with NVIDIA and TetraScience to bring AI into the lab", "kind": "milestone", "year": 2026, "url": "https://www.fiercebiotech.com/medtech/thermo-fisher-scientific-teams-nvidia-tetrascience-next-gen-ai-workflow-projects", "verified": true}, {"name": "TetraScience and Thermo Fisher collaborate on scientific data and AI (Jan 2026)", "kind": "milestone", "year": 2026, "url": "https://www.pharmafocuseurope.com/news/tetrascience-collaborates-with-thermo-fisher-scientific", "verified": false}], "img": null}], "Sample logistics, storage & biobanks": [{"years": "1949-1990s", "title": "Cryopreservation and paper ledgers", "text": "Glycerol cryoprotection and liquid-nitrogen dewars made indefinite storage possible. Locations lived in freezer maps and ledgers, so the 'twin' was a spreadsheet.", "items": [{"name": "Polge, Smith & Parkes: glycerol protects spermatozoa from freezing (Nature, 1949)", "kind": "paper", "year": 1949, "url": "https://en.wikipedia.org/wiki/Cryopreservation", "verified": false}, {"name": "Biobank concept: organised, annotated collections of human biological samples", "kind": "milestone", "year": 1990, "url": "https://en.wikipedia.org/wiki/Biobank", "verified": false}], "img": {"src": "img/sample-logistics-storage-biobanks-0.jpg", "credit": "U.S. Fish and Wildlife Service Southeast Region / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Filling_Cryopreservation_Dewar_with_Liquid_Nitrogen_%285544592746%29.jpg", "alt": "Technician filling a cryopreservation dewar with liquid nitrogen"}}, {"years": "2000s-2010s", "title": "Population biobanks, robotic stores", "text": "Population cohorts needed millions of barcoded tubes retrievable on demand, so tube-picking robots in -80 C stores replaced hand searches. LIMS records became the inventory twin.", "items": [{"name": "UK Biobank recruits 500,000 participants (2006-2010) and builds a central sample store", "kind": "milestone", "year": 2010, "url": "https://en.wikipedia.org/wiki/UK_Biobank", "verified": false}, {"name": "Hamilton launches compact BiOS stores holding 100K to more than 1 million samples", "kind": "product", "year": 2014, "url": "https://www.selectscience.net/article/hamilton-launches-compact-bios-automated-systems-that-store-100k-to-more-than-1-million-samples", "verified": true}], "img": {"src": "img/sample-logistics-storage-biobanks-1.jpg", "credit": "Nick Smith photography / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:ALSPAC_biological_samples_in_freezer.jpg", "alt": "Racks of biological samples in a freezer at the ALSPAC cohort biobank"}}, {"years": "2020-2024", "title": "Million-tube automated stores", "text": "Pharma and hospital biobanks now run fully automated -80 C and cryo stores with barcoded pick lists. The state model is location, count and chain of custody.", "items": [{"name": "IBBJ Jena: fully automated -80 C facility with -60 C and cryostorage, about 2.5 million samples", "kind": "milestone", "year": 2023, "url": "https://www.netzwerk-universitaetsmedizin.de/en/platforms/gbn/about-us/locations/jena", "verified": true}, {"name": "Moderna UK biobank: up to 1.2 million clinical samples at -80 C plus 25,000 in LN2", "kind": "milestone", "year": 2023, "url": "https://www.modernatx.com/en-GB/freezers", "verified": true}, {"name": "Hamilton BiOS systems to store more than 12 million UK Biobank samples, 8 million more of headroom", "kind": "milestone", "year": 2024, "url": "https://www.hamiltoncompany.com/press-releases/hamilton-bios-automated-storage-systems-to-strengthen-uk-biobanks-efforts-towards-improving-human-health", "verified": true}], "img": {"src": "img/sample-logistics-storage-biobanks-2.jpg", "credit": "Nick / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Samples_in_a_-80_freezer.jpg", "alt": "Boxed tubes of samples stored in a -80 C freezer"}}, {"years": "2025-26", "title": "Liquid handling joins the store", "text": "The frontier ties the store to automated aliquoting so each tube's handling history is logged end to end. Public evidence is thin and mostly procurement.", "items": [{"name": "UK Biobank tender UKBB0026: automated liquid handlers (Nov 2025)", "kind": "report", "year": 2025, "url": "https://www.find-tender.service.gov.uk/procurement/ocds-h6vhtk-05e55f", "verified": true}, {"name": "University of Miami Hussman Institute: new 6,500 sq ft automated biorepository for 5 million samples", "kind": "milestone", "year": 2025, "url": "https://magazine2.med.miami.edu/cold-storage/", "verified": false}], "img": null}], "Microfluidics & lab-on-chip": [{"years": "1979-1998", "title": "From silicon GC to soft lithography", "text": "A silicon gas chromatograph (1979) and the micro total analysis systems idea (1990) set the miniaturisation agenda. PDMS soft lithography in the late 1990s made chips cheap to prototype.", "items": [{"name": "Terry et al.: miniature silicon gas chromatograph on a wafer (Stanford, 1979)", "kind": "paper", "year": 1979, "url": "https://en.wikipedia.org/wiki/Microfluidics", "verified": false}, {"name": "Whitesides group: soft lithography in PDMS for rapid microfluidic prototyping", "kind": "milestone", "year": 1998, "url": "https://en.wikipedia.org/wiki/Soft_lithography", "verified": false}], "img": {"src": "img/microfluidics-lab-on-chip-0.jpg", "credit": "National Institute of Standards and Technology / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Lab_on_a_Chip_%287788250170%29.jpg", "alt": "A lab-on-a-chip microfluidic device held in a researcher's hand"}}, {"years": "2000-2013", "title": "Valves, droplets, organ-on-chip", "text": "Monolithic valves and droplet generators gave chips programmable fluid handling. Lung-on-a-chip (2010) showed chips could model organ function, not just assays.", "items": [{"name": "Huh et al.: reconstituting organ-level lung functions on a chip (Science, Wyss Institute, 2010)", "kind": "paper", "year": 2010, "url": "https://en.wikipedia.org/wiki/Organ-on-a-chip", "verified": false}, {"name": "Quake lab: monolithic microfabricated elastomer valves and pumps (Science, 2000)", "kind": "paper", "year": 2000, "url": "https://en.wikipedia.org/wiki/Microfluidics", "verified": false}], "img": {"src": "img/microfluidics-lab-on-chip-1.jpg", "credit": "Wyss Institute for Biologically Inspired Engineering, Harvard University / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Lung-on-a-chip-wyss.jpg", "alt": "Lung-on-a-chip microdevice from the Wyss Institute"}}, {"years": "2022-2025", "title": "Regulators open the door", "text": "FDA stopped requiring animal tests for drug approval in 2022 and in 2025 published a roadmap naming organ-chips. Twins today are CFD/FEM models of channel flow checked against chip data.", "items": [{"name": "FDA announces plan to phase out animal testing requirement, organ-on-chip included (Apr 10, 2025)", "kind": "report", "year": 2025, "url": "https://www.hklaw.com/en/insights/publications/2025/04/fda-announces-plan-to-phase-out-animal-testing-requirement", "verified": true}, {"name": "Emulate Liver-Chip S1 accepted into FDA ISTAND pilot, first organ-chip (Sept 2024)", "kind": "milestone", "year": 2024, "url": "https://emulatebio.com/liver-chip-accepted-into-fda-istand-pilot-program-lorna-ewart-interview/", "verified": true}, {"name": "Senate passes FDA Modernization Act 3.0 (S. 355) by unanimous consent, Dec 16, 2025", "kind": "milestone", "year": 2025, "url": "https://www.paul.senate.gov/dr-rand-paul-joins-sen-cory-booker-in-reintroducing-fda-modernization-act-3-0", "verified": false}], "img": {"src": "img/microfluidics-lab-on-chip-2.jpg", "credit": "Kbjung / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Organ_on_a_chip.jpg", "alt": "Organ-on-a-chip device with microchannels"}}, {"years": "2025-26", "title": "Qualification and chip twins", "text": "Emulate's qualification file now includes data from its next-gen AVA system. Academic twins pair Navier-Stokes physics with physics-informed neural nets and on-chip sensing.", "items": [{"name": "Emulate submits full FDA qualification package for Human Liver-Chip (Zoe and AVA data), Sept 2026", "kind": "milestone", "year": 2026, "url": "https://www.pharmaceuticalonline.com/doc/emulate-enters-final-stage-of-fda-istand-program-for-human-liver-chip-with-submission-of-qualification-package-covering-both-zo-and-ava-organ-chip-platforms-0001", "verified": true}, {"name": "Kansas State NSF project: physics-informed digital twin framework for organ-on-a-chip", "kind": "milestone", "year": 2024, "url": "https://www.k-state.edu/seek/fall-2024/davood-pourkargar-organ-drug-computer-modeling/", "verified": true}, {"name": "Preprint: concept for a continuously updated experimental-computational loop (bioimpedance digital twin), Sept 2026", "kind": "paper", "year": 2026, "url": "https://www.preprints.org/manuscript/202609.0135", "verified": false}], "img": {"src": "img/microfluidics-lab-on-chip-3.jpg", "credit": "Dominic Doyle & Frank Block, Vanderbilt University / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Microphysiological_System.jpg", "alt": "Microphysiological system chip used for organ modelling"}}], "Lab-in-the-loop AI design (DBTL)": [{"years": "1990s-2000s", "title": "Robot scientists and DBTL framing", "text": "Automated hypothesis-test cycles were first shown on yeast gene function with a robot scientist. Synthetic biology then named the design-build-test-learn loop.", "items": [{"name": "King et al.: functional genomic hypothesis generation and experimentation by a robot scientist (Nature, 2004)", "kind": "paper", "year": 2004, "url": "https://en.wikipedia.org/wiki/Robot_Scientist", "verified": false}, {"name": "Synthetic biology adopts engineering design-build-test cycles (iGEM founded 2004)", "kind": "milestone", "year": 2004, "url": "https://en.wikipedia.org/wiki/Synthetic_biology", "verified": false}], "img": {"src": "img/lab-in-the-loop-ai-design-dbtl-0.jpg", "credit": "Genome Management Information System, Oak Ridge National Laboratory / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Pg166_bioreactor.jpg", "alt": "Laboratory bioreactor vessel"}}, {"years": "2010s", "title": "Biofoundries and cloud labs", "text": "Foundries industrialised build-and-test with liquid handlers and strain pipelines. Cloud labs let scientists run protocols remotely, producing structured experiment logs.", "items": [{"name": "Ginkgo Bioworks: automated organism-engineering foundry", "kind": "company", "year": 2014, "url": "https://en.wikipedia.org/wiki/Ginkgo_Bioworks", "verified": false}, {"name": "Global Biofoundry Alliance formed to coordinate automated foundries (2019)", "kind": "milestone", "year": 2019, "url": "https://en.wikipedia.org/wiki/Laboratory_automation", "verified": false}], "img": {"src": "img/lab-in-the-loop-ai-design-dbtl-1.jpg", "credit": "Maggie Bartlett, National Human Genome Research Institute / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Chemical_Genomics_Robot.jpg", "alt": "Chemical genomics screening robot"}}, {"years": "2020-2024", "title": "Self-driving labs reach materials", "text": "Bayesian optimisation and ML planners now pick the next batch, and robots synthesise and characterise it. Materials discovery gave the first headline results.", "items": [{"name": "A-Lab (Berkeley Lab): autonomous synthesis of 41 of 58 predicted inorganic compounds (Nature, 2023)", "kind": "paper", "year": 2023, "url": "https://www.nature.com/articles/s41586-023-06734-w", "verified": false}, {"name": "Atinary: self-driving lab software combining AI, robotics and closed-loop experimentation", "kind": "startup", "year": 2024, "url": "https://sacra.com/c/lila-sciences/", "verified": false}], "img": {"src": "img/lab-in-the-loop-ai-design-dbtl-2.jpg", "credit": "National Institute of Allergy and Infectious Diseases / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Robot_arm_handles_an_assay_plate.jpg", "alt": "Robot arm handling an assay plate"}}, {"years": "2025-26", "title": "Capital floods autonomous science", "text": "Two labs raised unicorn-scale rounds to build AI-run experiment factories. Claims about experiment counts remain company assertions.", "items": [{"name": "Periodic Labs launches with $300M seed to build an AI // ================================================================ geometry rules
// 1) directions -> a convex polyhedron with one face per direction (intersection of half-spaces d·x <= 1).
//    Faces tile the surface exactly, so spikes built on them leave no gaps (a stellated polyhedron).
function polyhedron(dirs) {
  const n = dirs.length, verts = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let k = j + 1; k < n; k++) {
    const a = dirs[i], b = dirs[j], c = dirs[k];
    const m = new THREE.Matrix3().set(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
    if (Math.abs(m.determinant()) < 1e-6) continue;
    const p = V(1, 1, 1).applyMatrix3(m.clone().invert());
    if (dirs.every(d => d.dot(p) <= 1 + 1e-6) && !verts.some(q => q.distanceTo(p) < 1e-5)) verts.push(p);
  }
  const R0 = Math.max(...verts.map(v => v.length()));
  const faces = dirs.map(d => verts.filter(v => Math.abs(d.dot(v) - 1) < 1e-5));
  return { faces, R0 };
}
function basis(d) {
  const up = Math.abs(d.y) < 0.92 ? V(0, 1, 0) : V(1, 0, 0);
  const e1 = V().crossVectors(up, d).normalize(), e2 = V().crossVectors(d, e1);
  return [e1, e2];
}
// 2) resample a face polygon to K points at fixed angles, snapping the true corners into their nearest slot
function resample(d, poly, scale) {

  const c = poly.reduce((a, v) => a.add(v), V()).multiplyScalar(1 / poly.length);

  const order = P.map((p, i) => [Math.atan2(p[1], p[0]), i]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const Q = order.map(i => P[i]);
  const pts = [], corners = new Set();
  for (let k = 0; k < K; k++) {
    const th = k / K * Math.PI * 2, ux = Math.cos(th), uy = Math.sin(th);
    let best = Infinity;
    for (let e = 0; e < Q.length; e++) {
