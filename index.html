afer-transfer robots made electronics the high-volume, high-precision adopter.", "items": [{"name": "SCARA arm developed in Japan (Yamanashi Univ.)", "kind": "milestone", "year": 1981, "url": "", "verified": false}]}, {"years": "1990–2015", "title": "Electronics becomes the top customer", "text": "Phones, PCs and chips pulled in SCARA and delta robots; FANUC, Epson and Yaskawa sold into Asian contract manufacturers.", "items": [{"name": "Epson, FANUC, Yaskawa SCARA/6-axis lines", "kind": "company", "year": 2005, "url": "", "verified": false}]}, {"years": "2015–2024", "title": "Today: largest customer industry", "text": "Electrical/electronics took about 128,000 of 542,000 installs in 2024 (~24%,, the single largest segment, though cable and connector handling still needs people.", "items": [{"name": "IFR World Robotics 2025: electronics 128,000 installs in 2024", "kind": "report", "year": 2025, "url": "https://ifr.org/downloads/press_docs/2025-09-25-IFR_press_release_India_in_English.pdf", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: humanoids and learned cable insertion", "text": "Foxconn and Nvidia discussed humanoids on the Houston GB300 server line for around Q1 2026; academic work targets flexible flat cable insertion with RL.", "items": [{"name": "Foxconn/Nvidia in talks to deploy humanoids at Houston AI-server plant", "kind": "milestone", "year": 2025, "url": "https://tomshardware.com/tech-industry/semiconductors/nvidia-products-could-be-made-using-humanoid-robots-for-the-first-time-ever-company-in-talks-with-foxconn-to-deploy-them-in-houston-factory-building-gb300-ai-servers", "verified": false}, {"name": "Park et al., RL for flexible flat cable insertion, arXiv:2509.13731", "kind": "paper", "year": 2025, "url": "https://arxiv.org/abs/2509.13731", "verified": true}, {"name": "Sogang RIM Lab: force-aware ribbon-cable terminal insertion (conditionally accepted 2026)", "kind": "paper", "year": 2026, "url": "https://rim.sogang.ac.kr/research/factory-automation", "verified": true}, {"name": "FANUC/Nvidia Isaac Sim digital twins (Mar 2026)", "kind": "company", "year": 2026, "url": "https://iotm2mcouncil.org/iot-library/news/connected-industries-news/fanuc-partners-nvidia-on-industrial-robotics-ai/", "verified": true}]}], "metals, machining & welding": [{"years": "1952–1980", "title": "CNC and spot/arc welding", "text": "MIT demonstrated numerically controlled milling in 1952; robot spot welding arrived with Unimate in the early 1960s and arc welding in the 1970s.", "items": [{"name": "MIT numerically controlled milling machine", "kind": "milestone", "year": 1952, "url": "", "verified": false}, {"name": "Unimate spot welding at GM", "kind": "milestone", "year": 1961, "url": "", "verified": false}]}, {"years": "1980–2015", "title": "Teach-pendant welding cells", "text": "Welding became a staple robot application, but each new part needed hand programming, limiting use to high-volume work.", "items": [{"name": "Lincoln Electric and FANUC arc-welding cells", "kind": "company", "year": 2000, "url": "", "verified": false}]}, {"years": "2015–2024", "title": "Today: about 16% of installs", "text": "Metal and machinery is a leading mid-size customer; IFR notes metal-industry growth in Germany and India in 2024 (India metal installs +30% to 420 units).", "items": [{"name": "IFR India release: metal industry installs +30% to 420 units in 2024", "kind": "report", "year": 2025, "url": "https://ifr.org/downloads/press_docs/2025-09-25-IFR_press_release_India_in_English.pdf", "verified": true}]}, {"years": "2021–2024", "title": "Vision-led AI welding startups", "text": "Path Robotics raised $56M Series B and a $100M Series C in 2021 and a reported $100M Series D in 2024 to scan parts and plan welds with no programming. Machina Labs commercialised two-robot incremental sheet forming.", "items": [{"name": "Path Robotics $100M Series C (2021, Tiger Global)", "kind": "startup", "year": 2021, "url": "https://www.robotics247.com/article/path_robotics_raises_100m_in_series_c_financing_for_autonomous_welding", "verified": true}, {"name": "Path Robotics Series D $100M (Matter Venture Partners; listing date Oct 2024, unconfirmed)", "kind": "startup", "year": 2024, "url": "https://seedtable.com/companies/path-robotics/funding-rounds/series-d-2024-10", "verified": false}, {"name": "US 11,865,716 B2, Part forming using intelligent robotic system, Machina Labs Inc.", "kind": "patent", "year": 2024, "url": "https://patents.google.com/patent/US11865716", "verified": true}, {"name": "US 11,648,683 B2, Autonomous welding robots, Path Robotics", "kind": "patent", "year": 2023, "url": "https://patents.google.com/patent/US11648683", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: mobile welding and robotic factories", "text": "Path launched a legged mobile welder and its core seam-planning patent was re-examined; Machina raised a large round to build a 50-cell factory.", "items": [{"name": "Path Robotics launches Rove (Obsidian AI + quadruped), Saronic early adopter, Apr 16 2026", "kind": "product", "year": 2026, "url": "https://www.plantautomation-technology.com/pressreleases/path-robotics-launches-rove-bringing-mobility", "verified": true}, {"name": "US 12,070,867 C1 (Path Robotics, Autonomous welding robots), reexamination certificate Aug 4 2026", "kind": "patent", "year": 2026, "url": "https://www.uspto.gov/web/patents/dailycert/20260804-Tuesday/US12070867-20260804.html", "verified": true}, {"name": "Machina Labs $124M Series C (Woven Capital, Lockheed Martin Ventures), Feb 5 2026; 200,000 sq ft factory, up to 50 RoboCraftsman cells", "kind": "startup", "year": 2026, "url": "https://www.therobotreport.com/machina-labs-raises-124m-to-launch-large-scale-intelligent-u-s-factory/", "verified": true}]}], "food, pharma & packaging": [{"years": "1960s–1990s", "title": "Packaging and palletizing", "text": "Pick-and-place and palletizing robots plus the delta robot (invented 1985 by Reymond Clavel) built the packaging automation base.", "items": [{"name": "Delta parallel robot invented (Clavel, EPFL)", "kind": "milestone", "year": 1985, "url": "", "verified": false}]}, {"years": "1990–2015", "title": "Palletizing saturates", "text": "Case packing and palletizing became standard in food, beverage and pharma; ABB and others sell standard palletizing cells.", "items": [{"name": "ABB palletizing cells", "kind": "company", "year": 2010, "url": "", "verified": false}]}, {"years": "2013–2024", "title": "Soft and AI-guided picking", "text": "Soft Robotics (founded 2013) applied compliant grippers to food; Chef Robotics (founded 2019) targeted meal assembly with learned vision, by 2025 over 40M meals assembled.", "items": [{"name": "Chef Robotics $43.1M Series A (Avataar-led, $20.6M equity + $22.5M equipment debt), 40M+ meals, Mar 31 2025", "kind": "startup", "year": 2025, "url": "https://agfundernews.com/breaking-chef-robotics-raises-43m-series-a-to-scale-ai-enabled-robotics-in-meal-assembly", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: robots-as-a-service and hard-to-grasp food", "text": "Robot-as-a-service financing lets plants lease food-assembly robots; research targets granular, entangled and deformable items.", "items": [{"name": "Chef Robotics RaaS financing and ChefOS embodied-AI layer (2025)", "kind": "company", "year": 2025, "url": "https://thespoon.tech/food-assembly-robot-startup-chef-robotics-raises-43m-series-a-as-it-reaches-40-million-meal-milestone/", "verified": true}, {"name": "Replaceable Bit-based Gripper for Picking Cluttered Food Items, arXiv:2601.00305", "kind": "paper", "year": 2026, "url": "https://arxiv.org/html/2601.00305v1", "verified": true}]}], "lab automation & self-driving labs": [{"years": "1980s–2004", "title": "Lab robotics and the robot scientist", "text": "Benchtop lab robots appeared in the early 1980s; the Adam robot scientist (King et al., Science 2004) autonomously ran yeast genetics experiments.", "items": [{"name": "Adam robot scientist, King et al., Science", "kind": "paper", "year": 2004, "url": "", "verified": false}]}, {"years": "2012–2022", "title": "Cloud labs and open liquid handlers", "text": "Opentrons (founded 2013) and Emerald Cloud Lab made automation programmable and remote; self-driving labs spread in chemistry and materials.", "items": [{"name": "Opentrons Flex launch (>10,000 systems deployed by 2026 per company)", "kind": "product", "year": 2021, "url": "", "verified": false}]}, {"years": "2023–2024", "title": "Autonomous materials discovery", "text": "The Berkeley A-Lab reported autonomous synthesis of inorganic compounds (Nature, 2023), with later critique of its claims.", "items": [{"name": "A-Lab, Szymanski et al., Nature", "kind": "paper", "year": 2023, "url": "", "verified": false}]}, {"years": "2025–2026", "title": "Frontier tip: AI-science labs raise nine-figure rounds", "text": "Funding shifted to autonomous labs as data engines for AI models; Opentrons moved toward agent-to-agent workflows.", "items": [{"name": "Periodic Labs $300M seed (a16z-led; reported ~$1B pre-money), Sept 2025", "kind": "startup", "year": 2025, "url": "https://siliconangle.com/2025/10/01/periodic-labs-raises-300m-accelerate-scientific-research-ai/", "verified": true}, {"name": "Lila Sciences $235M Series A (Sept 2025) extended to $350M, Oct 2025", "kind": "startup", "year": 2025, "url": "https://www.biopharmatrend.com/post/1374-lila-sciences-raises-235m-to-expand-ai-driven-autonomous-science-platform", "verified": true}, {"name": "Opentrons and HighRes agent-to-agent lab workflow demo, SLAS 2026", "kind": "product", "year": 2026, "url": "https://opentrons.com/archives/news/highres-and-opentrons-announce-strategic-partnership-to-launch-the-industrys-first-ai-agent-to-agent-lab-automation-workflow", "verified": true}, {"name": "Opentrons names James Atwood CEO (Jan 29 2026)", "kind": "company", "year": 2026, "url": "https://www.businesswire.com/news/home/20260129266756/en/Opentrons-Global-Robotics-Chief-James-Atwood-Named-Chief-Executive-Officer", "verified": true}, {"name": "Opentrons Protocol Visualization (App 9.0, Apr 2026)", "kind": "product", "year": 2026, "url": "https://www.automation.com/article/opentrons-dynamic-simulation-visualization-ai-generated-lab-workflows", "verified": true}]}], "recycling & waste sorting": [{"years": "1970s–2008", "title": "Optical and manual sorting", "text": "Material recovery facilities relied on hand picking plus near-infrared optical sorters and air jets.", "items": [{"name": "NIR optical sorters in MRFs", "kind": "milestone", "year": 1995, "url": "", "verified": false}]}, {"years": "2009–2018", "title": "Robot pickers", "text": "ZenRobotics (Finland, 2009) fielded early robotic waste pickers; AMP Robotics was founded in 2014 and Greyparrot in 2019.", "items": [{"name": "ZenRobotics robotic waste sorting launch", "kind": "company", "year": 2009, "url": "", "verified": false}, {"name": "AMP Robotics founded", "kind": "company", "year": 2014, "url": "", "verified": false}]}, {"years": "2018–2024", "title": "AI vision sorts at line speed", "text": "AMP's neural-net platform and Cortex robots scaled to many MRFs; AMP raised $91M in Dec 2024 per CB Insights.", "items": [{"name": "AMP Robotics last round $91M (Dec 5 2024, per CB Insights)", "kind": "startup", "year": 2024, "url": "https://www.cbinsights.com/company/amp-robotics/financials", "verified": true}, {"name": "Justia application: Systems and Methods for Sorting Recyclable Items (assignee not confirmed)", "kind": "patent", "year": 2019, "url": "https://patents.justia.com/patent/20190030571", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: financing and capacity expansion", "text": "Glacier raised a $16M Series A in spring 2025 and claims 30+ materials at ~45 items per minute (company figures); AMP is pivoting into owning processing capacity.", "items": [{"name": "Glacier $16M Series A (EIF-led, with NEA, AlleyCorp, Amazon CPF), Apr 2025", "kind": "startup", "year": 2025, "url": "https://www.recyclingproductnews.com/article/43205/glacier-raises-dollar16m-to-expand-ai-recycling-robots-recology-leads-new-deployments", "verified": true}, {"name": "AMP expands Virginia mixed-waste capacity under SPSA partnership (Apr 2 2026)", "kind": "milestone", "year": 2026, "url": "https://ampsortation.com/resources/news", "verified": true}, {"name": "Google to buy carbon-removal credits from AMP organic-waste processing (Mar 17 2026)", "kind": "milestone", "year": 2026, "url": "https://ampsortation.com/resources/news", "verified": true}, {"name": "GRAB: real-world grasping benchmark for food-waste sorting, arXiv:2602.18835", "kind": "paper", "year": 2026, "url": "https://arxiv.org/pdf/2602.18835", "verified": true}]}], "construction": [{"years": "1970s–2000s", "title": "Demolition and Japanese site robots", "text": "Remote demolition robots (Brokk, 1976) and Japanese general contractors' site robots proved niche tasks; broad adoption never followed.", "items": [{"name": "Brokk remote-controlled demolition robot", "kind": "product", "year": 1976, "url": "", "verified": false}]}, {"years": "2016–2020", "title": "Startups target single tasks", "text": "Built Robotics (autonomy kits for excavators, 2016), Canvas (drywall finishing) and Dusty Robotics (layout printing, 2018) each automate one trade task.", "items": [{"name": "Dusty Robotics $16.5M Series A (2021)", "kind": "startup", "year": 2021, "url": "https://techcrunch.com/2021/06/15/construction-robotics-firm-dusty-raises-16-5m/amp/", "verified": true}]}, {"years": "2021–2024", "title": "Layout printing scales", "text": "Dusty raised a $45M Series B (Scale Venture Partners); FieldPrinter prints BIM layouts on slabs.", "items": [{"name": "Dusty Robotics $45M Series B (Scale-led)", "kind": "startup", "year": 2023, "url": "https://www.scalevp.com/blog/short-circuiting-construction-scale-leads-dusty-robotics-45m-series-b", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: autonomy for heavy equipment, consolidation", "text": "Large rounds went to earthmoving autonomy while a drywall robot was absorbed by an OEM.03% of spend' claim.", "items": [{"name": "Bedrock Robotics $270M Series B at $1.75B (CapitalG, Valor Atreides), Feb 2026", "kind": "startup", "year": 2026, "url": "https://siliconangle.com/2026/02/04/bedrock-robotics-raises-270m-scale-autonomous-construction-fleets/", "verified": true}, {"name": "Bedrock reportedly raising $600M Series C (Axios Pro, unconfirmed)", "kind": "startup", "year": 2026, "url": "https://aiweekly.co/alerts/bedrock-robotics-said-to-be-raising-600m-series-c-at-35b-pre-money-for", "verified": false}, {"name": "JLG (Oshkosh) acquires Canvas drywall-robot technology (Jan 5 2026; scope differs by source)", "kind": "milestone", "year": 2026, "url": "https://digital.bnpmedia.com/article/EQUIPMENT/5098242/859654/article.html", "verified": true}, {"name": "Dusty FieldPrinter 2 at 3DEXPERIENCE World 2026", "kind": "product", "year": 2026, "url": "https://www.solidworks.com/customer-story/dusty-robotics-maximizes-digital-models-jobsite/", "verified": true}]}], "textiles & apparel": [{"years": "1846–2000s", "title": "Machine sewing, still human-fed", "text": "Howe and Singer made the sewing machine practical in the 1840s-50s, and every decade since has automated the machine but not the fabric handling. Limp, stretchy cloth defeated rigid-part robotics, so sewing stayed a hand-guided job.", "items": [{"name": "Elias Howe lockstitch machine patent (1846) and Singer commercialization (1850s)", "kind": "milestone", "year": 1846, "url": "https://en.wikipedia.org/wiki/Sewing_machine", "verified": false}]}, {"years": "2011–2016", "title": "First robotic sewing attempts", "text": "SoftWear Automation (Atlanta) filed a fabric-feed patent in 2011 and built vision-guided Sewbot lines. In 2016 Sewbo sewed a complete garment with an industrial robot by temporarily stiffening fabric with a water-soluble polymer.", "items": [{"name": "US8573145B2 Feed mechanism that advances fabric (SoftWear Automation, filed 2011)", "kind": "patent", "year": 2011, "url": "https://patents.google.com/patent/US8573145", "verified": true}, {"name": "Sewbo robot sews first complete garment (PVA stiffening, UR5)", "kind": "milestone", "year": 2016, "url": "https://fashionunited.com/news/fashion/sewbo-robot-sews-together-first-garment/2016091312862", "verified": true}]}, {"years": "2017–2022", "title": "Pilots, not an industry", "text": "Sewbot lines were piloted for simple products such as T-shirts, but no major apparel maker has replaced its sewing floor. Sewing remains one of the least automated steps in manufacturing.", "items": []}, {"years": "2023–2024", "title": "Learning-based cloth handling matures in the lab", "text": "Garment unfolding and folding research moved to learned policies and simulation, which is the handling layer sewing lines still lack.", "items": []}, {"years": "2025–2026", "title": "Frontier tip: strategic money and industrial-lab papers", "text": "A fashion group (BESTSELLER) led SoftWear's 2025 round, a signal that apparel buyers rather than VCs are now funding sewing automation. Sewbo's founder co-authored a Siemens paper describing stiffen-then-sew with visual servoing on cotton and denim lines. No verified 2025-26 patents or deployment counts found.", "items": [{"name": "SoftWear Automation $20M Series B1 led by BESTSELLER (total raised over $44M)", "kind": "startup", "year": 2025, "url": "https://www.textileworld.com/textile-world/knitting-apparel/2025/08/softwear-automation-secures-20-million-in-series-b1-funding-round-led-by-strategic-partnership-with-bestseller/", "verified": true}, {"name": "Robotic Automation in Apparel Manufacturing: A Novel Approach to Fabric Handling and Sewing (Ajith, Zornow, Wen, Solowjow et al.)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/abs/2503.00249", "verified": true}, {"name": "Learning Efficient Robotic Garment Manipulation with Standardization (APS-Net, ICML 2025)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/abs/2506.22769", "verified": true}, {"name": "US11008686B1 Seam finishing systems and methods (SoftWear Automation)", "kind": "patent", "year": 2021, "url": "https://patents.google.com/patent/US11008686", "verified": true}]}], "warehouse goods-to-person": [{"years": "1950s–2003", "title": "Automated storage and retrieval", "text": "Crane-based AS/RS appeared in the 1960s, and AutoStore's cube-grid concept dates to 1996 in Norway. Kiva Systems (Mick Mountz) was founded in the early 2000s to bring shelves to pickers using mobile robots.", "items": [{"name": "AutoStore company history (founded 1996, Norway)", "kind": "milestone", "year": 1996, "url": "https://en.wikipedia.org/wiki/AutoStore", "verified": true}]}, {"years": "2012–2016", "title": "Amazon buys Kiva; the industry forms", "text": "Amazon acquired Kiva for about $775M in March 2012 and stopped selling it to others, renaming it Amazon Robotics in 2015. That spurred Locus, AutoStore, Ocado and Symbotic-style systems to fill the open market.", "items": [{"name": "Amazon acquires Kiva Systems for about $775M cash", "kind": "milestone", "year": 2012, "url": "https://techcrunch.com/?p=522420", "verified": true}]}, {"years": "2017–2024", "title": "Goods-to-person becomes default for e-commerce", "text": "AutoStore passed roughly 1,950 installed systems in 60+ countries and Symbotic scaled with Walmart. Amazon alone runs robots across 300+ facilities.", "items": [{"name": "AutoStore install base nearly 1,950 systems, 60+ countries (company-reported)", "kind": "company", "year": 2025, "url": "https://en.wikipedia.org/wiki/AutoStore", "verified": true}]}, {"years": "2024–2025", "title": "Today: the largest deployed fleet in robotics", "text": "Amazon announced its one-millionth robot in July 2025. IFR counted 102,900 professional transport and logistics service robots sold in 2024, and 117,500 in 2025 (+21%).", "items": [{"name": "Amazon deploys 1 millionth robot (Japan FC), 300+ facilities", "kind": "milestone", "year": 2025, "url": "https://aibusiness.com/foundation-models/amazon-launches-new-ai-model-deploys-1-millionth-robot", "verified": true}, {"name": "IFR World Robotics 2025 service robots: 102,900 transport and logistics units in 2024", "kind": "report", "year": 2025, "url": "https://ifr.org/ifr-press-releases/news/service-robots-see-global-growth-boom", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: foundation models for fleets, consolidation, and a stumble", "text": "Amazon added a generative fleet-routing model and multi-arm stations, Symbotic absorbed Walmart's robotics unit, and Kroger closed three Ocado sites, showing grocery fulfillment economics are not guaranteed.", "items": [{"name": "Amazon DeepFleet foundation model for fleet traffic (about 10% travel-efficiency gain, Amazon estimate)", "kind": "product", "year": 2025, "url": "https://aibusiness.com/foundation-models/amazon-launches-new-ai-model-deploys-1-millionth-robot", "verified": true}, {"name": "Amazon Blue Jay multi-arm station and Project Eluna agentic ops AI", "kind": "product", "year": 2025, "url": "https://logistik-heute.de/en/news/e-commerce-amazon-unveils-new-robotics-and-ai-technologies-231540.html", "verified": true}, {"name": "Symbotic completes acquisition of Walmart's Advanced Systems and Robotics business; Walmart commits to 400 store APDs", "kind": "company", "year": 2025, "url": "https://www.barchart.com/story/news/30637464/symbotic-completes-acquisition-of-walmarts-advanced-systems-and-robotics-business-and-signs-related-commercial-agreement", "verified": true}, {"name": "Kroger to pay Ocado $350M to close three CFCs", "kind": "milestone", "year": 2025, "url": "https://www.automatedwarehouseonline.com/kroger-to-pay-ocado-350m-to-shut-down-three-sites/", "verified": true}, {"name": "Symbotic Q3 FY2026: revenue $721M, backlog $22.5B", "kind": "report", "year": 2026, "url": "https://www.marketbeat.com/instant-alerts/symbotic-q3-earnings-call-highlights-2026-08-06/", "verified": true}]}], "warehouse picking": [{"years": "2015–2017", "title": "Bin picking becomes a research benchmark", "text": "The Amazon Picking Challenge (2015) put item-level picking on the map, and a wave of vision-and-learning startups followed, including RightHand, Dexterity and Covariant (founded 2017).", "items": []}, {"years": "2018–2022", "title": "Learned picking reaches production", "text": "Covariant raised about $222M in total and Dexterity raised $140M at a $1.4B valuation in 2021. Systems started handling mixed SKUs rather than single products.", "items": [{"name": "Covariant raised $222M total; valued $625M in 2023", "kind": "startup", "year": 2023, "url": "https://en.wikipedia.org/wiki/Covariant_(company)", "verified": true}]}, {"years": "2023–2024", "title": "Foundation models enter picking", "text": "Covariant's RFM-1 took text and image commands, then Amazon hired its three co-founders and licensed the model in 2024. This showed the biggest buyer would rather license than depend on a startup.", "items": [{"name": "Amazon hires Covariant founders, non-exclusive license to RFM-1", "kind": "milestone", "year": 2024, "url": "https://www.robotics247.com/article/amazon_hires_the_founders_of_ai_robotics_company_covariant_licenses_its_technology", "verified": true}]}, {"years": "2025", "title": "Today: pilots at Amazon, orders at UPS", "text": "Amazon says Vulcan can handle about 75% of the items in its pods and processed over 500,000 orders in pilots at Spokane and Hamburg. Picking is not solved: Amazon says Vulcan still hands off the rest.", "items": [{"name": "Amazon Vulcan, first tactile-sensing picking robot (about 75% of items, 500k+ pilot orders)", "kind": "product", "year": 2025, "url": "https://www.aboutamazon.co.uk/news/operations/amazon-project-vulcan-robot", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: touch, multi-arm cells, and real purchase orders", "text": "Funding went to picking and loading systems with working customers, and Amazon moved from single-arm to multi-arm cells.", "items": [{"name": "Amazon Blue Jay multi-arm system, about 75% of product types at a South Carolina site", "kind": "product", "year": 2025, "url": "https://logistik-heute.de/en/news/e-commerce-amazon-unveils-new-robotics-and-ai-technologies-231540.html", "verified": true}, {"name": "Nomagic $44M Series B led by EBRD", "kind": "startup", "year": 2025, "url": "https://tech.eu/2025/02/26/polish-robotics-startup-nomagic-secures-44m-series-b/", "verified": true}, {"name": "Dexterity raises $95M at $1.65B valuation (Mech dual-arm robot; GXO, UPS, FedEx)", "kind": "startup", "year": 2025, "url": "https://www.robotics247.com/article/ai-powered-dexterity-valued-at-1.65-billion", "verified": true}, {"name": "UPS to buy about 400 Pickle truck-unloading robots for about $120M (Bloomberg report)", "kind": "milestone", "year": 2025, "url": "https://www.automatedwarehouseonline.com/ups-to-spend-120m-on-400-pickle-truck-unloading-robots/", "verified": true}]}], "robotaxis": [{"years": "2004–2009", "title": "DARPA challenges and Google's project", "text": "No vehicle finished the 2004 DARPA Grand Challenge, Stanford's Stanley won in 2005, and the 2007 Urban Challenge tested city driving. Google started its self-driving project in 2009 with DARPA alumni.", "items": [{"name": "DARPA Grand Challenge history (2004, 2005 Stanley, 2007 Urban)", "kind": "milestone", "year": 2005, "url": "https://spectrum.ieee.org/darpa-grand-challenge", "verified": true}]}, {"years": "2015–2020", "title": "From pilots to the first rider service", "text": "Waymo became its own company and launched Waymo One in the Phoenix area in 2018 and driverless service for the public in 2020. Cruise and Zoox raised billions on the same path.", "items": []}, {"years": "2021–2024", "title": "Driverless in San Francisco, LA and Austin", "text": "Waymo scaled to multiple metros and Cruise stopped after a 2023 incident. The sector shifted from a race of many to a few operators with real ride data.", "items": []}, {"years": "2025–2026", "title": "Today: hundreds of thousands of rides a week", "text": "Waymo reported about 400,000 paid rides per week in February 2026 and about 500,000 by March, with a stated goal of 1M by year-end. Baidu Apollo Go is reported at roughly 250,000 to 300,000 weekly driverless rides.", "items": [{"name": "Waymo about 500k weekly paid rides, 10 US cities (March 2026)", "kind": "milestone", "year": 2026, "url": "https://noqta.tn/en/news/waymo-500k-weekly-rides-robotaxi-10-cities-2026", "verified": true}, {"name": "Waymo co-CEO outlines path to 1M weekly trips in 2026", "kind": "report", "year": 2026, "url": "https://www.bloomberg.com/news/articles/2026-02-11/waymo-co-ceo-outlines-path-to-1-million-weekly-trips-in-2026", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: cheaper vehicles and foundation-model driving", "text": "Waymo unveiled a Zeekr-built Ojai van with a 6th-gen driver (13 cameras, 6 radars, 4 lidars) and raised a very large round, while publishing end-to-end LLM-based driving research.", "items": [{"name": "Waymo Ojai (Zeekr) and 6th-gen driver unveiled at CES 2026; public rollout planned late 2026", "kind": "product", "year": 2026, "url": "https://www.aol.com/articles/waymo-unveils-updated-ojai-robotaxi-203110950.html", "verified": true}, {"name": "Waymo raises $16B at $126B post-money (Feb 2026)", "kind": "startup", "year": 2026, "url": "https://www.techloy.com/waymo-nears-16b-funding-round-to-double-valuation-to-110b-report-claims/", "verified": true}, {"name": "EMMA: End-to-End Multimodal Model for Autonomous Driving (Waymo, TMLR 2025)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/abs/2410.23262", "verified": true}, {"name": "US 12,221,118 Knowledge distillation for autonomous vehicles (Waymo LLC)", "kind": "patent", "year": 2025, "url": "https://patents.justia.com/assignee/waymo-llc?page=2", "verified": true}, {"name": "Zoox robotaxis planned on the Uber app in Las Vegas, summer 2026", "kind": "company", "year": 2026, "url": "https://parsers.vc/news/260313-zoox-and-uber-join-forces-for-robotaxi/", "verified": false}, {"name": "Tesla Robotaxi launches in Austin Jun 22, 2025 with Model Y and safety monitors", "kind": "milestone", "year": 2025, "url": "https://en.wikipedia.org/wiki/Tesla_Robotaxi", "verified": true}, {"name": "Tesla Robotaxi 2026: unsupervised in 6 cities, Cybercab rides in Austin since Sep 3; fleet still small", "kind": "milestone", "year": 2026, "url": "https://electrek.co/2026/04/30/tesla-robotaxi-unsupervised-finally-signs-ramping-up/", "verified": true}, {"name": "Zoox gets first NHTSA commercial exemption (2,500/yr); paid Las Vegas rides from Aug 10, 2026", "kind": "milestone", "year": 2026, "url": "https://www.smartcitiesdive.com/news/zoox-robotaxis-nhtsa-first-ever-paid-rides/826659/", "verified": true}, {"name": "Pony.ai and WeRide dual-list in Hong Kong Nov 6, 2025; both slid >10% on debut", "kind": "milestone", "year": 2025, "url": "https://carnewschina.com/2025/11/06/chinas-l4-autonomous-driving-company-pony-ai-and-weride-go-public-in-hong-kong-shares-dip-over-10/", "verified": true}, {"name": "Uber, Lucid and Nuro unveil Gravity robotaxi: 20,000 vehicles over 6 yrs, Nvidia Thor, Bay Area 2026", "kind": "product", "year": 2026, "url": "https://www.electrive.com/2026/01/06/lucid-uber-and-nuro-unveil-robotaxi-based-on-the-lucid-gravity", "verified": true}]}], "autonomous trucking": [{"years": "2004–2016", "title": "Highway autonomy from DARPA to Otto", "text": "DARPA-era perception and planning moved to freight when Otto was founded in 2016 and bought by Uber that August. Aurora was founded in 2017.", "items": [{"name": "Otto, bought by Uber (2016)", "kind": "milestone", "year": 2016, "url": "https://en.wikipedia.org/wiki/Otto_(company)", "verified": false}]}, {"years": "2017–2023", "title": "Hype cycle and shakeout", "text": "TuSimple, Embark, Locomation and others raised hundreds of millions, then folded or exited by 2023-24 with no driverless commercial service. Survivors narrowed to Aurora, Kodiak and Waabi.", "items": []}, {"years": "2025", "title": "Today: driverless on Texas highways", "text": "Aurora began driverless commercial runs in Texas in 2025 and, by Q2 2026, reported nearly 440,000 driverless miles with no Aurora Driver-attributed collisions. Its network is about 10 routes including 1,000-mile Fort Worth to Phoenix.", "items": [{"name": "Aurora Q2 2026: about 440k driverless miles, second fleet on International LT, 200+ trucks targeted by year-end", "kind": "report", "year": 2026, "url": "https://secure.businesswire.com/news/home/20260729316480/en/Aurora-Announces-Second-Quarter-2026-Results", "verified": true}]}, {"years": "2025–2026", "title": "Recent shift: routes and OEM partners", "text": "Aurora opened Fort Worth to El Paso in late 2025 and then tripled its network. Volvo and Waabi launched an integrated autonomous VNL truck.", "items": [{"name": "Aurora expands driverless routes to El Paso", "kind": "milestone", "year": 2025, "url": "https://www.freightwaves.com/news/aurora-expands-driverless-routes-to-el-paso", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: public listings, big rounds, truck production", "text": "Kodiak listed through a SPAC, Waabi raised a large Series C, and Aurora's upfitter targets a 1,000 trucks per year run-rate. Revenue is still tiny: Aurora's Q2 2026 revenue was $2M.", "items": [{"name": "Kodiak goes public via SPAC (KDK), about $2.5B implied valuation; driverless Atlas trucks in the Permian", "kind": "company", "year": 2025, "url": "https://www.ttnews.com/articles/autonomous-kodiak-goes-public", "verified": true}, {"name": "Waabi and Volvo launch Volvo VNL Autonomous with Waabi Driver", "kind": "product", "year": 2025, "url": "https://techcrunch.com/2025/02/04/waabi-and-volvo-team-up-to-build-self-driving-trucks-at-scale", "verified": true}, {"name": "Waabi $750M Series C plus about $250M milestone capital from Uber", "kind": "startup", "year": 2026, "url": "https://stockanalysis.com/private/waabi/", "verified": false}, {"name": "Aurora Q2 2026: net loss $270M, cash near $1.2B, Roush run-rate 1,000 trucks per year targeted for October", "kind": "report", "year": 2026, "url": "https://www.marketbeat.com/instant-alerts/aurora-innovation-q2-earnings-call-highlights-2026-07-29/", "verified": true}]}], "sidewalk & drone delivery": [{"years": "2012–2016", "title": "Early prototypes", "text": "Google X began Project Wing in 2012, Amazon announced Prime Air in 2013, and Starship and Zipline were both founded in 2014. Zipline began delivering blood in Rwanda in 2016.", "items": [{"name": "Zipline Rwanda blood delivery launch (2016)", "kind": "milestone", "year": 2016, "url": "https://en.wikipedia.org/wiki/Zipline_(drone_delivery_company)", "verified": false}]}, {"years": "2017–2021", "title": "First commercial footholds", "text": "Wing became the first drone delivery company with an FAA air carrier certificate (2019) and Starship robots reached campuses and neighborhoods. Medical delivery in Africa was the proof-of-concept.", "items": []}, {"years": "2022–2024", "title": "Retail partnerships", "text": "Zipline passed 1 million deliveries in 2024, then 2 million in January 2026, and Wing partnered with Walmart and DoorDash. Services remained geographically narrow because of airspace waivers.", "items": []}, {"years": "2025–2026", "title": "Today: millions of deliveries", "text": " Starship reports 10 million autonomous deliveries and about 3,000 robots, and Serve ended Q1 2026 with about 2,050 robots in 44 cities.", "items": [{"name": "Zipline surpasses 2M commercial deliveries", "kind": "milestone", "year": 2026, "url": "https://www.therobotreport.com/zipline-raises-over-600m-in-funding-surpasses-2m-commercial-drone-deliveries/", "verified": true}, {"name": "Serve Robotics Q1 2026: about 2,050 deployed robots, $3M revenue", "kind": "report", "year": 2026, "url": "https://investors.serverobotics.com/news-releases/news-release-details/serve-robotics-announces-first-quarter-2026-results-3x", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: platform 2, scale-up capital, and the airspace rule", "text": "Zipline's P2 went commercial with Walmart in DFW in April 2025, then raised $600M at $7.6B (January 2026), expanded by $200M. Wing and Walmart added 150 stores. The FAA Part 108 BVLOS rule was still under White House review as of mid-October 2026.", "items": [{"name": "Zipline Series H $600M at $7.6B valuation, extended to $800M", "kind": "startup", "year": 2026, "url": "https://dronexl.co/2026/01/20/zipline-reaches-7-6-billion-valuation-drone", "verified": true}, {"name": "Wing and Walmart expand drone delivery to 150 more stores", "kind": "milestone", "year": 2026, "url": "https://wing.com/news/wing-walmart-expand-drone-delivery-coast-to-coast", "verified": true}, {"name": "Starship $50M Series C and 9M deliveries; shifting to grocery and hot food", "kind": "startup", "year": 2025, "url": "https://www.businesswire.com/news/home/20251120298420/en", "verified": true}, {"name": "US 12,304,670 Systems for UAV docking, storage, and loading (Zipline, granted May 20, 2025)", "kind": "patent", "year": 2025, "url": "https://patents.justia.com/inventor/rajan-gill", "verified": true}, {"name": "FAA Part 108 BVLOS final rule at White House review since July 10, 2026", "kind": "milestone", "year": 2026, "url": "https://airdata.com/blog/2026/part-108", "verified": true}]}], "defense drones & counter-drone": [{"years": "1980s–2014", "title": "Large remote-piloted aircraft", "text": "Israel's early UAVs and the Predator in the 1990s established military drones as expensive, jam-vulnerable aircraft run by specialist crews.", "items": []}, {"years": "2015–2021", "title": "Defense tech startups appear", "text": "Shield AI (2015) and Anduril (2017) began selling autonomy-first systems to the US military, ahead of Skydio's defense pivot. Anduril built Lattice as a common software layer.", "items": []}, {"years": "2022–2024", "title": "Ukraine makes cheap drones the main weapon", "text": "FPV drone output in Ukraine grew from a few thousand in 2022 to over 2 million in 2024. Electronic warfare drove demand for autonomy and fiber-optic links.", "items": [{"name": "Ukraine FPV production above 2M units in 2024 (analysis)", "kind": "report", "year": 2024, "url": "https://gssr.georgetown.edu/?p=1015", "verified": true}]}, {"years": "2025–2026", "title": "Today: mass orders and interceptors", "text": "Ukraine's units ordered over 590,000 UAVs (per Ukraine’s Brave1) through Brave1 Market from January to September 2026, and interceptor drones outnumbered FPV strike drones for the first time.", "items": [{"name": "Ukraine orders 590,000 drones via Brave1 Market Jan-Sep 2026; interceptors surpass FPV", "kind": "report", "year": 2026, "url": "https://militaeraktuell.at/en/ukraine-orders-590000-drones-interceptor-drones-surpass-fpv-systems/", "verified": true}, {"name": "Anduril Series H $5B at $61B valuation (a16z, Thrive)", "kind": "startup", "year": 2026, "url": "https://washingtontechnology.com/companies/2026/05/anduril-hauls-5b-series-h-round/413515/", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: factories, autonomous combat aircraft, YC", "text": "The money is flowing to production capacity and autonomous aircraft, and a wave of YC counter-drone companies emerged in 2026. Autonomy under jamming is still mostly vendor and conference work rather than arXiv research.", "items": [{"name": "Shield AI raises $2B ($1.5B Series G + $500M preferred) at $12.7B; X-BAT first flight expected by end of 2026", "kind": "startup", "year": 2026, "url": "https://fortune.com/2026/03/26/shield-ai-revenue-series-g-funding-12-billion-valuation", "verified": true}, {"name": "Anduril Arsenal-1 (Ohio, 775,000 sq ft) starts Fury production earlier than planned", "kind": "milestone", "year": 2026, "url": "https://www.washingtontechnology.com/companies/2026/03/anduril-new-factory-will-start-making-drone-wingman-just-days/412284/", "verified": true}, {"name": "YC defense and drone startups, 2026 batches (Earendil, Greypoint, 9 Mothers, Milliray, others)", "kind": "startup", "year": 2026, "url": "https://www.ycombinator.com/companies/industry/Defense", "verified": true}, {"name": "A Hierarchical Absolute Visual Localization System for Low-Altitude Drones in GNSS-Denied Environments (Remote Sensing)", "kind": "paper", "year": 2025, "url": "https://mdpi-res.com/d_attachment/remotesensing/remotesensing-17-03470/article_deploy/remotesensing-17-03470.pdf", "verified": true}, {"name": "Anduril patents granted July 22, 2025 (VTOL fuel valve, deployable wings; numbers not captured)", "kind": "patent", "year": 2025, "url": "https://patents.justia.com/assignee/anduril-industries-inc", "verified": true}, {"name": "Anduril tender talks at about $90B (Bloomberg, October 2026; not a new round)", "kind": "report", "year": 2026, "url": "https://fourweekmba.com/ai-anduril-tender-would-value-it-at-roughly-90b-up-from-61b/", "verified": true}]}], "agriculture": [{"years": "1992–2000s", "title": "Milking robots and GPS guidance", "text": "Lely built a fully automated milking prototype in 1992 and installed its first Astronaut A2 in the UK in 1997. GPS auto-steer for tractors followed in the early 2000s, making field autonomy mostly a steering problem.", "items": [{"name": "Lely Astronaut: first prototype 1992, A2 installed 1997 (history summary)", "kind": "milestone", "year": 1997, "url": "https://www.historyofinformation.com/detail.php?id=4104", "verified": true}]}, {"years": "2000s–2014", "title": "Dairy automation becomes an industry", "text": "Robotic milking spread across European dairy; Lely installed its 20,000th Astronaut in 2014. Auto-steer became a standard option on large row-crop tractors.", "items": [{"name": "Lely installs 20,000th Astronaut (Germany)", "kind": "milestone", "year": 2014, "url": "https://www.agriland.ie/farming-news/lely-20000-steps/", "verified": true}]}, {"years": "2024–2026", "title": "Where it works today", "text": "Milking is solved at scale: Lely passed 50,000 Astronaut installs in 2024, milking about 3M cows daily in 50 countries. Weeding is the first field-robot success: Carbon Robotics reports 100+ farms in 15 countries and revenue above $100M for the year ending Jan 2026. Harvesting delicate crops is still pilots.", "items": [{"name": "Lely 50,000th Astronaut installed, Northern Ireland", "kind": "milestone", "year": 2024, "url": "https://www.thefencepost.com/news/northern-ireland-farmer-installs-lelys-50000th-milking-robot/", "verified": true}, {"name": "Carbon Robotics: LPM trained on 150M+ data points from 100+ farms in 15 countries", "kind": "company", "year": 2026, "url": "https://techcrunch.com/2026/02/02/carbon-robotics-built-an-ai-model-that-detects-and-identifies-plants/", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: learned picking, plant models, a shutdown", "text": "The frontier is learned policies for picking and foundation models for plant recognition. The 2025 to 2026 field also shows a cautionary failure: Monarch Tractor shut down after dealer complaints about autonomy claims.", "items": [{"name": "Carbon Robotics LaserWeeder G2 product line (6.6 ft to 60 ft models)", "kind": "product", "year": 2025, "url": "https://businesswire.com/news/home/20250210556114/en/Carbon-Robotics-Introduces-Faster-Lighter-and-Modular-LaserWeeder-G2-Product-Line", "verified": true}, {"name": "Carbon Robotics Large Plant Model (new weeds without retraining; previously ~24h per weed)", "kind": "product", "year": 2026, "url": "https://techcrunch.com/2026/02/02/carbon-robotics-built-an-ai-model-that-detects-and-identifies-plants/", "verified": true}, {"name": "HarvestFlex: VLA policy (pi0.5 fine-tuned) for greenhouse strawberry harvest; 74.0% success, 32.6 s/pick, 4.1% damage (50 real trials)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/abs/2603.05982", "verified": true}, {"name": "Cherry tomato harvesting field trials in high tunnels, 85.0% of fruit in 10.98 s (arXiv 2501.19395)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/abs/2501.19395v1", "verified": true}, {"name": "DailyRobotics (Israel, founded 2023) plans California open-field strawberry harvester launch", "kind": "startup", "year": 2025, "url": "https://www.fertilizerdaily.com/20251121-dailyrobotics-prepares-to-launch-strawberry-harvesting-robot-in-california/md/", "verified": true}, {"name": "Monarch Tractor shut down; assets acquired by Caterpillar", "kind": "report", "year": 2026, "url": "https://www.futurefarming.com/tech-in-focus/autonomous-semi-autosteering-systems/caterpillar-acquires-monarch-technology-after-electric-tractor-startup-shuts-down/", "verified": true}]}], "energy, solar & data-center robots": [{"years": "2010s–2023", "title": "Manual build-out meets labor limits", "text": "Utility-scale solar and hyperscale data centers grew on manual construction and maintenance. Robotic installation startups such as Terabase (a $25M round led by Fifth Wall in 2023) emerged as labor and schedule became the bottleneck.", "items": [{"name": "Terabase $25M round led by Fifth Wall (2023), per Series C coverage", "kind": "startup", "year": 2023, "url": "https://pv-magazine-usa.com/2025/03/13/terabase-surpasses-200-million-in-funding-with-series-c-round/", "verified": true}]}, {"years": "2024", "title": "First field robots on solar farms", "text": "AES unveiled Maximo, an AI-driven panel-installing robot that works with crews, claiming half the time and cost of manual installation.", "items": [{"name": "AES Maximo AI-enabled solar installation robot", "kind": "product", "year": 2024, "url": "https://pv-magazine-usa.com/2024/07/30/ai-enabled-solar-installation-robot/", "verified": true}]}, {"years": "2025–2026", "title": "Today", "text": "Maximo is reported in use at AES's 2 GW Bellefield project in California. Terabase says its Terafab line has installed 40 MW across US projects and targets hundreds of MW through 2026. Data-center robots are pilots: Meta has tested Watney's dual-arm robots on cable swaps in Altoona, Iowa since June 2025, and they are still slower than technicians.", "items": [{"name": "Terafab: 40 MW installed, roughly 2x install productivity (company claim)", "kind": "product", "year": 2025, "url": "https://pv-magazine-usa.com/2025/03/13/terabase-surpasses-200-million-in-funding-with-series-c-round/", "verified": true}, {"name": "Meta pilots Watney dual-arm robots for data-center cabling (WIRED reporting via Dealroom)", "kind": "report", "year": 2025, "url": "https://app.dealroom.co/news/note/data-centre-robot-startup-watney-raises-80m-series-a", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: solar-install and data-center robots get funded", "text": "Capital is flowing into both solar construction and data-center upkeep, driven by AI-power buildouts and 800V DC arc-flash risk. Evidence of unattended reliability is still thin.", "items": [{"name": "Terabase $130M Series C led by SoftBank Vision Fund 2 (total >$200M), Mar 2025", "kind": "startup", "year": 2025, "url": "https://pv-magazine-usa.com/2025/03/13/terabase-surpasses-200-million-in-funding-with-series-c-round/", "verified": true}, {"name": "Cosmic Robotics $4M pre-seed (Giant Ventures) for Cosmic-1A solar install robot; later reported in YC Summer 2026 batch", "kind": "startup", "year": 2025, "url": "https://techcrunch.com/2025/04/16/cosmic-robotics-is-building-robots-to-speed-solar-power-deployments-for-data-centers", "verified": true}, {"name": "Rosendin demonstrates autonomous solar module installation robot, West Texas", "kind": "company", "year": 2025, "url": "https://www.solarpowerworldonline.com/?p=109001", "verified": false}, {"name": "Watney $80M Series A (Valor Atreides AI Fund, Hummingbird); total >$100M", "kind": "startup", "year": 2026, "url": "https://app.dealroom.co/news/note/data-centre-robot-startup-watney-raises-80m-series-a", "verified": true}, {"name": "Exclaim Robotics (Zurich) ~$5M pre-seed, Playfair and Founderful, out of stealth Aug 2026", "kind": "startup", "year": 2026, "url": "https://pulse2.com/exclaim-robotics-raises-5-million-pre-seed-round-to-build-robots-for-ai-data-center-maintenance/", "verified": true}, {"name": "Proprio Robotics (YC S26) data-center hardware automation; funding figures conflict", "kind": "startup", "year": 2026, "url": "https://app.dealroom.co/companies/proprio_robotics_yc_s26", "verified": false}, {"name": "US patent 12698189 'Solar panel installation system' (arm on boom-mounted track); assignee and date not confirmed", "kind": "patent", "year": 2026, "url": "https://image-ppubs.uspto.gov/dirsearch-public/print/downloadPdf/12698189", "verified": false}]}], "inspection, mining & nuclear": [{"years": "1979–2008", "title": "Remote nuclear work and first autonomous haulage", "text": "Three Mile Island (1979) and Chernobyl (1986) pushed teleoperated robots into nuclear cleanup. Komatsu's FrontRunner driverless haul system reached its first commercial mine deployments around 2008.", "items": [{"name": "Komatsu FrontRunner first commercial deployment (~2008, Chile); year from background knowledge", "kind": "milestone", "year": 2008, "url": "", "verified": false}]}, {"years": "2013–2020", "title": "Autonomous trucks and legged inspection", "text": "Caterpillar and Komatsu scaled autonomous haulage across Australian and Chilean pits. Boston Dynamics began commercial Spot sales in 2020, and ANYbotics spun out of ETH to sell ANYmal for plant inspection.", "items": []}, {"years": "2025–2026", "title": "Today", "text": "Komatsu commissioned its 1,000th autonomous ultra-class truck in April 2026, and its customers have moved over 11.5B tonnes. An aggregated count puts about 3,800 autonomous haul trucks worldwide by mid-2025, with China holding the most. Boston Dynamics told Bloomberg about 2,000 Spot units are in operation, and ANYbotics reports 200+ ANYmal units.", "items": [{"name": "Komatsu commissions its 1,000th autonomous ultra-class truck (Nevada Gold Mines)", "kind": "milestone", "year": 2026, "url": "https://im-mining.com/2026/04/21/komatsu-commissions-1000-autonomous-ultra-class-trucks/", "verified": true}, {"name": "Spot: about 2,000 units in operation; 60+ US/Canada bomb squads and SWAT teams (Bloomberg via Boston Globe)", "kind": "report", "year": 2025, "url": "https://www.bostonglobe.com/2025/11/18/business/boston-dynamics-spot-robot-policing", "verified": false}, {"name": "About 3,832 autonomous haul trucks worldwide, July 2025 (aggregator data, low confidence)", "kind": "report", "year": 2025, "url": "https://www.mining-technology.com/analyst-comment/china-global-leader-autonomous-surface-mining-trucks/", "verified": false}]}, {"years": "2025–2026", "title": "Frontier tip: unicorn rounds for inspection robots", "text": "Venture money now backs inspection robots that climb, fly and swim, and certified legged robots for explosive atmospheres. Unicorn-scale rounds are new for this territory.", "items": [{"name": "Gecko Robotics $125M Series D at $1.25B valuation, led by Cox Enterprises (Jun 12, 2025)", "kind": "startup", "year": 2025, "url": "https://siliconangle.com/2025/06/12/gecko-robotics-raises-125m-inspect-monitor-critical-infrastructure/", "verified": true}, {"name": "ANYbotics funding (Climate Investment-led; total >EUR 127M) to bring Ex-certified ANYmal X to market in 2026", "kind": "startup", "year": 2025, "url": "https://www.venturelab.swiss/EUR-127-million-for-ANYbotics-fourlegged-robot-workforce", "verified": true}, {"name": "Boston Dynamics Spot expands into public-safety missions", "kind": "company", "year": 2025, "url": "https://amp.kedglobal.com/robotics/newsView/ked202504100006", "verified": false}]}], "underwater & marine": [{"years": "1950s–1990s", "title": "First AUVs", "text": "The Applied Physics Lab at the University of Washington built SPURV, an early autonomous underwater vehicle, in the late 1950s. Navy and academic vehicles such as WHOI's REMUS followed in the 1990s.", "items": [{"name": "SPURV (UW APL) early AUV, late 1950s; from background knowledge", "kind": "milestone", "year": 1957, "url": "", "verified": false}]}, {"years": "2000s–2022", "title": "Surface drones and commercial AUVs", "text": "Commercial AUVs spread for survey and mine countermeasures. Saildrone (founded 2012) built wind-and-solar ocean drones for science, and Saronic and Anduril entered in the late 2010s to early 2020s.", "items": []}, {"years": "2025–2026", "title": "Today", "text": "Defence is the buyer. Australia signed a five-year, roughly A$1.7B contract with Anduril Australia for Ghost Shark extra-large AUVs, built in a Sydney factory ramping in 2026. Saildrone's Voyager and Surveyor vessels operate in European and US programs.", "items": [{"name": "Australia contracts Anduril for Ghost Shark XL-AUV, A$1.7B over five years (Sep 2025)", "kind": "milestone", "year": 2025, "url": "https://www.navalnews.com/naval-news/2025/09/anduril-ghost-shark-now-australian-1-7-bn-program-of-record/", "verified": true}, {"name": "Anduril Sydney undersea drone factory (7,400 sqm), full-scale production 2026", "kind": "company", "year": 2026, "url": "https://www.bairdmaritime.com/security/naval/unmanned-naval-systems/anduril-launches-undersea-drone-factory-in-australia", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: attritable vessels and volume shipyards", "text": "The growth is in attritable surface and undersea vessels and shipyards built for volume. Underwater communication is still the core unsolved constraint, and", "items": [{"name": "Saronic $600M Series C at $4B valuation (Elad Gil), funds Port Alpha shipyard (Feb 2025)", "kind": "startup", "year": 2025, "url": "https://dronexl.co/2025/02/19/saronic-secures-600m-autonomous-naval-vessels", "verified": true}, {"name": "Saronic reported $1.75B Series D at $9.25B valuation (Mar 2026)", "kind": "startup", "year": 2026, "url": "https://pulse2.com/saronic-600-million-series-c-raised-at-4-billion-for-autonomous-surface-vessels/amp/", "verified": true}, {"name": "Saildrone $60M round led by EIFO (May 2025); Lockheed Martin $50M strategic partnership (Oct 2025)", "kind": "startup", "year": 2025, "url": "https://lockheedmartin.com/en-us/news/features/2026/Lockheed-Martin-Saildrone-Accelerating-Maritime-Readiness-at-Scale.html", "verified": true}, {"name": "Saildrone reveals Spectre high-endurance USV (Sea Air Space 2026)", "kind": "product", "year": 2026, "url": "https://sacra.com/chat/h/1051ff1c-c880-4f9f-8ae1-b534fb5e41a1/", "verified": false}]}], "space": [{"years": "1981–1997", "title": "First space manipulators", "text": "Canadarm flew on the Shuttle in 1981. DLR's ROTEX flew the first space telerobot in 1993, and Japan's ETS-VII demonstrated robotic rendezvous and arm tasks in 1997.", "items": [{"name": "Canadarm (1981), ROTEX (1993), ETS-VII (1997); from background knowledge", "kind": "milestone", "year": 1981, "url": "", "verified": false}]}, {"years": "2001–2021", "title": "Station arms and commercial servicing", "text": "Canadarm2 joined the ISS in 2001. Northrop Grumman's MEV-1 docked with Intelsat 901 in 2020, and MEV-2 docked with Intelsat 10-02 in operational GEO on April 12, 2021.", "items": [{"name": "MEV-2 docks with Intelsat 10-02 in GEO (Apr 12, 2021)", "kind": "milestone", "year": 2021, "url": "https://spaceflightnow.com/?p=51044", "verified": true}]}, {"years": "2024–2026", "title": "Today", "text": "Commercial space robotics is small. GITAI's 1.5 m dual-arm S2 completed external ISS tasks in 2024. Motiv's xLink modular arm was announced in 2020 and is a space-rated arm product. Northrop's Mission Robotic Vehicle and Mission Extension Pods reportedly launched July 21, 2026.", "items": [{"name": "GITAI S2 arm arrives at ISS for external demo (NG-20)", "kind": "milestone", "year": 2024, "url": "https://gitai.tech/category/news-en/page/4", "verified": false}, {"name": "Motiv xLink modular space-rated arm system (announced 2020)", "kind": "product", "year": 2020, "url": "https://hjkc.de/_blog/15372-raumfahrt-motiv-space-systems-launches-xlink-the-highly-modular-cost-efficient-space-rated-robotic-arm-system", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: servicing goes from demos to programs", "text": "Servicing is moving from one-off demos to funded programs. Dedicated lunar construction is at pre-seed stage.", "items": [{"name": "Northrop SpaceLogistics Mission Robotic Vehicle and 3 Mission Extension Pods launch on Falcon 9 (Jul 21, 2026, company page)", "kind": "milestone", "year": 2026, "url": "https://www.northropgrumman.com/space/space-logistics-services?hg=0", "verified": true}, {"name": "Starfish Space Otter Pup 2 retargeted to dock with Gilmour Space ElaraSat (Mar 2026)", "kind": "milestone", "year": 2026, "url": "https://www.geekwire.com/2026/starfish-space-australian-satellite-docking/", "verified": true}, {"name": "GITAI reported to win Missile Defense Agency SHIELD contract (Dec 2025); S3 servicer launch reportedly deferred past 2028", "kind": "company", "year": 2025, "url": "https://spacebandits.io/startups/gitai", "verified": false}, {"name": "GRU Space (YC W2026): lunar regolith brick 'Moon Factory'; first mission planned 2027; about $600K raised", "kind": "startup", "year": 2026, "url": "https://www.ycombinator.com/companies/galactic-resource-utilization-space-inc", "verified": true}]}], "industrial arms & cobots": [{"years": "1954–1974", "title": "Unimate and the first arms", "text": "George Devol filed 'Programmed article transfer' in 1954 (US 2,988,237, granted June 13, 1961). The first Unimate went to a GM die-casting plant in Ewing, New Jersey in 1961. ASEA's electric IRB 6 followed around 1973 to 1974.", "items": [{"name": "US patent 2,988,237 'Programmed article transfer', G. C. Devol (filed 1954, granted 1961)", "kind": "patent", "year": 1961, "url": "https://patents.google.com/patent/US2988237A/en", "verified": true}, {"name": "First Unimate installed at GM Inland Fisher Guide, Ewing NJ", "kind": "milestone", "year": 1961, "url": "https://en.wikipedia.org/wiki/Unimate", "verified": true}]}, {"years": "1980s–2008", "title": "Auto industry scale-up, then cobots", "text": "FANUC, ABB, KUKA and Yaskawa built the automotive welding and handling base. Universal Robots introduced the UR5 in 2008, a lightweight arm that needed no safety cage.", "items": [{"name": "Universal Robots UR5 (2008); year from background knowledge", "kind": "product", "year": 2008, "url": "", "verified": false}, {"name": "Teradyne acquires Universal Robots (Jun 2015, total purchase price $315.4M incl. contingent)", "kind": "milestone", "year": 2015, "url": "https://www.sec.gov/Archives/edgar/data/0000097210/000119312516484381/d126262d10k.htm", "verified": true}]}, {"years": "2024", "title": "Recent shift: AI-native arms", "text": "Startups pitched learned, camera-first arms against teach-pendant programming. Standard Bots raised $63M in July 2024 around its $37,000 RO1 arm.", "items": [{"name": "Standard Bots $63M (Series B led by General Catalyst), RO1 arm at $37k", "kind": "startup", "year": 2024, "url": "https://standardbots.com/articles/standard-bots-raises-63m-to-accelerate-ai-in-robotics", "verified": true}]}, {"years": "2025–2026", "title": "Today", "text": "IFR counts a record 5.079M industrial robots in operation (+9%) and more than 603,000 installed in 2025 (+11%). Cobots are about 66,000 installs, 11% of the total. UR reports over 100,000 cobots sold.", "items": [{"name": "IFR World Robotics 2026: 5.079M operational stock, 603,000 installs in 2025 (released Sep 24, 2026)", "kind": "report", "year": 2026, "url": "https://ifr.org/ifr-press-releases/five-million-robots-now-operate-in-factories-globally", "verified": true}, {"name": "UR media kit: over 100,000 cobots sold worldwide", "kind": "report", "year": 2025, "url": "https://a.storyblok.com/f/169662/x/b95f9efbe4/09_2025_ur-mediakit.pdf", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: AI toolchains and AI-native arm makers", "text": "Incumbents are adding NVIDIA AI toolchains and higher payload and speed, while AI-native entrants raise unicorn-scale rounds.", "items": [{"name": "Universal Robots UR15 (5 m/s TCP, 15 kg payload) and UR AI Accelerator with NVIDIA", "kind": "product", "year": 2025, "url": "https://www.robotics247.com/article/automate-2025-universal-robots-introduces-ur15-cobot", "verified": true}, {"name": "Standard Bots reported $200M Series C at $1B valuation (Jun 2026)", "kind": "startup", "year": 2026, "url": "https://siliconangle.com/?p=771234", "verified": true}, {"name": "Dyna Robotics DYNA-1 foundation model: 850+ napkins folded in 24h at 99.4% (company claim)", "kind": "product", "year": 2025, "url": "https://thelettertwo.com/2025/04/29/dyna-robotics-unveils-dyna-1-a-robot-model-promising-performance-out-of-the-box/", "verified": true}]}], "two-arm mobile manipulators": [{"years": "2010–2012", "title": "Research-grade two-arm robots", "text": "Willow Garage's PR2 (2010) and Rethink's Baxter (2012) were early two-arm platforms, expensive or imprecise. They proved the form but not commercial reliability.", "items": [{"name": "PR2 (2010) and Baxter (2012); from background knowledge", "kind": "milestone", "year": 2010, "url": "", "verified": false}]}, {"years": "2023–2024", "title": "Low-cost teleoperation and imitation learning", "text": "ALOHA (2023) showed cheap bimanual teleoperation could train dexterous policies. Mobile ALOHA (Jan 2024) added a mobile base and whole-body teleop, and co-training raised success on mobile tasks by up to 90% with about 50 demos per task.", "items": [{"name": "Mobile ALOHA: Learning Bimanual Mobile Manipulation with Low-Cost Whole-Body Teleoperation (Fu, Zhao, Finn)", "kind": "paper", "year": 2024, "url": "https://arxiv.org/abs/2401.02117v1", "verified": true}, {"name": "Trossen Robotics sells official ALOHA stationary and mobile kits", "kind": "product", "year": 2024, "url": "https://www.trossenrobotics.com/the-aloha-project", "verified": true}]}, {"years": "2025–2026", "title": "Today", "text": "Roughly 20 US companies sell or build two-arm mobile manipulators, from about $1.7k (Nori A3) to $150k. Real deployment is early. Dyna runs a subscription folding robot, and Weave's Isaac sometimes needs remote operator help.", "items": [{"name": "Weave Isaac 0 laundry-folding unit (deliveries Feb 2026) and Isaac 1 mobile robot (Jul 2026, $7,999)", "kind": "product", "year": 2026, "url": "https://sacra.com/c/weave-robotics", "verified": true}, {"name": "Dyna Robotics $120M Series A (Sep 2025) with Nvidia and Amazon; $23.5M seed Mar 2025", "kind": "startup", "year": 2025, "url": "https://news.bloomberglaw.com/esg/dyna-robotics-raises-120-million-in-funding-from-nvidia-amazon", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: two forces meet", "text": "Two forces meet. Generalist VLA models make two-arm robots useful, and sub-$10k hardware makes them accessible. Reliability and touch remain the open problem.", "items": [{"name": "pi0.5: a Vision-Language-Action Model with Open-World Generalization (Physical Intelligence, on two mobile manipulators)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/pdf/2504.16054", "verified": true}, {"name": "pi0.7 steerable generalist model, evaluated on bimanual mobile manipulators (arXiv 2604.15483)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/pdf/2604.15483", "verified": true}, {"name": "AhaRobot: low-cost open-source bimanual mobile manipulator (~$1,000 hardware, 0.7 mm repeatability)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/pdf/2503.10070", "verified": true}, {"name": "Nori A3: bimanual mobile manipulator at appliance price ($1,688 assembled, shipping since Jul 2026; single-author paper)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/abs/2605.16537", "verified": true}, {"name": "YOR: open-source omnidirectional bimanual platform, BOM under $10,000 (arXiv 2602.11150)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/html/2602.11150v1", "verified": true}, {"name": "Sunday $165M Series B at $1.15B valuation (Coatue), Memo household robot, Mar 12 2026", "kind": "startup", "year": 2026, "url": "https://techcrunch.com/2026/03/12/humanoid-robotics-maker-sunday-reaches-1-15b-valuation-to-build-household-robots/", "verified": true}, {"name": "Gemini Robotics On-Device: offline bi-arm VLA, fine-tunes from 50-100 demos (Jun 2025)", "kind": "product", "year": 2025, "url": "https://deepmind.google/discover/blog/gemini-robotics-on-device-brings-ai-to-local-robotic-devices/", "verified": true}]}], "humanoids": [{"years": "1973–2000", "title": "Lab humanoids", "text": "Waseda's WABOT-1 (1973) was the first full-scale humanoid; Honda's P2 (1996) and ASIMO (2000) showed practical bipedal walking, but as research and showcase machines.", "items": [{"name": "WABOT-1, Waseda University", "kind": "milestone", "year": 1973, "url": "https://en.wikipedia.org/wiki/WABOT", "verified": false}, {"name": "Honda P2 / ASIMO", "kind": "product", "year": 2000, "url": "https://en.wikipedia.org/wiki/ASIMO", "verified": false}]}, {"years": "2013–2021", "title": "Dynamic bipeds and DARPA", "text": "Boston Dynamics' Atlas (2013) and the DARPA Robotics Challenge (finals 2015) pushed hydraulic whole-body control; Agility spun out of Oregon State with Cassie (2017) and then Digit.", "items": [{"name": "Boston Dynamics Atlas / DARPA Robotics Challenge", "kind": "milestone", "year": 2015, "url": "https://en.wikipedia.org/wiki/DARPA_Robotics_Challenge", "verified": false}, {"name": "Tesla announces Optimus at AI Day", "kind": "milestone", "year": 2021, "url": "", "verified": false}]}, {"years": "2022–2024", "title": "Capital and factories arrive", "text": "Figure (founded 2022), Apptronik, 1X, Unitree's low-cost G1 and a wave of Chinese entrants turned humanoids from demos into funded manufacturing programs, with pilot deployments in warehouses and car plants.", "items": [{"name": "Agility Digit pilots (Amazon, GXO, Schaeffler, Toyota Canada RaaS)", "kind": "company", "year": 2025, "url": "https://liveinthefuture.org/stories/humanoid-deployment-gap", "verified": true}, {"name": "Figure 02 at BMW Spartanburg (about 11-month pilot)", "kind": "milestone", "year": 2025, "url": "https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/", "verified": true}]}, {"years": "2025", "title": "Today: thousands shipped, mostly China", "text": "Omdia counted 13,318 humanoids shipped worldwide in 2025 (Counterpoint: about 16,000), led by AgiBot (about 5,100) and Unitree (company says over 5,500); Agility, Tesla and Figure were each around 150 units. Most volume went to research, education and display, not factory work.", "items": [{"name": "Unitree says 2025 humanoid shipments topped 5,500", "kind": "report", "year": 2026, "url": "https://scmp.com/tech/tech-trends/article/3340446/chinas-unitree-ships-more-5500-humanoid-robots-2025-surpassing-us-peers", "verified": true}, {"name": "Chinese firms outpace US rivals in 2025 humanoid shipments; AgiBot leads (Omdia)", "kind": "report", "year": 2026, "url": "https://www.scmp.com/tech/tech-trends/article/3339346/chinese-firms-outpace-us-rivals-2025-humanoid-robot-shipments-agibot-takes-lead", "verified": true}, {"name": "UBTech Walker S2 enters mass delivery; 2025 Walker orders pass RMB 800M; 5,000/yr capacity target 2026", "kind": "company", "year": 2025, "url": "https://technode.com/2025/10/20/ubtechs-walker-series-humanoid-robot-orders-exceed-630-million-yuan-in-2025/", "verified": true}, {"name": "Beijing humanoid half-marathon: 21 robots; Tiangong Ultra wins in 2:40 (Apr 2025)", "kind": "milestone", "year": 2025, "url": "https://www.aljazeera.com/features/2025/4/19/humans-outrun-robots-at-beijing-half-marathon", "verified": true}, {"name": "World Humanoid Robot Games, Beijing: 16 countries, 26 events (Aug 14-17, 2025)", "kind": "milestone", "year": 2025, "url": "https://www.africanews.com/amp/2025/08/15/world-humanoid-robot-games-open-in-beijing/", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: ~20k shipped in H1 2026, mostly China", "text": "H1 2026 shipments roughly tripled to 19,100 to 22,000 units (two trackers disagree), with Figure 03 and a production Atlas now entering plants.", "items": [{"name": "Counterpoint: global humanoid shipments above 22,000 in H1 2026, AgiBot first (about 9,700)", "kind": "report", "year": 2026, "url": "https://agibot.com/article/231/detail/89.html", "verified": true}, {"name": "Smart Analytics Global: about 19,100 units in H1 2026, China over 97%", "kind": "report", "year": 2026, "url": "https://technode.com/2026/08/11/chinese-makers-accounted-for-more-than-97-of-global-humanoid-robot-shipments-in-h1-2026/", "verified": true}, {"name": "BMW deploys Figure 03 at Spartanburg after Figure 02 pilot", "kind": "milestone", "year": 2026, "url": "https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/", "verified": true}, {"name": "Boston Dynamics unveils product Atlas at CES 2026; 2026 units committed to Hyundai and partners", "kind": "product", "year": 2026, "url": "https://www.robotics247.com/article/ces-2026-boston-dynamics-unveils-new-atlas-humanoid-robot", "verified": true}, {"name": "Unitree STAR Market IPO (listed Aug 2026)", "kind": "milestone", "year": 2026, "url": "https://autonews.gasgoo.com/articles/news/unitree-launches-star-market-ipo-issuance-process-subscriptions-open-august-10-2083181368883253248", "verified": tru utdoors.", "items": [{"name": "BigDog, Boston Dynamics", "kind": "milestone", "year": 2005, "url": "https://en.wikipedia.org/wiki/BigDog", "verified": false}]}, {"years": "2015–2020", "title": "Commercial quadrupeds", "text": "ETH's ANYmal (ANYbotics spin-off 2016), Ghost Robotics (2015), Unitree (2016) and Boston Dynamics' Spot (sold commercially from 2020) created the inspection-robot market. Learned locomotion policies (ETH, Science Robotics 2019) replaced hand-tuned controllers.", "items": [{"name": "Hwangbo et al., Learning agile and dynamic motor skills for legged robots (ANYmal), Science Robotics", "kind": "paper", "year": 2019, "url": "https://arxiv.org/abs/1901.08652", "verified": false}, {"name": "Spot commercial release, Boston Dynamics", "kind": "product", "year": 2020, "url": "", "verified": false}]}, {"years": "2025–2026", "title": "Today", "text": "Unitree reports cumulative quadruped sales above 33,000 units, over 40% overseas, and dominates unit volume; Western makers (Boston Dynamics, ANYbotics, Ghost) sell premium industrial and defense units without public volumes. A 2022 Boston Dynamics v. Ghost patent suit was settled confidentially.", "items": [{"name": "Unitree prospectus coverage: cumulative quadruped sales over 33,000; 2025 revenue RMB 1.7B", "kind": "report", "year": 2026, "url": "https://kr-asia.com/unitree-targets-ipo-after-revenue-quadruples-on-robotics-demand", "verified": true}, {"name": "Boston Dynamics resolves patent lawsuit with Ghost Robotics", "kind": "milestone", "year": 2023, "url": "https://www.therobotreport.com/boston-dynamics-resolves-patent-lawsuit-with-ghost-robotics/", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: walking while using an arm", "text": "The research edge is whole-body loco-manipulation (walking while using an arm); commercial edge is hazardous-site inspection and fleet software.", "items": [{"name": "Whole-body inverse dynamics MPC for legged loco-manipulation (ETH Zurich, quadruped + Unitree Z1 arm, 80 Hz)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/abs/2511.19709", "verified": true}, {"name": "MLM: learning multi-task loco-manipulation with arm-equipped quadrupeds", "kind": "paper", "year": 2025, "url": "https://arxiv.org/abs/2508.10538v1", "verified": true}, {"name": "ANYbotics raises round led by Climate Investment (total over EUR 127M); ANYmal X Ex-certified model due 2026", "kind": "startup", "year": 2025, "url": "https://www.venturelab.swiss/EUR-127-million-for-ANYbotics-fourlegged-robot-workforce", "verified": true}, {"name": "Spot software 5.1 and Orbit real-time analytics, Boston Dynamics", "kind": "product", "year": 2026, "url": "", "verified": false}]}], "dexterous hands & touch": [{"years": "1983–2009", "title": "First multi-finger hands and tactile skins", "text": "The Utah/MIT hand (Jacobsen, 1983), the Salisbury hand and later the Shadow and DLR hands made multi-finger manipulation possible in the lab. GelSight (Johnson and Adelson, 2009) turned an elastomer plus camera into a high-resolution touch sensor.", "items": [{"name": "Utah/MIT Dexterous Hand", "kind": "milestone", "year": 1983, "url": "https://en.wikipedia.org/wiki/Utah/MIT_Dexterous_Hand", "verified": false}, {"name": "GelSight, MIT", "kind": "milestone", "year": 2009, "url": "https://en.wikipedia.org/wiki/GelSight", "verified": false}]}, {"years": "2019–2023", "title": "Learning dexterity and cheap vision-based touch", "text": "OpenAI's sim-trained Rubik's-cube hand (2019) showed learned dexterity; Meta's DIGIT (2020) and open GelSight-style sensors made touch affordable for research labs.", "items": [{"name": "OpenAI, Solving Rubik's Cube with a Robot Hand", "kind": "paper", "year": 2019, "url": "https://arxiv.org/abs/1910.07113", "verified": false}]}, {"years": "2024", "title": "Meta Digit 360 and Sparsh", "text": "Meta and GelSight announced Digit 360 (fingertip registering forces down to about 1 millinewton), Sparsh (first general-purpose touch representation) and Digit Plexus; GelSight to manufacture, with sales planned for 2025.", "items": [{"name": "GelSight and Meta AI introduce Digit 360", "kind": "product", "year": 2024, "url": "https://www.businesswire.com/news/home/20241031980322/en/GelSight-and-Meta-AI-Introduce-Digit-360-Tactile-Sensor/", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: touch startups raise, no shared dataset", "text": "Funding is flowing into hand and touch startups, especially in China, but there is still no large shared touch dataset comparable to vision corpora.", "items": [{"name": "Sanctuary AI: new tactile sensors for hydraulic hand (Feb 2025); sim-to-real dexterous policies with Isaac Lab (Mar 2025)", "kind": "company", "year": 2025, "url": "https://www.sanctuary.ai/blog/sanctuary-ai-new-tactile-sensors-enable-richer-sense-of-touch", "verified": true}, {"name": "Tacta Systems raises $75M for robot tactile skills", "kind": "startup", "year": 2025, "url": "https://www.therobotreport.com/tacta-systems-raises-75m-give-robots-smart-nervous-system/", "verified": true}, {"name": "Xense Robotics Pre-A, over RMB 100M (multimodal tactile sensing)", "kind": "startup", "year": 2025, "url": "https://autonews.gasgoo.com/articles/other/seeds-former-tencent-robotics-x-core-member-develops-dexterous-hand-raises-5-rounds-in-one-year-2044598405685223425", "verified": true}, {"name": "Dexcel Robotics Pre-A, over RMB 100M, fifth round in a year", "kind": "startup", "year": 2026, "url": "https://autonews.gasgoo.com/articles/other/seeds-former-tencent-robotics-x-core-member-develops-dexterous-hand-raises-5-rounds-in-one-year-2044598405685223425", "verified": true}, {"name": "Proception raises $11M seed (First Round, YC); ProHand 1.0 22-DoF tendon hand; settles Tesla trade-secrets suit", "kind": "startup", "year": 2026, "url": "https://dealroom.co/news/136330-tesla-sued-robot-hand-startup-proception-settles-raises-11m-seed/", "verified": true}, {"name": "Figure 03 tactile-sensor hands and palm cameras (via BMW deployment coverage)", "kind": "product", "year": 2026, "url": "https://www.therobotreport.com/bmw-group-deploys-figure-03-humanoid-after-tests-previous-version/", "verified": false}]}], "soft robots": [{"years": "1950s–2011", "title": "Pneumatic muscles to soft bodies", "text": "McKibben pneumatic artificial muscles (1950s) were the first widely used soft actuators. Harvard (Whitesides, Shepherd) showed multigait soft pneumatic robots around 2011.", "items": [{"name": "Shepherd et al., Multigait soft robot, PNAS", "kind": "paper", "year": 2011, "url": "https://www.pnas.org/doi/10.1073/pnas.1116564108", "verified": false}]}, {"years": "2013–2016", "title": "Field formed", "text": "Soft Robotics Inc. was founded in 2013; Rus and Tolley's Nature review (2015) defined the field; Harvard's Octobot (Nature, 2016) was the first fully soft, autonomous robot.", "items": [{"name": "Rus and Tolley, Design, fabrication and control of soft robots, Nature", "kind": "paper", "year": 2015, "url": "https://www.nature.com/articles/nature14543", "verified": false}, {"name": "Wehner et al., An integrated design and fabrication strategy for entirely soft, autonomous robots (Octobot), Nature", "kind": "paper", "year": 2016, "url": "https://www.nature.com/articles/nature19100", "verified": false}]}, {"years": "2017–2024", "title": "One real market: food-grade grippers", "text": "The commercial product that scaled was the soft finger gripper for food handling (Soft Robotics mGrip, IP69K washdown). In August 2024 Soft Robotics sold the gripper line to Schmalz and reformed as Oxipital AI.", "items": [{"name": "Schmalz acquires flexible gripping assets from Soft Robotics Inc.", "kind": "milestone", "year": 2024, "url": "https://www.businesswire.com/news/home/20240807157208/en/Schmalz-Acquires-the-Flexible-Gripping-Product-Assets-from-Soft-Robotics-Inc.", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip (thin)", "text": "Research continues on er tip: preclinical drug-delivery microrobots", "text": "The leading result is still preclinical: ETH's gel-capsule magnetic microrobots delivering drugs in pig and sheep vessels, aimed at stroke; human trials are the stated next step.", "items": [{"name": "Landers, Hertle, Pustovalov et al., Clinically ready magnetic microrobots for targeted therapies, Science", "kind": "paper", "year": 2025, "url": "https://roboticsandautomationnews.com/2025/11/17/eth-demonstrates-magnet-guided-robotic-drug-delivery/96661/", "verified": true}]}], "robot foundation models (VLAs)": [{"years": "2022–2023", "title": "Foundations", "text": "Google's RT-1 (Dec 2022) and RT-2 (2023) showed that transformers trained on robot data, and web-pretrained vision-language models fine-tuned for actions, could control robots; Open X-Embodiment pooled datasets across labs.", "items": [{"name": "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control", "kind": "paper", "year": 2023, "url": "https://arxiv.org/abs/2307.15818", "verified": false}, {"name": "OpenVLA", "kind": "paper", "year": 2024, "url": "https://arxiv.org/abs/2406.09246", "verified": false}]}, {"years": "2024", "title": "Scale-up: generalist-policy startups", "text": "Physical Intelligence (founded 2024) released pi0, a flow-matching VLA across many robot types; Skild AI and others raised large rounds around the same time.", "items": [{"name": "pi0: A Vision-Language-Action Flow Model for General Robot Control", "kind": "paper", "year": 2024, "url": "https://arxiv.org/abs/2410.24164", "verified": false}]}, {"years": "2025", "title": "Open and lab models proliferate", "text": "NVIDIA released GR00T N1 (March) and N1.5 (June 2025) as open humanoid models; DeepMind shipped Gemini Robotics and then Gemini Robotics 1.5 (Oct 2025, private preview).", "items": [{"name": "Gemini Robotics 1.5 (arXiv 2510.03342)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/abs/2510.03342", "verified": true}, {"name": "NVIDIA GR00T N1.5", "kind": "product", "year": 2025, "url": "https://research.nvidia.com/labs/gear/gr00t-n1_5", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: learning from experience, huge rounds", "text": "Learning from deployment experience (RL on top of VLAs), very large rounds, and a push toward independent real-world benchmarks. Company claims of success rates above 90% on hard tasks remain self-reported.", "items": [{"name": "pi*0.6: a VLA that Learns From Experience (RECAP), Physical Intelligence, arXiv 2511.14759", "kind": "paper", "year": 2025, "url": "https://www.pi.website/blog", "verified": true}, {"name": "Skild AI raises about $1.4B Series C led by SoftBank at over $14B valuation", "kind": "startup", "year": 2026, "url": "https://news.bloomberglaw.com/private-equity/robotics-startup-skild-ai-valued-above-14-billion-in-new-round", "verified": true}, {"name": "Physical Intelligence reported in talks for about $1B at over $11B valuation (Bloomberg, Mar 2026; close unconfirmed)", "kind": "startup", "year": 2026, "url": "https://news.bloomberglaw.com/artificial-intelligence/ai-robotics-lab-in-talks-to-nab-1-billion-at-11-billion-value", "verified": false}, {"name": "VLA-REPLICA: low-cost reproducible real-world VLA benchmark (arXiv 2605.20774, NeurIPS 2026)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/pdf/2605.20774", "verified": true}, {"name": "LingBot-VLA, about 20,000 hours of real-robot data (arXiv 2601.18692)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/pdf/2601.18692", "verified": true}, {"name": "Experiences from Benchmarking VLA Models (ACT, OpenVLA-OFT, RDT-1B, pi0 on ALOHA Mobile)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/html/2511.11298v1", "verified": true}, {"name": "Figure Helix: 7B VLM + 80M 200Hz policy; full humanoid upper-body control, 2 robots, onboard", "kind": "product", "year": 2025, "url": "https://www.figure.ai/news/helix", "verified": true}, {"name": "NVIDIA Isaac GR00T N1
