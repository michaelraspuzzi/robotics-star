d models for robots", "text": "DeepMind's Genie (Feb 2024) learned interactive worlds from video; 1X unveiled a world model of its humanoid's camera data to evaluate and train policies.", "items": [{"name": "1X unveils AI world model for robot training", "kind": "company", "year": 2024, "url": "https://www.maginative.com/article/norwegian-startup-1x-unveils-ai-world-model-for-robot-training/", "verified": true}]}, {"years": "2025", "title": "Cosmos and Genie 3", "text": "NVIDIA's Cosmos world foundation models (March 2025 release; early adopters 1X, Agility, Figure, Skild, Uber) and DeepMind's Genie 3 (Aug 2025, real-time 720p, 24 fps, minutes of consistency, research preview).", "items": [{"name": "NVIDIA announces major release of Cosmos world foundation models and physical AI data tools", "kind": "product", "year": 2025, "url": "https://investor.nvidia.com/news/press-release-details/2025/NVIDIA-Announces-Major-Release-of-Cosmos-World-Foundation-Models-and-Physical-AI-Data-Tools/default.aspx", "verified": true}, {"name": "DeepMind unveils Genie 3", "kind": "product", "year": 2025, "url": "https://techcrunch.com/2025/08/05/deepmind-reveals-genie-3-a-world-model-that-could-be-the-key-to-reaching-agi", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: action-conditioned world models", "text": "World models are becoming action-conditioned (world-action models) and are used to evaluate policies offline; the sim-to-real gap is narrowed but not closed.", "items": [{"name": "Generative World Modelling for Humanoids: 1X World Model Challenge Technical Report (arXiv 2510.07092)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/pdf/2510.07092", "verified": true}, {"name": "NVIDIA Cosmos 3 (Super, Nano; Edge variant to follow), trained on 20T tokens, generates action data", "kind": "product", "year": 2026, "url": "https://axios.com/2026/06/01/nvidia-ai-push-cosmos-3-world-model", "verified": true}, {"name": "Project Genie public launch, Google DeepMind (Jan 2026, per press coverage)", "kind": "product", "year": 2026, "url": "https://www.macitynet.it/la-corsa-allai-si-sposta-verso-i-world-model-startup-e-big-tech-investono-miliardi/", "verified": false}, {"name": "NVIDIA GR00T-Dreams: Cosmos-based synthetic video-to-action data; N1.5 data in 36h vs ~3 months", "kind": "product", "year": 2025, "url": "https://investor.nvidia.com/news/press-release-details/2025/NVIDIA-Powers-Humanoid-Robot-Industry-With-Cloud-to-Robot-Computing-Platforms-for-Physical-AI/default.aspx", "verified": false}]}], "data collection & teleoperation": [{"years": "1950s–2000s", "title": "Foundations: master-slave and motion capture", "text": "Teleoperation began with Goertz's mechanical master-slave manipulators (1940s-50s) for nuclear work; later glove and mocap interfaces (e.g. VPL DataGlove, 1980s) made human hand motion machine-readable. Demonstrations became training data via learning-from-demonstration research in the 1990s-2000s.", "items": []}, {"years": "2016–2023", "title": "Scale-up: demonstrations become datasets", "text": "Imitation learning from teleoperated demos (ALOHA/GELLO-style leader arms, VR rigs) moved from lab demos to pooled datasets such as Open X-Embodiment (2023, 20+ institutions).", "items": [{"name": "Open X-Embodiment (arXiv 2310.08864)", "kind": "paper", "year": 2023, "url": "https://arxiv.org/abs/2310.08864", "verified": false}]}, {"years": "2024–2025", "title": "Today: cost per hour is the bottleneck", "text": "Robot-free capture (handheld grippers, gloves, head cameras) cut the cost and logistics of teleoperation. UMI (RSS 2024) showed a GoPro-on-gripper kit could train policies that transfer across robots.", "items": [{"name": "Universal Manipulation Interface (UMI), RSS 2024", "kind": "paper", "year": 2024, "url": "https://arxiv.org/abs/2402.10329", "verified": true}, {"name": "FastUMI (arXiv 2409.19499)", "kind": "paper", "year": 2024, "url": "https://arxiv.org/pdf/2409.19499", "verified": true}]}, {"yea s://english.www.gov.cn/news/topnews/202205/05/content_WS62736f38c6d02e533532a454.htm", "verified": true}]}, {"years": "2025", "title": "Today: record shows, not autonomous swarms", "text": "Light shows reached roughly 10,500 (Vietnam, April 2025) and about 16,000 drones (Liuyang, China, Oct 2025; count reports differ), but these are pre-planned, centrally controlled. Autonomous swarming in combat is largely anecdotal.", "items": [{"name": "Vietnam 10,518-drone Guinness record (Apr 2025)", "kind": "milestone", "year": 2025, "url": "https://vietnamnews.vn/media-outreach/1716991/vietnam-sets-world-record-with-dazzling-drone-show-featuring-10-500-drones.html", "verified": true}, {"name": "Liuyang ~15,947-15,974-drone record (Oct 2025)", "kind": "milestone", "year": 2025, "url": "https://invidis.com/sixteen-nine/2025/10/24/china-sets-world-record-with-15974-drone-sky-show-in-liuyang/", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: defense autonomy software", "text": "Money is flowing to swarm-coordination software, with vendor claims that independent analysts rate as unconfirmed at scale. No 2025-26 academic paper was verified.", "items": [{"name": "Swarmer: $2.86M (May 2026) and $3.87M (Jun 2026) swarming software contracts", "kind": "company", "year": 2026, "url": "https://www.barchart.com/story/news/36665170/swarmer-awarded-2-86m-contract-to-outfit-skyknight-drones-with-swarming-software", "verified": true}, {"name": "Shield AI Hivemind integration with Ukrainian drone maker via Brave1 (Mar 2026)", "kind": "company", "year": 2026, "url": "https://mezha.net/eng/?p=1538245", "verified": true}, {"name": "Auterion Nemyx swarm coordination software (reported $130M raise, $50M contract; vendor claims)", "kind": "company", "year": 2026, "url": "https://www.robotics.press/news/auterion-company-profile/", "verified": false}]}], "surgical robots": [{"years": "1985–1999", "title": "Foundations: first surgical robots", "text": "PUMA 560 guided a neurosurgical biopsy (1985); ROBODOC did orthopedic bone milling (1992); AESOP and ZEUS led to da Vinci (first FDA clearance 2000).", "items": []}, {"years": "2000–2019", "title": "Scale-up: da Vinci dominates", "text": "Intuitive built a razor-and-blade model of systems plus instruments, and da Vinci became the standard in prostatectomy, hysterectomy and more. Competitors (Mako, Covidien/Medtronic, CMR) followed.", "items": []}, {"years": "2024", "title": "Recent shift: da Vinci 5 and new entrants", "text": "da Vinci 5 got FDA clearance in March 2024 with Force Feedback instruments; CMR's Versius got FDA De Novo for cholecystectomy in Oct 2024.", "items": [{"name": "Intuitive announces FDA clearance of da Vinci 5 (Mar 14, 2024)", "kind": "milestone", "year": 2024, "url": "https://investor.intuitivesurgical.com/news-releases/news-release-details/intuitive-announces-fda-clearance-fifth-generation-robotic", "verified": true}]}, {"years": "2026", "title": "Today: ~12,100 systems, ~906k procedures per quarter", "text": "At 30 Sep 2026 the da Vinci installed base was about 12,094 systems (+12% YoY) and the quarter had about 906,000 da Vinci procedures (+14%); 546 systems placed, 315 da Vinci 5.", "items": [{"name": "Intuitive Form 10-Q, quarter ended Sep 30, 2026", "kind": "report", "year": 2026, "url": "https://www.sec.gov/Archives/edgar/data/0001035267/000103526726000071/isrg-20260930.htm", "verified": true}, {"name": "Intuitive Q3 2026 earnings release (Oct 20, 2026)", "kind": "report", "year": 2026, "url": "https://www.biopharmawatch.com/news/ISRG/intuitive-announces-third-quarter-earnings-20261020", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: competition and autonomy", "text": "Competitors are getting US footholds and AI is entering the OR, but fully autonomous surgery is only demonstrated ex vivo; no FDA-cleared fully autonomous device was found.", "items": [{"name": "SRT-H: language-conditioned imitation learning, autonomous cholecystectomy steps on ex tps://parkview.com/news/results/01152024-newest-fleet-of-robots-continue-supporting-safety-and-efficiency-at-prmc", "verified": true}]}, {"years": "2024–2026", "title": "Today: ~100 Moxi robots and 91% medical-robot growth", "text": "IFR counted about 16,700 medical robots sold in 2024 (+91%, incl. surgical and rehab). Moxi: about 90-100 robots in 25+ hospitals, roughly 1.2M deliveries (company-reported).", "items": [{"name": "IFR World Robotics 2025 service robots: medical robots +91% to ~16,700 units", "kind": "report", "year": 2025, "url": "https://ifr.org/ifr-press-releases/news/service-robots-see-global-growth-boom", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: consolidation and Moxi 2.0", "text": "Serve Robotics bought Diligent; Moxi 2.0 began deploying in Aug 2026 with onboard autonomy that works without Wi-Fi.", "items": [{"name": "Serve Robotics to acquire Diligent Robotics (Jan 20, 2026; ~$29M stock plus up to $5.3M earn-out)", "kind": "company", "year": 2026, "url": "https://techcrunch.com/2026/01/20/why-serve-robotics-is-acquiring-a-hospital-assistant-robot-company", "verified": true}, {"name": "Moxi 2.0 deployments from Aug 17, 2026 (Endeavor Health, Providence Saint John's, CHLA)", "kind": "product", "year": 2026, "url": "https://www.therobotreport.com/five-years-operation-shape-diligent-robotics-rollout-moxi-2-0/", "verified": true}]}], "rehab, prosthetics & exoskeletons": [{"years": "1960s–2000s", "title": "Foundations: powered limbs and walking aids", "text": "Early myoelectric hands (1960s) and Hardiman/Wearable exo research began the field; Honda, Cyberdyne HAL and Berkeley/Ekso lines followed in the 2000s.", "items": []}, {"years": "2010–2016", "title": "Scale-up: first FDA-cleared exoskeletons", "text": "ReWalk got FDA clearance for personal use in 2014; Ekso and Indego followed; the DEKA LUKE arm was FDA-cleared in 2014.", "items": []}, {"years": "2022", "title": "Recent shift: learned, personalized assistance", "text": " release 2015) added real-time and security goals. Open Robotics maintained it and the OSRF ecosystem grew.", "items": []}, {"years": "2021–2024", "title": "Today: cloud platforms and robot data tooling", "text": "Commercial layers emerged: Intrinsic Flowstate (Alphabet, 2021), Viam, Foxglove for logging and visualization. ROS 2 distributions ship on a yearly cadence.", "items": []}, {"years": "2025", "title": "Recent shift: Zenoh and data infrastructure", "text": "ROS 2 Kilted Kaiju (May 2025) made Zenoh a Tier 1 middleware. Foxglove raised a Series B for robot data infrastructure.", "items": [{"name": "ROS 2 Kilted Kaiju released (May 23, 2025; Zenoh Tier 1)", "kind": "milestone", "year": 2025, "url": "https://www.openrobotics.org/blog/2025/5/23/ros-2-kilted-kaiju-released", "verified": true}, {"name": "Foxglove $40M Series B led by Bessemer (Nov 2025)", "kind": "startup", "year": 2025, "url": "https://www.businesswire.com/news/home/20251112126106/en/Foxglove-Raises-%2440-Million-Series-B-to-Power-the-Future-of-Physical-AI", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: guarantees for learned policies", "text": "Verification of learned policies is still mostly empirical runtime monitoring, not formal proof; standards for balancing/legged robots are in draft.", "items": [{"name": "Intrinsic joins Google, working with DeepMind and Gemini (Feb 2026)", "kind": "company", "year": 2026, "url": "https://techcrunch.com/2026/02/25/alphabet-owned-robotics-software-company-intrinsic-joins-google", "verified": true}, {"name": "ROS 2 Lyrical Luth (May 2026 release; announced name, release page not opened)", "kind": "milestone", "year": 2026, "url": "https://docs.ros.org/en/lyrical/", "verified": false}, {"name": "ISO/CD 25785-1: safety for actively stabilized (legged/humanoid) industrial mobile robots, committee draft", "kind": "milestone", "year": 2026, "url": "https://www.iso.org/standard/91469.html", "verified": true}, {"name": "RoboSafe: executable predicate-based runtime guardrails for embodied agents (arXiv 2512.21220)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/abs/2512.21220", "verified": true}, {"name": "Pre-VLA: pre-execution safety assessment of VLA action chunks (arXiv 2605.22446)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/pdf/2605.22446", "verified": true}, {"name": "ActFovea: runtime safeguarding for VLA policies (arXiv 2607.29169)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/pdf/2607.29169", "verified": true}, {"name": "NVIDIA Jetson AGX Thor generally available: Blackwell, 2,070 FP4 TFLOPS, 128GB, dev kit $3,499", "kind": "product", "year": 2025, "url": "https://siliconangle.com/2025/08/25/powering-age-robotics-nvidia-launches-jetson-thor-general-availability/", "verified": true}]}], "eldercare & assistive": [{"years": "1960s–1990s", "title": "Rehab and feeding arms", "text": "Early assistive manipulators for people with disabilities, such as wheelchair-mounted and desktop feeding arms, came out of rehabilitation engineering labs and stayed niche.", "items": []}, {"years": "2000–2012", "title": "Companion and mobile-manipulator research", "text": "Toyota's Human Support Robot line and the Intuition Robotics ElliQ concept (company founded 2016, TRI invested) framed home elder support as a research and product goal.", "items": [{"name": "Intuition Robotics raises $14M from Toyota Research Institute", "kind": "company", "year": 2019, "url": "https://techcrunch.com/?p=1513043", "verified": true}]}, {"years": "2017–2023", "title": "Pilot programs", "text": "Labrador Systems raised a $3.1M seed (Alexa Fund, iRobot Ventures) for a home retrieval robot; ElliQ went into state-run pilots.", "items": [{"name": "Labrador Systems $3.1M seed", "kind": "startup", "year": 2022, "url": "https://www.venturecapitaljournal.com/labrador-systems-reels-in-3-1m-seed/", "verified": true}]}, {"years": "2023–2025", "title": "Public-sector rollout of companions", "text": "New York State Office for the Aging expanded ElliQ to thousands of applicants under a three-year, $2.1M agreement; early pilot reported a 95% loneliness reduction (partner-reported).", "items": [{"name": "NYSOFA expands ElliQ partnership", "kind": "report", "year": 2025, "url": "https://www.therobotreport.com/nysofa-expands-partnership-intuition-robotics-bring-elliq-more-seniors/", "verified": true}, {"name": "ElliQ loneliness pilot results", "kind": "report", "year": 2023, "url": "https://www.robotics247.com/article/elliq_companion_robot_reduces_loneliness_95_percent_finds_new_york_state_rollout", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: first care robots for nursing homes", "text": "Physical-care robots for nursing homes are only now appearing as seed-stage startups; funded players are still mostly companions, not manipulators.", "items": [{"name": "ElliQ NYSOFA: ~750 of ~900 units deployed; self-reported 94% feel less lonely", "kind": "report", "year": 2026, "url": "https://hoodline.com/2026/03/lonely-new-york-seniors-turn-to-talking-robots-for-company/", "verified": true}, {"name": "Andromeda (Sydney) Abi aged-care companion robot, reported US$23M raise", "kind": "startup", "year": 2026, "url": "https://www.theweeklysource.com.au/australian-aged-care-robot-developer-andromeda-secures-23m-us-boost/", "verified": true}, {"name": "Twolabs (YC): semi-humanoid for nursing homes", "kind": "startup", "year": 2026, "url": "https://www.ycombinator.com/companies/twolabs", "verified": true}, {"name": "Evolved Robotics: elder-care facility delivery robots, seed Mar 2026 (funding figures unreliable)", "kind": "startup", "year": 2026, "url": "https://www.caplight.com/company/evolvedrobotics", "verified": false}]}], "brain-computer interfaces": [{"years": "1989–2002", "title": "Utah array and primate BMI", "text": "Richard Normann's Utah Electrode Array (1989) and 2002 monkey cursor-control demos made intracortical interfaces practical.", "items": [{"name": "Utah array / BrainGate history", "kind": "milestone", "year": 2004, "url": "https://blackrockneurotech.com/our-story/", "verified": true}]}, {"years": "2004–2012", "title": "First human implants", "text": "Cyberkinetics' BrainGate implanted a Utah array in a tetraplegic patient in June 2004; Blackrock acquired the arrays in 2008 and BrainGate2 continued academically.", "items": [{"name": "BrainGate first human implant 2004; Blackrock 2008", "kind": "milestone", "year": 2004, "url": "https://neurotechreports.com/pages/cyberkinetics-braingate-winddown.html", "verified": true}]}, {"years": "2012–2022", "title": "Neuroprosthetic arms and speech", "text": "Academic trials showed robotic-arm control and text decoding; Synchron's endovascular Stentrode and Neuralink (founded 2016) emerged as alternative form factors.", "items": []}, {"years": "2023–2024", "title": "Speech decoding and first Neuralink patient", "text": "High-accuracy speech decoding and first-in-human Neuralink implants (2024) moved BCI toward products.", "items": [{"name": "An instantaneous voice-synthesis neuroprosthesis (bioRxiv preprint)", "kind": "paper", "year": 2024, "url": "https://www.biorxiv.org/content/10.1101/2024.08.14.607690.full.pdf", "verified": true}]}, {"years": "2025–2026", "title": "Frontier tip: big rounds and registered trials", "text": "Large rounds and registered trials: Neuralink $650M Series E, Synchron $200M Series D, Paradromics FDA IDE then first implant, Precision reported unicorn round.", "items": [{"name": "Wairagkar et al., instantaneous voice-synthesis neuroprosthesis, Nature 644 (~40 ms latency)", "kind": "paper", "year": 2025, "url": "https://pubmed.ncbi.nlm.nih.gov/39229047/", "verified": true}, {"name": "Neuralink raises $650M Series E (~$9B valuation, per press)", "kind": "startup", "year": 2025, "url": "https://www.maginative.com/article/neuralink-raises-650m-to-expand-brain-computer-interface-trials/", "verified": true}, {"name": "Synchron $200M Series D, total $345M; S
