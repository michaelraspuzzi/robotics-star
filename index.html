<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Robotics Frontier Star</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500&display=swap">
<style>
/* layout: stage (3D star) + side panel; panel stacks below on phones. single warm-paper theme to match the essay figures */
:root{--bg:#fbf8f1;--ink:#26262b;--muted:#6e6a62;--line:#e6e0d3;--card:#fffdf8;--hull:#3a6ea5;
--sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",sans-serif;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);gap:18px;max-width:1520px;margin:0 auto;padding-block:18px;height:100vh;min-height:620px;box-sizing:border-box}
header{grid-column:1/-1}
h1{font:600 26px/1.15 var(--sans);letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:820px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:500 13.5px/1 var(--sans);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px 7px 9px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:#bdb5a4}
.chip[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.chip:focus-visible,.crumb button:focus-visible,.row:focus-visible{outline:2px solid var(--hull);outline-offset:2px}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.3)}
.stage{position:relative;min-height:420px;height:auto;min-width:0;border-radius:14px;overflow:hidden;touch-action:none}
.stage svg.under,.stage canvas,.stage .labels{position:absolute;inset:0;width:100%;height:100%}
.stage canvas{cursor:grab}
.stage canvas.dragging{cursor:grabbing}
.stage canvas.pointing{cursor:pointer}
.labels{pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:500 13px/1.2 var(--cond);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);transition:opacity .25s}
.lab.fam{font:600 15px/1.2 var(--sans);letter-spacing:.01em}
.lab.fam small{display:block;font:400 12px/1.2 var(--sans);color:var(--muted);text-align:center}
.lab.big{font:500 15px/1.25 var(--cond);background:rgba(251,248,241,.82);border-radius:6px;padding:2px 6px}
.lab .ev{display:block;font:400 12px/1.3 var(--sans);color:var(--muted)}
.lab.tick{font:400 12.5px/1.2 var(--sans);color:var(--ink)}
.dotm{display:inline-block;width:6px;height:6px;border-radius:50%;background:#26262b;margin-right:6px;vertical-align:2px}
.lab.click{pointer-events:auto;cursor:pointer;padding:4px 6px;border-radius:6px}
.lab.click:hover{background:rgba(255,253,248,.9);text-decoration:underline;text-underline-offset:3px}
.sec{border-top:1px solid var(--line);padding:10px 0}
.sec{cursor:pointer;transition:background .2s}
.tailpad{height:calc(100vh - 420px)}
@media (max-width:900px){.tailpad{display:none}}
.sec:hover{background:#faf6ee}
.sec.on{background:color-mix(in srgb,var(--fl) 30%,#fffdf8);box-shadow:inset 4px 0 0 var(--fd);margin:0 -8px;padding:10px 8px 10px 14px;border-radius:8px}
.sec.on h3{color:var(--fd)}
.lab.sl{transition:opacity .25s}
.lab.sl.up{transform:translate(-50%,-100%)}
.lab.sl.side{transform:translate(0,-50%)}
.lab.sl.dn{transform:translate(0,0);transform:translate(-50%,0)}
.slw{display:inline-block;white-space:normal;text-align:center;line-height:1.25}
.slw b{display:block;font:600 12px/1.3 var(--sans);letter-spacing:.04em;color:#a23b2a}
.slw i{display:block;font:500 14px/1.25 var(--cond);font-style:normal;color:var(--ink)}
.lab.sl.on .slw i{color:var(--fc);text-decoration:underline;text-underline-offset:3px}
.sec .yr{font:600 12px/1 var(--sans);letter-spacing:.06em;color:#a23b2a}
.sec h3{font:600 15px/1.3 var(--sans);margin:4px 0 2px}
.sec p{margin:0 0 6px;color:var(--muted);font-size:13px}
.it{display:grid;grid-template-columns:62px minmax(0,1fr);gap:2px 8px;font-size:12.5px;padding:3px 0}
.it .k{font:600 10.5px/1.6 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.it a{color:var(--ink);text-underline-offset:2px}
.it .u{color:#a23b2a;font-size:11px}
.slicebtn{font:500 13.5px/1 var(--sans);border:1px solid var(--ink);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;margin-top:6px}
.lab.title{font:600 22px/1.2 var(--sans)}
.crumb{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:6px;font:500 13.5px/1 var(--sans);color:var(--muted)}
.crumb button{font:inherit;border:0;background:none;color:var(--ink);padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#c9c2b3}
.crumb .here{color:var(--ink);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid #cfc7b6;border-radius:10px;padding:8px 11px;font-size:13px;max-width:270px;opacity:0;transition:opacity .12s;box-shadow:0 6px 18px rgba(40,30,10,.08)}
.tip b{font-weight:600;font-size:14px;display:block;margin-bottom:2px}
.hint{position:absolute;left:14px;bottom:10px;color:var(--muted);font-size:12.5px;pointer-events:none}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;align-self:start;max-height:100%;overflow:auto}
aside h2{font:600 19px/1.2 var(--sans);margin:0 0 2px}
aside .count{color:var(--muted);margin:0 0 10px;font-size:13px}
.row{display:grid;grid-template-columns:16px minmax(0,1fr);gap:3px 8px;padding:8px 6px;margin:0 -6px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:hover{background:#f6f1e6}
.row .nm{font-weight:500}
.row .ev{grid-column:2;color:var(--muted);font-size:12.5px}
.bar{grid-column:2;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.mk{width:11px;height:11px;border-radius:50%;margin-top:4px;box-sizing:border-box}
.famrow{display:flex;align-items:center;gap:10px;padding:9px 6px;margin:0 -6px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line)}
.famrow:hover{background:#f6f1e6}
.famrow .n{font-weight:600}.famrow .c{margin-left:auto;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:13.5px;margin:10px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.pl span{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12.5px;background:#fff}
.legend{color:var(--muted);font-size:12px;margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 14px}
.note{color:var(--muted);font-size:12px;margin-top:12px}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:none;height:auto;min-height:0}.stage{height:68vh;min-height:420px}aside{max-height:none}}
@media (max-width:600px){.sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.app{padding-block:12px;gap:12px}.stage{height:62vh!important;min-height:380px}.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none}.sub{font-size:13.5px}h1{font-size:22px}}
@media (pointer:coarse){.lab.click{padding:8px 10px;min-height:32px;display:flex;flex-direction:column;justify-content:center}.chip{padding:10px 14px 10px 11px}.lab.click:active{background:rgba(255,253,248,.9)}}
@media (prefers-reduced-motion:reduce){.chip,.lab,.tip{transition:none}}
</style>
<div class="app">
  <header>
    <h1>The robotics frontier, as a star</h1>
    <p class="sub">42 territories in 7 families. Spike length ≈ commercial reach: how far each territory has been pushed into paid, real-world use (a rough judgment from IFR data, company reports, VC portfolios, YC and the field's own taxonomies).</p>
    <div class="chips" id="chips"></div>
  </header>
  <div class="stage" id="stage">
    <svg class="under" id="under" aria-hidden="true"></svg>
    <div class="labels" id="labels"></div>
    <div class="crumb" id="crumb"></div>
    <div class="tip" id="tip"></div>
    <div class="hint" id="hint"></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = {"families": [{"key": "factory", "name": "Factories", "dark": "#7a5a00", "light": "#ffe066", "ink": "#8a6a00"}, {"key": "goods", "name": "Moving goods & people", "dark": "#8f4300", "light": "#ffb45a", "ink": "#b85a00"}, {"key": "field", "name": "Field & extreme environments", "dark": "#2f5a1a", "light": "#b6e38a", "ink": "#3f7a22"}, {"key": "bodies", "name": "Robot bodies", "dark": "#0f5a5a", "light": "#8fe3d6", "ink": "#127070"}, {"key": "brains", "name": "Robot brains & tools", "dark": "#3f2a7a", "light": "#cdbcff", "ink": "#5b3fb0"}, {"key": "care", "name": "Health & human body", "dark": "#7a2347", "light": "#ffb3cf", "ink": "#a3335f"}, {"key": "home", "name": "Home & services", "dark": "#3a4a6a", "light": "#b8c8e8", "ink": "#3f5f8f"}], "territories": [{"f": "factory", "n": "automotive (body, paint, assembly)", "s": "working", "m": 1.0, "e": "~138k of 603k industrial installs in 2025 (IFR 2026)", "focus": true, "ex": ["FANUC", "ABB", "KUKA", "Yaskawa"], "edge": "final assembly and wiring harnesses are still mostly manual"}, {"f": "factory", "n": "electronics & semiconductors", "s": "working", "m": 0.95, "e": "~142k of 603k installs in 2025, largest customer (IFR 2026)", "focus": true, "ex": ["FANUC", "Epson", "Yaskawa", "Foxconn"], "edge": "handling flexible cables and connectors"}, {"f": "factory", "n": "metals, machining & welding", "s": "working", "m": 0.75, "e": "mature arc and spot welding; AI welding (Path) and robotic forming (Machina) new", "focus": true, "ex": ["Path Robotics", "Machina Labs", "Lincoln Electric", "FANUC"], "edge": "high-mix jobs where programming takes longer than welding"}, {"f": "factory", "n": "food, pharma & packaging", "s": "working", "m": 0.65, "e": "palletizing saturated; picking food is hard", "focus": false, "ex": ["ABB", "Schmalz", "Chef Robotics"], "edge": "picking soft, varied, irregular items"}, {"f": "factory", "n": "lab automation & self-driving labs", "s": "emerging", "m": 0.45, "e": "YC: autonomous science labs", "focus": false, "ex": ["Opentrons", "Emerald Cloud Lab", "YC autonomous-lab startups"], "edge": "messy, manual wet-lab protocols"}, {"f": "factory", "n": "recycling & waste sorting", "s": "emerging", "m": 0.3, "e": "AI sorting lines (AMP-style)", "focus": false, "ex": ["AMP", "Glacier", "Greyparrot"], "edge": "contaminated streams and thin margins"}, {"f": "factory", "n": "construction", "s": "emerging", "m": 0.2, "e": "layout, excavation & drywall pilots; tiny share of spend", "focus": false, "ex": ["Dusty Robotics", "Bedrock Robotics", "Canvas", "Built Robotics"], "edge": "sites that change every day"}, {"f": "factory", "n": "textiles & apparel", "s": "fringe", "m": 0.1, "e": "sewing still mostly manual", "focus": false, "ex": ["Softwear Automation", "Sewbo"], "edge": "handling limp fabric"}, {"f": "goods", "n": "warehouse goods-to-person", "s": "working", "m": 0.9, "e": "Amazon 1M+ robots; ~118k logistics service robots in 2025 (IFR)", "focus": true, "ex": ["Amazon Robotics", "AutoStore", "Ocado", "Symbotic"], "edge": "picking the item off the shelf"}, {"f": "goods", "n": "warehouse picking", "s": "emerging", "m": 0.5, "e": "Covariant (licensed to Amazon), Vulcan; picking not saturated", "focus": true, "ex": ["Covariant", "Dexterity", "Amazon Vulcan", "Pickle"], "edge": "the long tail of odd items, plus damage and packing"}, {"f": "goods", "n": "robotaxis", "s": "working", "m": 0.65, "e": "Waymo ~500k paid rides/week; Zoox paid rides in Las Vegas; Tesla small fleet", "focus": false, "ex": ["Waymo", "Zoox", "Baidu Apollo Go", "Tesla"], "edge": "cost per vehicle, incidents per mile at scale, and public trust"}, {"f": "goods", "n": "autonomous trucking", "s": "emerging", "m": 0.35, "e": "Aurora ~440k driverless miles", "focus": false, "ex": ["Aurora", "Kodiak", "Waabi"], "edge": "weather, regulation, handoffs"}, {"f": "goods", "n": "sidewalk & drone delivery", "s": "emerging", "m": 0.55, "e": "Zipline 2M+ deliveries", "focus": false, "ex": ["Zipline", "Starship", "Wing", "Serve"], "edge": "the last ten feet and airspace rules"}, {"f": "field", "n": "defense drones & counter-drone", "s": "working", "m": 0.8, "e": "Ukraine fields millions of FPV drones a year; Anduril $61B (2026)", "focus": false, "ex": ["Anduril", "Shield AI", "Skydio", "Saronic"], "edge": "autonomy under jamming"}, {"f": "field", "n": "agriculture", "s": "working", "m": 0.5, "e": "milking & auto-steer work; laser weeding scaling; harvesting doesn't yet", "focus": false, "ex": ["Lely", "Carbon Robotics", "John Deere", "Monarch (shut down)"], "edge": "harvesting delicate crops with a machine that only works a few weeks a year"}, {"f": "field", "n": "energy, solar & data-center robots", "s": "emerging", "m": 0.25, "e": "YC: solar install, data-center upkeep", "focus": false, "ex": ["AES Maximo", "Cosmic", "YC data-center robot startups"], "edge": "30 kg panels on uneven ground, in weather, cheaper than a two-person crew"}, {"f": "field", "n": "inspection, mining & nuclear", "s": "working", "m": 0.6, "e": "Komatsu passed 1,000 autonomous haul trucks (Apr 2026); inspection quadrupeds", "focus": false, "ex": ["Boston Dynamics Spot", "ANYbotics", "Caterpillar autonomy", "Gecko Robotics"], "edge": "driving is solved; maintenance manipulation and radiation-hard electronics are not"}, {"f": "field", "n": "underwater & marine", "s": "emerging", "m": 0.4, "e": "uncrewed vessels, Saronic-style", "focus": false, "ex": ["Saronic", "Saildrone", "Anduril Ghost Shark"], "edge": "communication, energy and biofouling underwater"}, {"f": "field", "n": "space", "s": "fringe", "m": 0.25, "e": "orbital servicing, lunar construction (YC)", "focus": false, "ex": ["Gitai", "Northrop MEV", "Motiv"], "edge": "latency, launch cost, no repairs"}, {"f": "bodies", "n": "industrial arms & cobots", "s": "working", "m": 0.95, "e": "5.08M industrial robots in use, 603k installed in 2025 (IFR 2026)", "focus": true, "ex": ["Universal Robots", "FANUC", "ABB", "Standard Bots"], "edge": "setup for small shops; integration costs more than the arm"}, {"f": "bodies", "n": "two-arm mobile manipulators", "s": "emerging", "m": 0.25, "e": "20 US companies, $1.7k-150k", "focus": true, "ex": ["Sunday", "Dyna", "Weave", "Trossen", "NORI"], "edge": "hours, not minutes: 95% success is a failure every 20 tries"}, {"f": "bodies", "n": "humanoids", "s": "emerging", "m": 0.35, "e": "~13k shipped in 2025 (mostly research, education, display); ~19–25k in H1 2026, mostly China", "focus": false, "ex": ["Figure", "Agility", "Apptronik", "Unitree", "AgiBot", "Tesla Optimus"], "edge": "hands, two-hour batteries, legs vs wheels; no safety standard yet for a balancing robot near people"}, {"f": "bodies", "n": "legged robots & quadrupeds", "s": "emerging", "m": 0.5, "e": "inspection & defense quadrupeds", "focus": false, "ex": ["Boston Dynamics", "ANYbotics", "Unitree", "Ghost Robotics"], "edge": "manipulating while walking"}, {"f": "bodies", "n": "dexterous hands & touch", "s": "emerging", "m": 0.2, "e": "the field's named bottleneck (Brooks, Roadmap)", "focus": false, "ex": ["Meta/GelSight Digit 360", "Shadow Robot", "Sanctuary AI"], "edge": "no large touch datasets, and hands that survive a million cycles"}, {"f": "bodies", "n": "soft robots", "s": "fringe", "m": 0.15, "e": "Rus & Tolley 2015; IEEE soft robotics TC", "focus": false, "ex": ["Schmalz (ex-Soft Robotics grippers)", "Harvard octobot", "academic labs"], "edge": "control and durability"}, {"f": "bodies", "n": "micro/nano & bio-hybrid robots", "s": "fringe", "m": 0.08, "e": "Science Robotics grand challenge", "focus": false, "ex": ["Bionaut Labs", "academic labs (ETH, MIT)"], "edge": "power and steering inside the body"}, {"f": "brains", "n": "robot foundation models (VLAs)", "s": "emerging", "m": 0.35, "e": "Skild $14B, Physical Intelligence; independent evals still well below lab demos", "focus": true, "ex": ["Physical Intelligence", "Google DeepMind", "NVIDIA GR00T", "Skild"], "edge": "long tasks, recovering from failure, speed, and independent real-world scores"}, {"f": "brains", "n": "world models & simulation", "s": "emerging", "m": 0.3, "e": "sim-to-real, video world models", "focus": false, "ex": ["NVIDIA Cosmos", "DeepMind Genie", "1X world model"], "edge": "contact physics, and training (not just evaluating) with world models"}, {"f": "brains", "n": "data collection & teleoperation", "s": "emerging", "m": 0.35, "e": "gloves, UMI grippers, egocentric video (YC's #1 area)", "focus": false, "ex": ["Generalist", "Sunday gloves", "UMI", "YC data startups"], "edge": "which hours matter, and whether human-hand data transfers to robot hands"}, {"f": "brains", "n": "evals & benchmarks", "s": "fringe", "m": 0.2, "e": "Robocurve, RoboDojo, RoboArena", "focus": false, "ex": ["Robocurve", "RoboArena", "RoboDojo"], "edge": "standard, independent tests"}, {"f": "brains", "n": "classical control, planning & software", "s": "working", "m": 0.55, "e": "ROS 2, MPC, SLAM and motion planning run most deployed robots", "focus": false, "ex": ["Open Robotics (ROS 2)", "Intrinsic", "Foxglove", "NVIDIA Isaac", "MoveIt"], "edge": "safety guarantees when learned policies join the stack"}, {"f": "brains", "n": "multi-robot & swarms", "s": "fringe", "m": 0.2, "e": "Science Robotics grand challenge", "focus": false, "ex": ["drone swarm programs", "academic swarm labs"], "edge": "coordination with no comms and no GPS"}, {"f": "care", "n": "surgical robots", "s": "working", "m": 0.85, "e": "~12,100 da Vinci systems; ~906k procedures in Q3 2026", "focus": false, "ex": ["Intuitive (da Vinci)", "Medtronic Hugo", "CMR Surgical", "Moon Surgical"], "edge": "cost per procedure and reach beyond big hospitals; autonomy only for sub-tasks like suturing"}, {"f": "care", "n": "hospital logistics & pharmacy", "s": "emerging", "m": 0.35, "e": "medical service robots +91% (IFR)", "focus": false, "ex": ["Diligent (Moxi, now Serve)", "Aethon TUG"], "edge": "elevators, doors and fitting nurses’ workflow"}, {"f": "care", "n": "rehab, prosthetics & exoskeletons", "s": "emerging", "m": 0.3, "e": "Wandercraft Eve FDA-cleared (Aug 2026)", "focus": false, "ex": ["Ekso Bionics", "ReWalk", "Össur", "Wandercraft"], "edge": "cost and fit"}, {"f": "care", "n": "eldercare & assistive", "s": "fringe", "m": 0.1, "e": "barely touched; demographic pull", "focus": false, "ex": ["Toyota Research HSR", "Labrador Systems", "ElliQ"], "edge": "safe physical contact (lifting, transfers) and trust at home"}, {"f": "care", "n": "brain-computer interfaces", "s": "fringe", "m": 0.12, "e": "Science Robotics grand challenge", "focus": false, "ex": ["Neuralink", "Synchron", "Blackrock Neurotech"], "edge": "long-term implants"}, {"f": "home", "n": "vacuums, mowers & pool robots", "s": "working", "m": 0.95, "e": "~34M consumer robots in 2025, +37% (IFR 2026)", "focus": false, "ex": ["iRobot", "Roborock", "Ecovacs"], "edge": "tidying, not just vacuuming"}, {"f": "home", "n": "commercial cleaning", "s": "working", "m": 0.55, "e": "cleaning service robots +34% (IFR)", "focus": false, "ex": ["Brain Corp", "Avidbots", "SoftBank Whiz"], "edge": "varied spaces and edge cases"}, {"f": "home", "n": "restaurants & hospitality", "s": "emerging", "m": 0.35, "e": "serving robots are real in Asia: Pudu says it has shipped over 100,000", "focus": false, "ex": ["Pudu", "Bear Robotics", "Miso Robotics", "Chef Robotics"], "edge": "economics per location"}, {"f": "home", "n": "home manipulation (laundry, dishes)", "s": "emerging", "m": 0.1, "e": "Sunday, 1X NEO, Weave pilots; most still lean on remote operators", "focus": false, "ex": ["Sunday", "1X NEO", "Weave", "Dyna (commercial laundry)"], "edge": "every home is different"}, {"f": "home", "n": "social & companion robots", "s": "fringe", "m": 0.2, "e": "education, companionship", "focus": false, "ex": ["ElliQ", "Sony aibo", "Embodied Moxie (shut down)"], "edge": "lasting value after the novelty"}], "sections": {"automotive (body, paint, assembly)": [{"years": "1961–1980", "title": "First robots on car lines", "text": "Unimate installed at a General Motors plant in New Jersey in 1961 for die-casting handling; spot welding and painting lines followed through the 1970s, with the PUMA arm (1978) targeting assembly.", "items": [{"name": "Unimate at GM Ewing Township plant", "kind": "milestone", "year": 1961, "url": "", "verified": false}, {"name": "Unimation PUMA (developed with GM)", "kind": "product", "year": 1978, "url": "", "verified": false}]}, {"years": "1980–2005", "title": "Body-in-white automation", "text": "Welding, sealing and painting cells became standard in body shops; FANUC, ABB, KUKA and Yaskawa grew into the dominant suppliers by selling to car makers.", "items": [{"name": "FANUC, ABB, KUKA, Yaskawa as incumbent suppliers", "kind": "company", "year": 1990, "url": "", "verified": false}]}, {"years": "2005–2024", "title": "Today: largest or second-largest robot customer", "text": "Automotive was the second-largest customer industry in 2024 (about 126,000 of 542,000 global installs, roughly 23%,, behind electronics at 128,000. Final assembly, trim and harness work remain largely manual.", "items": [{"name": "IFR World Robotics 2025: 542,000 installs in 2024; auto 126k, electronics 128k", "kind": "report", "year": 2025, "url": "https://ifr.org/downloads/press_docs/2025-09-25-IFR_press_release_India_in_English.pdf", "verified": true}, {"name": "IFR global installs and stock 2024 (4.66M units operating)", "kind": "report", "year": 2025, "url": "https://ifr.org/ifr-press-releases/news/global-robot-demand-in-factories-doubles-over-10-years", "verified": true}]}, {"years": "2024–2025", "title": "Humanoid pilots enter the plant", "text": "BMW reported a Figure 02 pilot at Spartanburg in 2024 inserting sheet-metal parts into body-shop fixtures; no units were then deployed. Sources later describe a roughly 10-11 month 2025 body-shop run and a Figure 03 follow-on.", "items": [{"name": "BMW completes Figure 02 pilot at Spartanburg (Aug 2024
