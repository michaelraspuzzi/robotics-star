<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Digital Twin Star</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500&display=swap">
<style>
/* layout: stage (3D star) + side panel; panel stacks below on phones. single warm-paper theme to match the essay figures */
:root{--bg:#fbf8f1;--ink:#26262b;--muted:#6e6a62;--line:#e6e0d3;--card:#fffdf8;--hull:#3a6ea5;
--sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",sans-serif;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);gap:18px;max-width:1520px;margin:0 auto;padding-block:18px;height:100vh;min-height:620px;box-sizing:border-box}
header{grid-column:1/-1}
h1{font:600 26px/1.15 var(--sans);letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:820px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:500 13.5px/1 var(--sans);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px 7px 9px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;transition:border-color .15s,background .15s}
.metric{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font:500 13px/1 var(--sans);color:var(--muted)}
.metric button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.metric button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.secimg{margin:6px 0 8px}.secimg img{display:block;width:100%;height:150px;object-fit:cover;border-radius:8px;background:#eee}.secimg figcaption{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.nums{grid-column:2;font:500 11.5px/1.3 var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.chip:hover{border-color:#bdb5a4}
.chip[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.chip:focus-visible,.crumb button:focus-visible,.row:focus-visible{outline:2px solid var(--hull);outline-offset:2px}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.3)}
.stage{position:relative;min-height:420px;height:auto;min-width:0;border-radius:14px;overflow:hidden;touch-action:none}
.stage svg.under,.stage canvas,.stage .labels{position:absolute;inset:0;width:100%;height:100%}
.stage canvas{cursor:grab}
.stage canvas.dragging{cursor:grabbing}
.stage canvas.pointing{cursor:pointer}
.labels{pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:500 13px/1.2 var(--cond);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);transition:opacity .25s}
.lab.fam{font:600 15px/1.2 var(--sans);letter-spacing:.01em}
.lab.fam small{display:block;font:400 12px/1.2 var(--sans);color:var(--muted);text-align:center}
.lab.big{font:500 15px/1.25 var(--cond);background:rgba(251,248,241,.82);border-radius:6px;padding:2px 6px}
.lab .ev{display:block;font:400 12px/1.3 var(--sans);color:var(--muted)}
.lab.tick{font:400 12.5px/1.2 var(--sans);color:var(--ink)}
.dotm{display:inline-block;width:6px;height:6px;border-radius:50%;background:#26262b;margin-right:6px;vertical-align:2px}
.lab.click{pointer-events:auto;cursor:pointer;padding:4px 6px;border-radius:6px}
.lab.click:hover{background:rgba(255,253,248,.9);text-decoration:underline;text-underline-offset:3px}
.sec{border-top:1px solid var(--line);padding:10px 0}
.sec{cursor:pointer;transition:background .2s}
.tailpad{height:calc(100vh - 420px)}
@media (max-width:900px){.tailpad{display:none}}
.sec:hover{background:#faf6ee}
.sec.on{background:color-mix(in srgb,var(--fl) 30%,#fffdf8);box-shadow:inset 4px 0 0 var(--fd);margin:0 -8px;padding:10px 8px 10px 14px;border-radius:8px}
.sec.on h3{color:var(--fd)}
.lab.sl{transition:opacity .25s}
.lab.sl.up{transform:translate(-50%,-100%)}
.lab.sl.side{transform:translate(0,-50%)}
.lab.sl.dn{transform:translate(0,0);transform:translate(-50%,0)}
.slimg{display:block;width:118px;height:76px;object-fit:cover;border-radius:7px;margin:0 auto 5px;box-shadow:0 3px 10px rgba(40,30,10,.18);border:2px solid #fffdf8;transition:transform .2s}
.slimg.on{transform:scale(1.18)}
.lab.sl.dn .slw{display:inline-flex;flex-direction:column;align-items:center}.lab.sl.dn .slimg{order:3;margin:6px auto 0}
.slimg.side{width:64px;height:44px;margin:0 0 4px;float:none}
.slw{display:inline-block;white-space:normal;text-align:center;line-height:1.25}
.slw b{display:block;font:600 12px/1.3 var(--sans);letter-spacing:.04em;color:#a23b2a}
.slw i{display:block;font:500 14px/1.25 var(--cond);font-style:normal;color:var(--ink)}
.lab.sl.on .slw i{color:var(--fc);text-decoration:underline;text-underline-offset:3px}
.sec .yr{font:600 12px/1 var(--sans);letter-spacing:.06em;color:#a23b2a}
.sec h3{font:600 15px/1.3 var(--sans);margin:4px 0 2px}
.sec p{margin:0 0 6px;color:var(--muted);font-size:13px}
.it{display:grid;grid-template-columns:62px minmax(0,1fr);gap:2px 8px;font-size:12.5px;padding:3px 0}
.it .k{font:600 10.5px/1.6 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.it a{color:var(--ink);text-underline-offset:2px}
.it .u{color:#a23b2a;font-size:11px}
.slicebtn{font:500 13.5px/1 var(--sans);border:1px solid var(--ink);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;margin-top:6px}
.lab.title{font:600 22px/1.2 var(--sans)}
.crumb{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:6px;font:500 13.5px/1 var(--sans);color:var(--muted)}
.crumb button{font:inherit;border:0;background:none;color:var(--ink);padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#c9c2b3}
.crumb .here{color:var(--ink);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid #cfc7b6;border-radius:10px;padding:8px 11px;font-size:13px;max-width:270px;opacity:0;transition:opacity .12s;box-shadow:0 6px 18px rgba(40,30,10,.08)}
.tip b{font-weight:600;font-size:14px;display:block;margin-bottom:2px}
.hint{position:absolute;left:14px;bottom:10px;color:var(--muted);font-size:12.5px;pointer-events:none}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;align-self:start;max-height:100%;overflow:auto}
aside h2{font:600 19px/1.2 var(--sans);margin:0 0 2px}
aside .count{color:var(--muted);margin:0 0 10px;font-size:13px}
.row{display:grid;grid-template-columns:16px minmax(0,1fr);gap:3px 8px;padding:8px 6px;margin:0 -6px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:hover{background:#f6f1e6}
.row .nm{font-weight:500}
.row .ev{grid-column:2;color:var(--muted);font-size:12.5px}
.bar{grid-column:2;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.mk{width:11px;height:11px;border-radius:50%;margin-top:4px;box-sizing:border-box}
.famrow{display:flex;align-items:center;gap:10px;padding:9px 6px;margin:0 -6px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line)}
.famrow:hover{background:#f6f1e6}
.famrow .n{font-weight:600}.famrow .c{margin-left:auto;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:13.5px;margin:10px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.pl span{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12.5px;background:#fff}
.legend{color:var(--muted);font-size:12px;margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 14px}
.note{color:var(--muted);font-size:12px;margin-top:12px}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:none;height:auto;min-height:0}.stage{height:68vh;min-height:420px}aside{max-height:none}}
@media (max-width:600px){.sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.app{padding-block:12px;gap:12px}.stage{height:62vh!important;min-height:380px}.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none}.sub{font-size:13.5px}h1{font-size:22px}}
@media (pointer:coarse){.lab.click{padding:8px 10px;min-height:32px;display:flex;flex-direction:column;justify-content:center}.chip{padding:10px 14px 10px 11px}.lab.click:active{background:rgba(255,253,248,.9)}}
@media (prefers-reduced-motion:reduce){.chip,.lab,.tip{transition:none}}
</style>
<div class="app">
  <header>
    <h1 id="ttl"></h1>
    <p class="sub" id="sub"></p>
    <div class="chips" id="chips"></div>
    <div class="metric" id="metric" role="group" aria-label="Spike length"></div>
  </header>
  <div class="stage" id="stage">
    <svg class="under" id="under" aria-hidden="true"></svg>
    <div class="labels" id="labels"></div>
    <div class="crumb" id="crumb"></div>
    <div class="tip" id="tip"></div>
    <div class="hint" id="hint"></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

o.", "ex": ["GE Aerospace (GE9X/LEAP engine twins, MRO AI inspection)", "Rolls-Royce (IntelligentEngine, Blue Data Thread)", "Pratt & Whitney (F135 usage-life twins)", "CFM International / Safran", "Lufthansa Technik (engine shop-visit analytics)"], "edge": "Reconciling a few on-wing snapshots per flight with shop-visit teardown truth, so a remaining-life estimate is trusted enough to move an overhaul slot.", "focus": false}, {"f": "aero", "n": "Airframe structural health", "s": "emerging", "m": 0.2, "what": "Finite-element airframe with real flight load spectra to track fatigue life per tail number and shift inspection intervals.", "q": "aircraft structural", "papers": 21, "early": 6, "late": 15, "growthX": 2.3, "v": {"papers": 0.356, "growth": 0.277, "maturity": 0.2}, "vf": {"papers": 0.06, "growth": 0.06, "maturity": 0.2}, "e": "Airbus Defence & Space builds a Fatigue Digital Equivalent per aircraft with 200-1,200 tracked Degradation Assessment Locations (ICAF 2023); at IWSHM 2025 Airbus said few SHM solutions fly on commercial aircraft after 25 years of development.", "ex": ["Airbus Defence & Space (Fatigue Digital Equivalent)", "NRC Canada + Royal Canadian Air Force (Airframe Digital Twin framework)", "USAF + Wichita State NIAR (B-1B airframe twin)", "Beihang University (UAV structural twin)"], "edge": "Strain is measured at a handful of gauges but cracks start locally, so no one can yet prove a per-tail fatigue estimate well enough for regulators to extend an inspection interval.", "focus": false}, {"f": "aero", "n": "Avionics & flight simulation", "s": "working", "m": 0.5, "what": "Software-in-the-loop replica of the flight-control stack synced to flight-test telemetry; certifies software and replays incidents.", "q": "avionics OR \"flight control\"", "papers": 69, "early": 22, "late": 47, "growthX": 2.1, "v": {"papers": 0.498, "growth": 0.277, "maturity": 0.5}, "vf": {"papers": 0.602, "growth": 0.06, "maturity": 0.5}, "e": "Vendor ADI says its digital-twin aircraft plus iron bird lab runs dozens to hundreds of virtual flight tests overnight (ADI, vendor claim); a March 2025 AIAA paper validated an iron-bird twin against real certification flight tests.", "ex": ["Applied Dynamics International (digital-twin aircraft + iron bird lab)", "Speedgoat (HIL systems used as subsystem twins, e.g. Lilium)", "NASA IV&V (flight-software twins on emulated hardware)", "Airbus (virtual iron bird research)"], "edge": "Getting regulators to grant certification credit for virtual flight tests; today the twin finds bugs and replays incidents, but flight test still signs the paper.", "focus": false}, {"f": "aero", "n": "Fleet ops & MRO", "s": "working", "m": 0.5, "what": "Fleet record twin (config, hours, cycles, defects) merged with health data to schedule hangars and spares.", "q": "aircraft maintenance", "papers": 36, "early": 9, "late": 27, "growthX": 2.8, "v": {"papers": 0.42, "growth": 0.348, "maturity": 0.5}, "vf": {"papers": 0.303, "growth": 0.31, "maturity": 0.5}, "e": "Airbus Skywise connects 12,000+ aircraft (Military & Aerospace Electronics, Apr 2026); Lufthansa Technik says 40+ customers with 5,000+ aircraft use AVIATAR (July 2025 release).", "ex": ["Airbus Skywise (Fleet Performance+)", "Lufthansa Technik AVIATAR", "Delta TechOps (with GE Digital on predictive algorithms)", "Rolls-Royce Blue Data Thread", "Emirates, LATAM, Air Transat (adopters)"], "edge": "Merging configuration, task cards, parts pool and health predictions into one schedule that planners trust enough to pre-position spares and hold hangar slots, not just show alerts.", "focus": false}, {"f": "aero", "n": "Spacecraft & satellites", "s": "emerging", "m": 0.2, "what": "Ground replica of subsystem states updated each telemetry pass; diagnoses anomalies and rehearses commands.", "q": "spacecraft", "papers": 127, "early": 32, "late": 95, "growthX": 2.9, "v": {"papers": 0.573, "growth": 0.383, "maturity": 0.2}, "vf": {"papers": 0.884, "growth": 0.436, "maturity": lates conservation laws, and cannot yet be validated against ground-truth sensors well enough for a safety case.", "focus": false}], "sections": {"Jet engine health & prognostics": [{"years": "1940s-1990s", "title": "Trend charts and power-by-the-hour", "text": "Engine health began as ground-crew trend charts of exhaust-gas temperature and vibration against flight hours. Fleet contracts priced engines per flight hour, which made per-engine condition data valuable.", "items": [{"name": "Whittle W.1 first flight engine, Power Jets (flew in the Gloster E.28/39)", "kind": "milestone", "year": 1941, "url": null, "verified": false}, {"name": "Rolls-Royce has monitored engines and billed per flight hour for 20+ years (CIO.com on IntelligentEngine)", "kind": "report", "year": 2021, "url": "https://www.cio.com/article/3620993/rolls-royce-turns-to-digital-twins-to-improve-jet-engine-efficiency.html", "verified": true}], "img": {"src": "img/jet-engine-health-prognostics-0.jpg", "credit": "Dane A. Penland / CC0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Whittle_W.1X_NASM.jpg", "alt": "Whittle W.1X turbojet, the engine that flew in the Gloster E.28/39"}}, {"years": "2000s-2010s", "title": "On-wing data goes satellite", "text": "Engines began streaming condition snapshots by ACARS and satellite, feeding per-serial-number thermodynamic and life models. OEMs bundled monitoring into long-term service agreements.", "items": [{"name": "Rolls-Royce IntelligentEngine vision: engine and its digital twin linked by data", "kind": "company", "year": 2018, "url": "https://www.rolls-royce.com/media/press-releases/2018/16-07-2018-rr-intelligentengine-vision-makes-rapid-progress.aspx", "verified": true}, {"name": "GE9X new testing philosophy to ease entry into service (AIN)", "kind": "report", "year": 2017, "url": "https://backend.ainonline.com/aviation-news/air-transport/2017-11-09/new-testing-philosophy-will-aid-ge9x-entry-service", "verified": false}], "img": {"src": "img/jet-engine-health-prognostics-1.jpg", "credit": "Dysanovic from Reading, United Kingdom / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:General_Electric_GE90_displayed_at_Farnborough_Air_Show_2008.jpg", "alt": "GE90 turbofan on display at Farnborough 2008"}}, {"years": "2018-2024", "title": "One twin per serial number", "text": "Each delivered engine carries its own digital thumbprint of as-built geometry and test data. Operators and OEMs track cycles and forecast part life from it.", "items": [{"name": "GE Aerospace: every GE and CFM engine has a digital twin, incl. newly FAA-certified GE9X", "kind": "product", "year": 2020, "url": "https://www.geaerospace.com/news/articles/product-technology/no-two-alike-each-jet-engine-delivery-comes-its-own-digital-thumbprint", "verified": true}, {"name": "Rolls-Royce Blue Data Thread open data backbone for airlines, MROs and OEMs", "kind": "product", "year": 2021, "url": "https://www.rolls-royce.com/innovation/digital/digital-platforms.aspx", "verified": true}], "img": {"src": "img/jet-engine-health-prognostics-2.jpg", "credit": "Julian Herzog (Website) / CC BY 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Rolls-Royce_Trent_XWB_on_Airbus_A350-941_F-WWCF_MSN002_ILA_Berlin_2016_09.jpg", "alt": "Rolls-Royce Trent XWB on an Airbus A350 test aircraft"}}, {"years": "2025-26", "title": "AI on the twin, durability retrofits", "text": "The twin is now an input to AI inspection and durability programs that stretch time on wing. The numbers that matter are shop-visit intervals.", "items": [{"name": "GE Aerospace deploys AI inspection tool to 12+ MRO shops to improve time on wing", "kind": "milestone", "year": 2025, "url": "https://aerospaceamerica.aiaa.org/year-in-review/focus-on-engine-durability-continues-to-improve-air-travel/", "verified": true}, {"name": "Pratt & Whitney GTF Advantage certified, promising double time on wing", "kind": "milestone", "year": 2025, "url": "https://simpleflying.com/pratt-whitney-gtf-engine-differs-rolls-royce-trent-xwb/", "verified": false}, {"name": "Rolls-Royce time-on-wing doubling and GBP 1bn Trent durability commitment", "kind": "report", "year": 2025, "url": "https://www.eplaneai.com/news/rolls-royce-doubles-engine-time-on-wing-since-transformation-began", "verified": false}], "img": {"src": "img/jet-engine-health-prognostics-3.jpg", "credit": "Delta News Hub / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Delta_Jet_Engine_Test_Cell_Facility_(40202252053).jpg", "alt": "Jet engine test cell facility at Delta TechOps"}}], "Airframe structural health": [{"years": "1950s-1980s", "title": "Comet and fatigue life", "text": "The Comet 1 fuselage failures were traced by pressurized tank fatigue tests, birthing safe-life and then damage-tolerance design. Fatigue life became something you test on a full airframe.", "items": [{"name": "De Havilland Comet 1 fuselage fatigue tests at Farnborough after 1954 losses", "kind": "milestone", "year": 1954, "url": null, "verified": false}, {"name": "FAA damage-tolerance requirements for transport aircraft (FAR 25.571 amendment)", "kind": "milestone", "year": 1978, "url": null, "verified": false}], "img": {"src": "img/airframe-structural-health-0.jpg", "credit": "Clemens Vasters from Viersen, Germany, Germany / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Fatigue_Test_on_Fuselage_of_Comet_1_G-ALYU_(27698073420).jpg", "alt": "Fatigue-test fuselage of de Havilland Comet 1 G-ALYU"}}, {"years": "1988-2010s", "title": "Aging fleets and per-tail tracking", "text": "Aloha 243 in 1988 pushed regulators toward widespread fatigue damage rules and limits of validity. Militaries began Individual Aircraft Tracking, logging each tail's load history against its fatigue model.", "items": [{"name": "Aloha Airlines Flight 243 fuselage failure, NTSB investigation", "kind": "milestone", "year": 1988, "url": null, "verified": false}, {"name": "USAF Individual Aircraft Tracking extended into probabilistic airframe twins", "kind": "report", "year": 2024, "url": "https://www.icas.org/icas_archive/icas2024/data/papers/icas2024_0724_paper.pdf", "verified": true}], "img": {"src": "img/airframe-structural-health-1.jpg", "credit": "FAA / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Aloha_Airlines_Flight_243_after_accident.jpg", "alt": "Aloha Airlines Flight 243 fuselage after the 1988 in-flight failure"}}, {"years": "2020-2024", "title": "Boneyard airframes become models", "text": "Full retired airframes are scanned and instrumented to build finite-element twins of high-fatigue zones. Airbus fits a fatigue twin to each fleet aircraft.", "items": [{"name": "USAF ships retired B-1B 85-0092 to Wichita State NIAR to build its digital twin", "kind": "milestone", "year": 2020, "url": "https://www.twz.com/33151/air-force-sends-full-b-1b-airframe-from-boneyard-to-kansas-to-create-its-digital-twin", "verified": true}, {"name": "Airbus Fatigue Digital Equivalent: 200-1,200 degradation assessment locations per aircraft (ICAF 2023)", "kind": "paper", "year": 2023, "url": "https://www.icaf.aero/icaf2023/proceedings/documents/58.pdf", "verified": true}, {"name": "NRC Canada Airframe Digital Twin: FEA + probabilistic crack growth + risk, adopted by RCAF", "kind": "paper", "year": 2024, "url": "https://www.icas.org/icas_archive/icas2024/data/papers/icas2024_0724_paper.pdf", "verified": true}], "img": {"src": "img/airframe-structural-health-2.jpg", "credit": "Master Sgt. Nicholas Priest / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:A_B-1B_Lancer.jpg", "alt": "USAF B-1B Lancer bomber in flight"}}, {"years": "2025-26", "title": "SHM meets AI, still few in service", "text": "Airbus told the 2025 SHM workshop that twins and AI are the likeliest path to condition-based airframe maintenance. Research now predicts crack growth in real time from flight parameters.", "items": [{"name": "Airbus keynote at IWSHM 2025: few SHM systems flying after 25 years, twins and AI next", "kind": "report", "year": 2025, "url": "https://iwshm2025.stanford.edu/keynotes", "verified": true}, {"name": "Review: digital twins for aeronautical fatigue and structural integrity (Acta Aeronaut. Astronaut. Sin.)", "kind": "paper", "year": 2025, "url": "https://hkxb.buaa.edu.cn/CN/abstract/article/1000-6893/20406", "verified": true}, {"name": "Structural digital twin of a UAV predicts fatigue crack growth in real time from flight parameters", "kind": "paper", "year": 2024, "url": "https://research.buaa.edu.cn/en/publications/on-the-development-of-the-structural-digital-twin-of-an-unmanned-/", "verified": true}], "img": null}], "Avionics & flight simulation": [{"years": "1929-1990s", "title": "Link Trainer to fly-by-wire iron birds", "text": "Ground simulators began with the pneumatic Link Trainer and grew into full-flight sims. Fly-by-wire airliners were developed against iron birds, rigs that wire real actuators and computers to a flight model.", "items": [{"name": "Link Trainer pneumatic flight simulator introduced", "kind": "milestone", "year": 1929, "url": null, "verified": false}, {"name": "Airbus A320 enters flight test as first digital fly-by-wire airliner", "kind": "milestone", "year": 1987, "url": null, "verified": false}, {"name": "RTCA DO-178B software certification standard", "kind": "milestone", "year": 1992, "url": null, "verified": false}], "img": {"src": "img/avionics-flight-simulation-0.jpg", "credit": "Rjcastillo / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Link_Trainer_Modelo_C-8,_A742745.jpg", "alt": "Link Trainer pneumatic flight simulator on display"}}, {"years": "2000s-2010s", "title": "Model-based design and DO-178C", "text": "Controllers were generated from models and verified in software-in-the-loop and hardware-in-the-loop benches. DO-178C and its model-based supplement formalized credit for that evidence.", "items": [{"name": "DO-178C and DO-331 (model-based development supplement) published", "kind": "milestone", "year": 2011, "url": null, "verified": false}, {"name": "Virtual iron bird designed as a digital twin of the test rig (conference paper)", "kind": "paper", "year": 2021, "url": "https://www.researchgate.net/publication/348245602_Designing_a_Virtual_Iron_Bird_as_a_Digital_Twin", "verified": true}], "img": {"src": "img/avionics-flight-simulation-1.jpg", "credit": "NASA / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Cockpit_Motion_Facility.jpg", "alt": "NASA cockpit motion simulator facility"}}, {"years": "2020-2024", "title": "Twins in the loop", "text": "Test rigs, flight models and controllers run together so regression suites replay overnight. eVTOL entrants used HIL benches as subsystem twins for DO-331 work.", "items": [{"name": "Lilium used Speedgoat HIL systems as digital twins of jet subsystems for controller V&V", "kind": "company", "year": 2023, "url": "https://www.speedgoat.com/company/news-media/lilium", "verified": false}, {"name": "ADI digital twin aircraft feeding an Iron Bird Lab with automated regression flights", "kind": "product", "year": 2024, "url": "https://www.adi.com/aerospace-defense/aerospace-defense-digital-twin-solutions/", "verified": true}], "img": {"src": "img/avionics-flight-simulation-2.jpg", "credit": "Ilari Kousa / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:A350-900_full_flight_simulator_cockpit_VHHH.jpg", "alt": "Airbus A350-900 full flight simulator cockpit"}}, {"years": "2025-26", "title": "Toward virtual certification", "text": "Research is comparing simulator flights against real certification-test flights to show virtual tests can stand in for some real ones. Drone teams are building full SIL pipelines.", "items": [{"name": "AIAA paper: From Iron Birds to Digital Twins with Engineering Simulators, Toward Virtual Certification", "kind": "paper", "year": 2025, "url": "https://doi.org/10.2514/1.I011569", "verified": true}, {"name": "A Step-by-Step Guide to Creating a Robust Autonomous Drone Testing Pipeline (arXiv)", "kind": "paper", "year": 2025, "url": "https://arxiv.org/pdf/2506.11400", "verified": true}, {"name": "NASA IV&V: software digital twins emulate hardware so flight binaries run as delivered", "kind": "report", "year": 2025, "url": "https://ntrs.nasa.gov/api/citations/20250005069/downloads/20250617_JSTAR_Software_Digital_Twins_CLDP_Strives.pdf", "verified": true}], "img": null}], "Fleet ops & MRO": [{"years": "1960s-1990s", "title": "From hard-time to on-condition", "text": "MSG-1 for the Boeing 747 moved maintenance from fixed overhaul times to on-condition tasks. Data links like ACARS began sending defects to the ground.", "items": [{"name": "MSG-1 maintenance steering group process created for Boeing 747", "kind": "milestone", "year": 1968, "url": null, "verified": false}, {"name": "ARINC ACARS data link begins operation", "kind": "milestone", "year": 1978, "url": null, "verified": false}], "img": {"src": "img/fleet-ops-mro-0.jpg", "credit": "Boeing Dreamscape / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:China_Airlines%27_Boeing_747_in_maintenance_hangar.jpg", "alt": "Boeing 747 inside a maintenance hangar"}}, {"years": "2000s-2017", "title": "Fleet records go digital", "text": "Airlines and MROs moved logbooks, task cards and parts tracking into maintenance systems. Onboard maintenance computers streamed fault data to operations centers.", "items": [{"name": "Lufthansa Technik launches AVIATAR digital platform", "kind": "product", "year": 2017, "url": "https://newsroom.lufthansa-technik.com/full-digital-tech-ops-ecosystem-adopted-by-air-transat/", "verified": true}, {"name": "Airbus launches Skywise open data platform at Paris Air Show", "kind": "product", "year": 2017, "url": null, "verified": false}], "img": {"src": "img/fleet-ops-mro-1.jpg", "credit": "Curimedia / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Iberia%C2%B4s_Maintenance_Hangar_(5837519156).jpg", "alt": "Airline maintenance hangar at Iberia"}}, {"years": "2018-2024", "title": "Cross-fleet analytics", "text": "Platforms pooled data from many operators to train predictive algorithms. Airbus reports 200+ predictive algorithms built with partners such as Delta TechOps and GE Digital.", "items": [{"name": "Airbus Skywise: ~12,000 connected aircraft, 48,000+ users, 200+ predictive algorithms", "kind": "report", "year": 2024, "url": "https://www.talan.com/uk/en/positive-innovation/ai-skies", "verified": true}, {"name": "Rolls-Royce Blue Data Thread links airlines, MROs and OEMs", "kind": "product", "year": 2021, "url": "https://www.rolls-royce.com/innovation/digital/digital-platforms.aspx", "verified": true}], "img": {"src": "img/fleet-ops-mro-2.jpg", "credit": "Curimedia / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Airbus_A330_Qatar_at_Iberia_Maintenance_Hangar_(7006210241).jpg", "alt": "Airbus A330 undergoing maintenance in a hangar"}}, {"years": "2025-26", "title": "Predictive maintenance as fleet-wide contract", "text": "Large carriers now buy twin-style predictive maintenance for whole fleets. Airbus consolidated Skywise and NAVBLUE into one subsidiary.", "items": [{"name": "Emirates invests in Airbus Skywise S.FP+ and Core X3 for A380 and A350 fleets", "kind": "milestone", "year": 2025, "url": "https://www.emirates.com/media-centre/emirates-advances-fleet-availability-with-investment-in-airbus-skywise-sfp-and-core-x3-digital-predictive-maintenance-solution/", "verified": true}, {"name": "LATAM signs AVIATAR for 300+ A320, 777 and 787 aircraft", "kind": "milestone", "year": 2025, "url": "https://newsroom.lufthansa-technik.com/latam-opts-for-lufthansa-techniks-digital-platform-aviatar/", "verified": true}, {"name": "Air Transat adopts full AVIATAR digital tech-ops ecosystem across 43 A321 and A330", "kind": "milestone", "year": 2025, "url": "https://newsroom.lufthansa-technik.com/full-digital-tech-ops-ecosystem-adopted-by-air-transat/", "verified": true}, {"name": "Airbus forms wholly owned Skywise subsidiary merging Skywise and NAVBLUE (~750 staff)", "kind": "company", "year": 2026, "url": "https://www.militaryaerospace.com/commercial-aerospace/article/55368649/airbus-forms-skywise-subsidiary-to-unify-data-analytics-and-flight-operations-software", "verified": true}], "img": null}], "Spacecraft & satellites": [{"years": "1960s-1990s", "title": "Mission control and ground sims", "text": "Flight controllers rehearsed anomalies on ground simulators before commanding the vehicle. Apollo 13's improvised scrubber fix was validated that way.", "items": [{"name": "Mission Control Center Houston supports Gemini 4", "kind": "milestone", "year": 1965, "url": null, "verified": false}, {"name": "Apollo 13 CO2 scrubber fix rehearsed on ground simulators", "kind": "milestone", "year": 1970, "url": null, "verified": false}], "img": {"src": "img/spacecraft-satellites-0.jpg", "credit": "NASA / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Apollo_13_Mailbox_at_Mission_Control.jpg", "alt": "Mission Control Houston during Apollo 13"}}, {"years": "2000s-2010s", "title": "Testbeds and the name 'digital twin'", "text": "Flight software ran against emulated hardware on ground testbeds. NASA's 2010 modeling and simulation roadmap used the term digital twin for a vehicle's ultra-realistic mirror.", "items": [{"name": "NASA Modeling, Simulation, Information Technology and Processing Roadmap (TA11) uses 'digital twin'", "kind": "report", "year": 2010, "url": null, "verified": false}, {"name": "NASA NOS3 open-source flight-software simulator", "kind": "product", "year": 2015, "url": null, "verified": false}], "img": {"src": "img/spacecraft-satellites-1.jpg", "credit": "James Blair / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:STS-128_MCC_space_station_flight_control_room.jpg", "alt": "Space station flight control room at NASA Johnson"}}, {"years": "2020-2024", "title": "Space domain twins and startups", "text": "Defence buyers funded twins of orbits, weather and interference for training and war-gaming. Startups sold per-satellite twins to operators.", "items": [{"name": "Slingshot wins $25.2M, 39-month Space Force contract for Digital Space Twin", "kind": "milestone", "year": 2022, "url": "https://venturebeat.com/ai/slingshot-lands-25-2m-contract-for-digital-space-twin", "verified": true}, {"name": "Antaris raises $3.5M seed for TrueTwin satellite digital twin", "kind": "startup", "year": 2023, "url": "https://payloadspace.com/antaris-raises-28m-series-a/", "verified": false}, {"name": "Noblis Ventures invests in Sedaro digital twin platform", "kind": "startup", "year": 2024, "url": "https://washingtontechnology.com/companies/2024/04/noblis-venture-arm-backs-digital-twin-specialist/395620/", "verified": true}], "img": {"src": "img/spacecraft-satellites-2.jpg", "credit": "NSF’s National Optical-Infrared Astronomy Research Laborator / CC BY 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Starlink_Satellites_Imaged_from_CTIO.jpg", "alt": "Starlink satellite trails imaged from CTIO"}}, {"years": "2025-26", "title": "The twin flies onboard", "text": "Twins moved from ground to orbit and into software test benches. Government buyers are asking for federated engineering twins.", "items": [{"name": "UC Davis and Proteus Space launch first dynamic power-system digital twin running onboard a small satellite", "kind": "milestone", "year": 2025, "url": "https://smallsatnews.com/2025/10/28/uc-davis-proteus-space-to-launch-1st-dynamic-digital-twin-into-space/", "verified": true}, {"name": "A Digital Twin Approach for Spacecraft On-Board Software Development and Testing (Aerospace, MDPI)", "kind": "paper", "year": 2026, "url": "https://re.public.polimi.it/handle/11311/1304352", "verified": true}, {"name": "Space Systems Command selects Sedaro for federated digital engineering platform", "kind": "milestone", "year": 2026, "url": "https://satnews.com/2026/06/24/digital-twins-for-space-command-sedaro-tapped-by-space-force-to-build-federated-engineering-platform/", "verified": true}, {"name": "ESA PUSH 2025 winners include digital-twin startups Asynchronics and Valar (EUR 75k each)", "kind": "startup", "year": 2025, "url": "https://commercialisation.esa.int/2025/09/winners-of-esa-push-2025-and-your-chance-to-benefit", "verified": true}], "img": {"src": "img/spacecraft-satellites-3.jpg", "credit": "NASA / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:NanoRacks_CubeSat_deployer_deploying_CXBN-2_and_IceCube.jpg", "alt": "NanoRacks deployer releasing CubeSats from the ISS"}}], "Airports & air traffic": [{"years": "1950s-1990s", "title": "Radar scopes and fast-time sims", "text": "Controllers worked from radar scopes and paper strips while planners used fast-time simulation models offline. The model never saw live traffic.", "items": [{"name": "FAA SIMMOD airport and airspace fast-time simulation model", "kind": "product", "year": 1985, "url": null, "verified": false}, {"name": "Radar-based air traffic control spreads in postwar US and Europe", "kind": "milestone", "year": 1955, "url": null, "verified": false}], "img": {"src": "img/airports-air-traffic-0.jpg", "credit": "Thomas Nugent / CC BY-SA 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Heathrow_Airport_radar_tower_-_geograph.org.uk_-_3897618.jpg", "alt": "Radar tower at Heathrow Airport"}}, {"years": "2000s-2017", "title": "Shared data and remote towers", "text": "Airport collaborative decision making shared milestones across airline, airport and ANSP. Sweden opened the first operational remote tower in 2015.", "items": [{"name": "Worlds first remote tower operational at Ornskoldsvik, Sweden (LFV/Saab)", "kind": "milestone", "year": 2015, "url": null, "verified": false}, {"name": "Schiphol builds digital asset twin and Common Data Environment", "kind": "product", "year": 2017, "url": "https://www.esri.com/about/newsroom/arcuser/digital-twin-helps-airport-optimize-operations", "verified": false}], "img": null}, {"years": "2018-2024", "title": "Airport and airspace twins appear", "text": "Operators started simulating passenger flow and airfield what-ifs on live data. NATS marketed a capacity balancer built on an airport twin.", "items": [{"name": "T-Systems builds Schiphol digital twin for shared view and passenger-flow simulation", "kind": "product", "year": 2020, "url": "https://computable.nl/2020/10/07/t-systems-spiegelt-schiphol-met-digital-twin", "verified": true}, {"name": "NATS Demand Capacity Balancer models winds, schedules and passport control as an airport twin", "kind": "product", "year": 2021, "url": "https://www.nats.aero/news/nats-at-the-world-atm-congress-2021/", "verified": true}, {"name": "NASA Ames National Airspace System digital twin simulator", "kind": "milestone", "year": 2024, "url": "https://ntrs.nasa.gov/citations/20240009035", "verified": true}], "img": {"src": "img/airports-air-traffic-2.jpg", "credit": "David Jones / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Heathrow_Air_Traffic_Control_Tower_2009-11-15.jpg", "alt": "Heathrow air traffic control tower"}}, {"years": "2025-26", "title": "AI agents and live camera twins", "text": "Twins are becoming training grounds for AI controllers and are fed by computer vision. UK work trains agents against a probabilistic en-route airspace twin.", "items": [{"name": "Manchester Airport to run hybrid digital tower with NATS and Searidge", "kind": "milestone", "year": 2025, "url": "https://www.adsgroup.org.uk/knowledge/industry-member-news/manchester-airport-partners-with-nats-and-searidge-technologies-for-digital-transformation/", "verified": true}, {"name": "YVR launches AI turnaround camera analysis feeding airport digital twin", "kind": "milestone", "year": 2025, "url": "https://www.futuretravelexperience.com/2025/11/yvr-launches-ai-powered-innovation-to-optimise-aircraft-turnaround-process-in-partnership-with-aviation-solutions/", "verified": true}, {"name": "A Probabilistic Digital Twin of UK En Route Airspace for Training and Evaluating AI Agents for ATC (arXiv)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/pdf/2601.03113", "verified": true}, {"name": "Mosaic ATM: Digital Twins for Airport Surface Operations", "kind": "report", "year": 2026, "url": "https://mosaicatm.com/2026/08/21/digital-twins-airport-surface-operations/", "verified": true}], "img": {"src": "img/airports-air-traffic-3.jpg", "credit": "Stanislav Doronenko / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Vienna_International_Airport_from_the_Air_Traffic_Control_Tower_20.jpg", "alt": "Airfield view from the Vienna airport control tower"}}], "Simulation-driven CAD & CAE": [{"years": "1960s-1970s", "title": "Sketchpad and the first FE codes", "text": "Interactive graphics and finite-element solvers appeared together in the 1960s. NASA-funded NASTRAN made structural analysis a shared tool.", "items": [{"name": "Sutherland's Sketchpad at MIT: first interactive graphical CAD system", "kind": "milestone", "year": 1963, "url": null, "verified": false}, {"name": "NASTRAN finite-element code developed for NASA", "kind": "product", "year": 1968, "url": null, "verified": false}, {"name": "Swanson Analysis Systems (later ANSYS) founded", "kind": "company", "year": 1970, "url": null, "verified": false}], "img": {"src": "img/simulation-driven-cad-cae-0.png", "credit": "Sutherland, Ivan Edward / CC0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Sketchpad_N-Component_Element.png", "alt": "Figure from Ivan Sutherland's Sketchpad thesis"}}, {"years": "1990s-2000s", "title": "FEA on every desktop", "text": "Parametric solid CAD put geometry on a PC and simulation followed it there. Consolidation put solvers inside CAD suites.", "items": [{"name": "SolidWorks 1995 launch brings 3D parametric CAD to Windows PCs", "kind": "product", "year": 1995, "url": null, "verified": false}, {"name": "Dassault Systemes acquires ABAQUS, forming SIMULIA", "kind": "milestone", "year": 2005, "url": null, "verified": false}], "img": {"src": "img/simulation-driven-cad-cae-1.jpg", "credit": "Caesarwiratama / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Gears_and_shaft_FEA_MSC_Nastran.png", "alt": "Finite-element stress plot of gears and shaft in MSC Nastran"}}, {"years": "2018-2024", "title": "ML surrogates enter the loop", "text": "Neural nets trained on past simulations replace hours-long solves with near-instant predictions in the CAD environment. Funding rounds followed.", "items": [{"name": "PhysicsX raises $32M Series A led by General Catalyst", "kind": "startup", "year": 2023, "url": "https://startupintros.com/news/2023-11-01-physicsx-series-a", "verified": true}, {"name": "Neural Concept completes $27M Series B", "kind": "startup", "year": 2024, "url": "https://www.venturekick.ch/Neural-Concept-closes-USD-100M-Series-C-to-scale-AInative-engineering", "verified": true}, {"name": "Synopsys announces ~$35B acquisition of Ansys", "kind": "milestone", "year": 2024, "url": "https://www.sec.gov/Archives/edgar/data/883241/000119312525158652/d906938d425.htm", "verified": true}], "img": {"src": "img/simulation-driven-cad-cae-2.jpg", "credit": "Cofaser / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:F1_CFD_Simulation.png", "alt": "CFD airflow simulation of a Formula 1 car"}}, {"years": "2025-26", "title": "Consolidation plus AI-native engineering", "text": "The two biggest solver vendors were absorbed by chip- and PLM-adjacent giants while AI-native startups raised nine-figure rounds.", "items": [{"name": "Siemens completes ~$10B Altair acquisition", "kind": "milestone", "year": 2025, "url": "https://www.mbtmag.com/artificial-intelligence/news/22937021/siemens-completes-10-billion-altair-acquisition", "verified": true}, {"name": "Synopsys completes ~$34.9B Ansys acquisition", "kind": "milestone", "year": 2025, "url": "https://www.datacenterdynamics.com/en/news/synopsys-closes-35bn-acquisition-of-ansys/", "verified": true}, {"name": "Neural Concept raises $100M Series C led by Goldman Sachs Alternatives growth equity", "kind": "startup", "year": 2025, "url": "https://pulse2.com/neural-concept-100-million-series-c/", "verified": true}, {"name": "PhysicsX raises $300M Series C at $2.4B valuation led by Temasek", "kind": "startup", "year": 2026, "url": "https://raising.fi/news/physicsx-series-c-june-2026", "verified": false}], "img": {"src": "img/simulation-driven-cad-cae-3.jpg", "credit": "Bruno Sudret / CC BY 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Finite_element_mesh.jpg", "alt": "Finite element mesh of a structure"}}], "Factories & production lines": [{"years": "1913-1990s", "title": "Assembly lines and discrete-event models", "text": "The moving assembly line set the unit of analysis: stations, cycle times and buffers. IBM's GPSS then let planners model queues on a computer before building.", "items": [{"name": "Ford Highland Park moving assembly line", "kind": "milestone", "year": 1913, "url": null, "verified": false}, {"name": "IBM GPSS discrete-event simulation language (Geoffrey Gordon)", "kind": "milestone", "year": 1961, "url": null, "verified": false}], "img": {"src": "img/factories-production-lines-0.jpg", "credit": "Literary Digest 1928-01-07 Henry Ford Interview / Photograph / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Ford_Motor_Company_assembly_line.jpg", "alt": "Ford Motor Company moving assembly line, 1928"}}, {"years": "2000s-2010s", "title": "Plant simulation joins PLM", "text": "Plant-simulation and process-planning tools were consolidated into PLM vendors, tying line models to product data.", "items": [{"name": "UGS acquires Tecnomatix (Plant Simulation, Process Simulate)", "kind": "milestone", "year": 2005, "url": null, "verified": false}, {"name": "Siemens acquires UGS and creates Siemens PLM Software", "kind": "milestone", "year": 2007, "url": null, "verified": false}], "img": {"src": "img/factories-production-lines-1.jpg", "credit": "BMW Werk Leipzig / CC BY-SA 2.0 de / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:BMW_Leipzig_MEDIA_050719_Download_Montage_2_max.jpg", "alt": "BMW Leipzig plant assembly hall"}}, {"years": "2020-2024", "title": "Whole-factory twins on GPUs", "text": "Carmakers built photoreal, shared-USD factory models in Omniverse and began planning plants entirely in it.", "items": [{"name": "Siemens and NVIDIA link Xcelerator to Omniverse for industrial digital twins", "kind": "milestone", "year": 2022, "url": "https://blogs.nvidia.com/blog/siemens-nvidia-industrial-metaverse", "verified": true}, {"name": "BMW: future Debrecen plant is planned and validated fully virtually in NVIDIA Omniverse", "kind": "milestone", "year": 2023, "url": "https://www.press.bmwgroup.com/global/article/detail/T0411467EN/bmw-group-at-nvidia-gtc:-virtual-production-under-way-in-future-plant-debrecen", "verified": true}], "img": {"src": "img/factories-production-lines-2.jpg", "credit": "BMW Werk Leipzig / CC BY-SA 2.0 de / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:BMW_Leipzig_MEDIA_050719_Download_Karosseriebau_max.jpg", "alt": "Robotic body shop at the BMW Leipzig plant"}}, {"years": "2025-26", "title": "Physical-AI factories", "text": "Twins now host robot fleets, humanoids and AI agents before they touch the line. Siemens and NVIDIA previewed a joint AI-era industrial stack.", "items": [{"name": "NVIDIA Mega blueprint for robot-fleet testing; Hyundai, Mercedes-Benz, Foxconn, Schaeffler adopt", "kind": "product", "year": 2025, "url": "https://nvidianews.nvidia.com/news/nvidia-omniverse-physical-ai-operating-system-expands-to-more-industries-and-partners", "verified": true}, {"name": "Siemens and NVIDIA preview industrial tech stack for AI-era manufacturing", "kind": "product", "year": 2025, "url": "https://news.siemens.com/de-ch/siemens-and-nvidia-preview-industrial-tech-stack-for-ai-era-manufacturing/", "verified": true}, {"name": "Foxconn pilots ABB and NVIDIA AI robotics platform for electronics assembly", "kind": "milestone", "year": 2026, "url": "https://evertiq.com/news/2026-03-10-foxconn-pilots-abb-nvidia-ai-robotics-platform-for-electronics-assembly", "verified": true}], "img": {"src": "img/factories-production-lines-3.jpg", "credit": "DARPA / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Atlas_frontview_2013.jpg", "alt": "DARPA Atlas humanoid robot, 2013"}}], "Virtual commissioning & robot cells": [{"years": "1969-1990s", "title": "PLCs and offline robot programming", "text": "The programmable logic controller replaced relay panels with scan-cycle code. Robot offline-programming tools let engineers lay out a cell and test paths in software.", "items": [{"name": "Modicon 084, first programmable logic controller", "kind": "product", "year": 1969, "url": null, "verified": false}, {"name": "IEC 61131-3 standardizes PLC programming languages", "kind": "milestone", "year": 1993, "url": null, "verified": false}], "img": {"src": "img/virtual-commissioning-robot-cells-0.jpg", "credit": "Projuktiponno / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Programmable_Logic_Controller_(PLC)_CPU226.jpg", "alt": "Programmable logic controller CPU unit"}}, {"years": "2000s-2010s", "title": "Soft PLCs and virtual commissioning", "text": "Running real PLC code against a simulated plant, via soft PLC or hardware-in-the-loop, became the basis of virtual commissioning. Robot-cell simulation vendors consolidated.", "items": [{"name": "KUKA acquires simulation vendor Visual Components", "kind": "milestone", "year": 2017, "url": null, "verified": false}, {"name": "JR Automation virtually commissions a Fanuc sortation cell with Process Simulate and PLCSIM Advanced", "kind": "milestone", "year": 2019, "url": "https://www.automationworld.com/virtual-commissioning-robotic-cell", "verified": true}], "img": null}, {"years": "2020-2024", "title": "Twins for small shops", "text": "Virtual commissioning moved from big OEM programs to mid-size integrators with lighter tools and motion planners embedded in the twin.", "items": [{"name": "Siemens Process Simulate VC Lite brings virtual commissioning and robotics to SMEs", "kind": "product", "year": 2021, "url": "https://blogs.sw.siemens.com/tecnomatix/virtual-commissioning-made-easy-with-process-simulate-vc-lite/", "verified": true}, {"name": "Realtime Robotics RapidPlan integrates with Siemens Process Simulate and Tecnomatix", "kind": "product", "year": 2022, "url": null, "verified": false}], "img": {"src": "img/virtual-commissioning-robot-cells-2.jpg", "credit": "WireCrafters / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Robotic_Welding_Cell.jpg", "alt": "Robotic welding cell"}}, {"years": "2025-26", "title": "Real firmware in the loop", "text": "Vendors now run the production robot controller inside a photoreal physics twin and train vision models on its synthetic data.", "items": [{"name": "ABB RobotStudio HyperReality: virtual controller with real firmware in NVIDIA Omniverse, due H2 2026", "kind": "product", "year": 2026, "url": "https://blogs.nvidia.com/blog/abb-robotics-omniverse", "verified": true}, {"name": "Foxconn pilots first joint ABB-NVIDIA application in consumer electronics assembly", "kind": "milestone", "year": 2026, "url": "https://evertiq.com/news/2026-03-10-foxconn-pilots-abb-nvidia-ai-robotics-platform-for-electronics-assembly", "verified": true}, {"name": "Virtual commissioning of a robotic cell (MDPI Sensors 25(6):1821)", "kind": "paper", "year": 2025, "url": "https://www.mdpi.com/1424-8220/25/6/1821", "verified": true}, {"name": "Chalmers thesis: robot-cell digital twin in Visual Components, virtual plus physical commissioning", "kind": "paper", "year": 2025, "url": "https://odr.chalmers.se/bitstreams/1c250955-31b1-4716-a373-66729b1e941d/download", "verified": true}], "img": {"src": "img/virtual-commissioning-robot-cells-3.jpg", "credit": "Oleg Yunakov / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:KUKA_industrial_robotic_arm_performing_%22The_Beach%22_by_Roy_Nachum_-_06.jpg", "alt": "KUKA industrial robot arm at work"}}], "Process plants (chemicals, oil & gas)": [{"years": "1950s-1980s", "title": "Computers enter the control room", "text": "Process computers began closing loops in refineries in the late 1950s, and by 1975 Honeywell TDC 2000 and Yokogawa CENTUM put distributed controllers on the plant floor. MIT's ASPEN project (1976) produced the flowsheet simulator that became Aspen Plus.", "items": [{"name": "MIT/DOE ASPEN project (1976) spun out as AspenTech in 1981; Aspen Plus released 1982", "kind": "milestone", "year": 1982, "url": "https://www.aspentech.com/ja/resources/blog/aspentech-journey-over-the-past-40-years", "verified": true}, {"name": "Honeywell TDC 2000 and Yokogawa CENTUM introduced the distributed control system, both 1975", "kind": "product", "year": 1975, "url": "https://www.yokogawa.com/us/library/resources/media-publications/why-yokogawa-migrating-from-tdc2000-to-centum", "verified": true}], "img": {"src": "img/process-plants-chemicals-oil-gas-0.jpg", "credit": "Gerryrkirk / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Control_room_at_an_early_ACS_petroleum_refinery_installation.jpg", "alt": "Control room at an early computer-controlled petroleum refinery"}}, {"years": "1990s-2010s", "title": "Dynamic simulators train operators", "text": "Rigorous dynamic models wired to emulated DCS logic let operators rehearse startups and upsets before first oil. Soft sensors on distillation and reactor units began feeding model-predictive control layers.", "items": [{"name": "AVEVA Operator Training Simulator; Total OLEUM runs cloud simulators for up to 2,000 operators a year", "kind": "product", "year": null, "url": "https://www.aveva.com/en/solutions/engineering/simulation-and-learning/", "verified": true}, {"name": "EGA Al Taweelah alumina refinery: simulator mirrors the DCS one-to-one, exposed design gaps before start-up", "kind": "milestone", "year": null, "url": "https://www.ega.ae/en/inside-ega/the-digital-twin-explained", "verified": false}, {"name": "Emerson DeltaV Mimic: dynamic-simulator twin of the control system for training and testing", "kind": "product", "year": null, "url": "https://www.emerson.com/en/automation-systems/operations-business-management/deltav-mimic/digital-twin-solutions", "verified": false}], "img": {"src": "img/process-plants-chemicals-oil-gas-1.jpg", "credit": "terry joyce / CC BY-SA 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Shell_Haven_Central_Control_Room_-_geograph.org.uk_-_581821.jpg", "alt": "Central control room at Shell Haven refinery"}}, {"years": "2020-2024", "title": "Control and simulation vendors merge", "text": "Emerson combined its software business with AspenTech in 2022 (55% stake), pairing a DCS vendor with the dominant process-simulation vendor. Process twins are now paired with 3D immersive twins for field-operator training.", "items": [{"name": "Emerson and AspenTech complete transaction; Emerson holds 55% of new AspenTech (May 16, 2022)", "kind": "milestone", "year": 2022, "url": "https://www.emerson.com/en-us/news/corporate/emerson-and-aspentech-complete-transaction", "verified": true}, {"name": "Stamicarbon: Process Monitor computes soft sensors; Technology Training Simulator for urea plants", "kind": "product", "year": 2024, "url": "https://www.stamicarbon.com/events/webinar-uncover-power-your-digital-twin", "verified": false}], "img": {"src": "img/process-plants-chemicals-oil-gas-2.jpg", "credit": "AGERPRES / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Darmanesti_Refinery,_Atmospheric_Distillation_unit_no._2.jpg", "alt": "Atmospheric distillation unit at the Darmanesti refinery"}}, {"years": "2025-26", "title": "Twins for the biggest refineries", "text": "Honeywell will deliver digital-twin operator simulators plus Forge-based performance monitoring at the world's largest single-train refinery. Research is moving to physics-informed neural nets that replace slow rigorous column models.", "items": [{"name": "Honeywell to supply digital services and digital-twin operator training at Dangote refinery (Apr 9, 2026)", "kind": "milestone", "year": 2026, "url": "https://www.honeywell.com/us/en/press/2026/04/honeywell-to-help-boost-fuel-production-and-enhance-workforce-capabilities-at-dangote-refinery", "verified": true}, {"name": "PINN twin of distillation columns: 44.6% lower RMSE than data-only baselines (arXiv Mar 2026, synthetic data)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/abs/2603.24644", "verified": true}, {"name": "AIChE 2025: framework to auto-select hybrid first-principles/ML model structures", "kind": "paper", "year": 2025, "url": "https://proceedings.aiche.org/conferences/aiche-annual-meeting/2025/proceeding/paper/development-framework-automatic", "verified": false}], "img": {"src": "img/process-plants-chemicals-oil-gas-3.jpg", "credit": "FrankvEck / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Worlds_largest_crude_destillation_column_Dangote.jpg", "alt": "World's largest crude distillation column at the Dangote refinery"}}], "Machine tools & CNC": [{"years": "1950s-1990s", "title": "Tape, servos, regenerative chatter", "text": "MIT's Servomechanisms Lab demonstrated a punched-tape numerically controlled milling machine in 1952. Tobias, Tlusty and later Altintas built the stability-lobe theory that predicts chatter.", "items": [{"name": "MIT Servomechanisms Lab shows first NC milling machine (modified Cincinnati Hydrotel), 1952", "kind": "milestone", "year": 1952, "url": "https://mitmuseum.mit.edu/collections/object/1990.036.001", "verified": false}, {"name": "Altintas & Budak: analytical stability-lobe prediction for milling, CIRP Annals 1995", "kind": "paper", "year": 1995, "url": "https://doi.org/10.1016/S0007-8506(07)62342-7", "verified": false}], "img": null}, {"years": "2000s-2010s", "title": "Virtual machining and digital-native CNCs", "text": "CAM verification, finite-element spindle models and stability-lobe software moved offline process planning into the computer. Controller vendors began exposing open data interfaces and virtual copies of the control kernel.", "items": [{"name": "Siemens introduces SINUMERIK ONE, billed as the first digital-native CNC", "kind": "product", "year": 2019, "url": "https://www.automate.org/motion-control/news/siemens-introduces-new-sinumerik-one-cnc-the-first-digital-native-machine-tool-controller/anc", "verified": false}, {"name": "Siemens Run MyVNCK embeds the original NC kernel in a virtual machine (840D sl)", "kind": "product", "year": null, "url": "https://www.siemens.com/lv-lv/products/sinumerik/run-my-virtual-machine/", "verified": false}], "img": {"src": "img/machine-tools-cnc-1.jpg", "credit": "Glenn McKechnie / Graibeard / CC BY-SA 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:CNC-Panel_DMU50e.jpg", "alt": "Control panel of a DMU 50e CNC machining center"}}, {"years": "2020-2024", "title": "Twin of the controller", "text": "Run MyVirtual Machine lets NC programs be created, validated and optimized on a PC twin with /Operate, /3D and /Open options. Research added vibration and NC-signal anomaly detection for tool condition.", "items": [{"name": "Run MyVirtual Machine: digital twin of SINUMERIK ONE for program validation (Siemens Xcelerator)", "kind": "product", "year": null, "url": "https://xcelerator.siemens.com/global/en/all-offerings/products/r/run-myvirtual-machine.html", "verified": true}, {"name": "Create MyVirtual Machine: build the machine controller and its twin from one engineering system", "kind": "product", "year": null, "url": "https://www.siemens.com/th-th/products/sinumerik/run-my-virtual-machine/", "verified": false}], "img": {"src": "img/machine-tools-cnc-2.jpg", "credit": "Psychlist1972 / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:HAAS_CNC_Machining_Center.jpg", "alt": "A Haas CNC vertical machining center with its controller and tool list"}}, {"years": "2025-26", "title": "Process twins in real time", "text": "Papers now put a cutting model inside the twin and track wear and chatter state together. A 20 Hz machining-state twin with voxel workpiece model and synchronized vibration was demonstrated in 2026.", "items": [{"name": "Bai et al.: cutting-model digital twin tracks tool wear and chatter in small-batch machining, IJAMT 2025", "kind": "paper", "year": 2025, "url": "https://scholar.xjtu.edu.cn/en/publications/cutting-model-integrated-digital-twinbased-process-monitoring-in-/", "verified": true}, {"name": "Siemens MACHINUM at IMTEX 2025: virtual machine setup-time cut up to 20% (vendor claim)", "kind": "product", "year": 2025, "url": "https://themachinemaker.com/news/siemens-launches-machinum-at-imtex-2025-to-enhance-efficiency-and-sustainability-in-machine-tool-industry/", "verified": true}, {"name": "Liu et al.: digital-twin tool wear monitoring for titanium milling with CNN-ResNet-BiLSTM-GRU model (Feb 2025)", "kind": "paper", "year": 2025, "url": "https://doaj.org/article/e9f459ff845a41e6bb866cbf814f5177", "verified": false}, {"name": "Chakal et al.: cyber-physical machine tool with 20 Hz process twin, 0.16 mm mean depth error (arXiv, Aug 2026)", "kind": "paper", "year": 2026, "url": "https://arxiv.org/abs/2608.29955", "verified": true}], "img": {"src": "img/machine-tools-cnc-3.jpg", "credit": "Stilfehler / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:CNC_Mill_1.jpg", "alt": "CNC milling machine at a workshop"}}], "Vehicles & EV batteries": [{"years": "1990s", "title": "Cells get a physics model", "text": "Sony commercialized the lithium-ion cell in 1991, and the Doyle-Fuller-Newman porous-electrode model (1993) gave a first-principles way to simulate one. Packs then ran on simple voltage and coulomb-counting logic.", "items": [{"name": "Doyle, Fuller, Newman: Li/polymer/insertion cell charge-discharge model, J. Electrochem. Soc. 1993", "kind": "paper", "year": 1993, "url": "https://doi.org/10.1149/1.2221597", "verified": false}, {"name": "Sony commercializes the lithium-ion cell, 1991", "kind": "milestone", "year": 1991, "url": "https://en.wikipedia.org/wiki/Lithium-ion_battery", "verified": false}], "img": {"src": "img/vehicles-ev-batteries-0.jpg", "credit": "Sevenethics / CC0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:18650_and_21700_lithium_ion_battery_cell.jpg", "alt": "Lithium-ion 18650 and 21700 cylindrical cells"}}, {"years": "2010s-2020", "title": "Telemetry meets battery analytics", "text": "Once EVs shipped with connectivity, startups began fitting aging models to fleet data in the cloud. TWAICE was founded in 2018 and closed its Series A in 2020.", "items": [{"name": "TWAICE raises EUR 1.2M seed (Sep 2018)", "kind": "startup", "year": 2018, "url": "https://tech.eu/2018/09/18/german-battery-analytics-startup-twaice-raises-e1-2-million", "verified": true}, {"name": "TWAICE raises EUR 11M Series A led by Creandum (Mar 2020)", "kind": "startup", "year": 2020, "url": "https://techcrunch.com/2020/03/25/battery-analytics-software-startup-twaice-raises-e11m-series-a-led-by-creandum/", "verified": true}], "img": {"src": "img/vehicles-ev-batteries-1.jpg", "credit": "Mariordo Mario Roberto Duran Ortiz / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Nissan_Leaf_battery_pack_DC_03_2011_1629.jpg", "alt": "Nissan Leaf battery pack"}}, {"years": "2021-2024", "title": "Cloud twins reach OEMs and storage", "text": "OEM, tier-1 and grid-storage operators bought predictive health analytics for warranty, charging and second-life decisions. TWAICE reached EUR 75M total funding by 2022.", "items": [{"name": "TWAICE raises $26M Series B led by Energize Ventures (May 2021)", "kind": "startup", "year": 2021, "url": "https://www.businesswire.com/news/home/20210519005015/en/Battery-Analytics-Company-TWAICE-Raises-%2426-Million-in-Series-B-Funding", "verified": true}, {"name": "TWAICE $30M Series B extension from Coatue (Apr 2022)", "kind": "startup", "year": 2022, "url": "https://www.electrive.com/2022/04/26/twaice-closes-30-million-financing-round", "verified": true}, {"name": "FEV io Battery: digital twin on cloud for fleet SOC/SOH", "kind": "product", "year": 2024, "url": "https://www.fev.com/app/uploads/2024/10/FEV_io_Battery-digital-twin-on-cloud.pdf", "verified": false}], "img": {"src": "img/vehicles-ev-batteries-2.jpg", "credit": "Norio Nakayama / CC BY-SA 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Tesla_Roadster_Sport_battery_pack_rear.jpg", "alt": "Tesla Roadster battery pack seen from the rear"}}, {"years": "2025-26", "title": "Safety and storage drive funding", "text": "Funding follows thermal-runaway prevention and grid-scale storage as much as EVs. Cloud-edge twins pair a static SOH model with a periodically retrained SOC model.", "items": [{"name": "ACCURE raises $16M Series B led by Incharge Capital Partners (Porsche SE/DTCP), Feb 13 2025", "kind": "startup", "year": 2025, "url": "https://www.esgtoday.com/accure-raises-16-million-to-scale-ai-based-platform-to-make-batteries-safer-and-more-reliable/", "verified": true}, {"name": "EIB lends TWAICE EUR 24M venture debt under InvestEU (Feb 2026)", "kind": "startup", "year": 2026, "url": "https://www.electrive.com/2026/02/05/battery-analytics-startup-twaice-secures-e24-million/", "verified": true}, {"name": "Cloud-edge twin preprint: SOH error under 1.8% RMSE on NASA dataset (Jan 2026, not peer reviewed)", "kind": "paper", "year": 2026, "url": "https://www.preprints.org/manuscript/202601.1217/v1", "verified": false}], "img": {"src": "img/vehicles-ev-batteries-3.jpg", "credit": "Sig. Chiocciola / CC0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Stanton_Battery_Energy_Storage_(SBES)_10-8-2024.jpg", "alt": "Stanton Battery Energy Storage power plant in California"}}], "Supply chains & logistics": [{"years": "1960s-1990s", "title": "Systems dynamics and the bullwhip", "text": "Forrester's Industrial Dynamics (1961) modeled inventory and delay loops across a supply chain. The bullwhip effect, formalized in 1997, showed why order variance amplifies upstream.", "items": [{"name": "Lee, Padmanabhan, Whang: The Bullwhip Effect in Supply Chains, Sloan Management Review 1997", "kind": "paper", "year": 1997, "url": "https://sloanreview.mit.edu/article/the-bullwhip-effect-in-supply-chains/", "verified": false}, {"name": "Jay Forrester, Industrial Dynamics (MIT Press, 1961)", "kind": "paper", "year": 1961, "url": "https://en.wikipedia.org/wiki/Jay_Wright_Forrester", "verified": false}], "img": null}, {"years": "2000s-2010s", "title": "Network design software", "text": "Optimization engines modeled plants, warehouses and lanes as a network to pick sites and flows. Vendors such as LLamasoft sold these what-if models to large shippers.", "items": [{"name": "LLamasoft (Ann Arbor) customers include Boeing, Danone, Home Depot, Nestle", "kind": "company", "year": null, "url": "https://www.supplychain247.com/article/coupa_acquires_ai_powered_supply_chain_design_leader_llamasoft", "verified": false}, {"name": "Siemens: digital supply chain twins as new opportunity for manufacturers", "kind": "report", "year": null, "url": "https://blogs.sw.siemens.com/opcenter/digital-supply-chain-twins-create-new-opportunities-for-manufacturers", "verified": false}], "img": {"src": "img/supply-chains-logistics-1.jpg", "credit": "Raimond Spekking / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Hamburg_Hafen_Containerterminal.jpg", "alt": "Container terminal at the Port of Hamburg"}}, {"years": "2020-2024", "title": "Planning suites buy the twin", "text": "The 2020 shock exposed fragile networks and consolidated vendors. Gartner reported most leaders piloting or planning a twin.", "items": [{"name": "Coupa acquires LLamasoft for about $1.5B (Nov 2, 2020)", "kind": "milestone", "year": 2020, "url": "https://clickondetroit.com/all-about-ann-arbor/2020/11/02/ann-arbors-llamasoft-acquired-by-coupa-software-for-15b", "verified": true}, {"name": "Gartner Jan 2023: ~60% of 380 supply chain leaders piloting or planning a digital supply chain twin", "kind": "report", "year": 2023, "url": "https://www.mhlnews.com/technology-automation/article/21270129/supply-chain-leaders-not-taking-advantage-of-integrating-customer-in-digitalization-plans", "verified": true}], "img": {"src": "img/supply-chains-logistics-2.jpg", "credit": "NASA JSC ISS image library / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Ever_Given_in_Suez_Canal_viewed_from_ISS.jpg", "alt": "Container ship Ever Given stuck in the Suez Canal, seen from the ISS"}}, {"years": "2025-26", "title": "Warehouse twins with robot fleets", "text": "Physical-AI twins now simulate layouts, robot fleets and worker counts and train the robots' software in simulation. Siemens is adding a composer layer that joins engineering data, automation logic and live operations.", "items": [{"name": "KION, NVIDIA and Accenture build warehouse twins on the Mega Omniverse blueprint (Jan 7, 2025)", "kind": "milestone", "year": 2025, "url": "https://www.businesswire.com/news/home/20250106399453/en/KION-Teams-with-NVIDIA-and-Accenture-to-Optimize-Supply-Chains-with-AI-Powered-Robots-and-Digital-Twins", "verified": true}, {"name": "NVIDIA unveils Mega Omniverse Blueprint for industrial robot fleet twins; KION first adopter", "kind": "product", "year": 2025, "url": "https://blogs.nvidia.com/blog/mega-omniverse-blueprint", "verified": true}, {"name": "Siemens Digital Twin Composer shown at CES 2026, alongside KION", "kind": "product", "year": 2026, "url": "https://www.kiongroup.com/en/Newsroom/Story-Categories/Innovation/Article/CES-2026-From-Vision-to-Industrial-Reality.html", "verified": false}], "img": {"src": "img/supply-chains-logistics-3.jpg", "credit": "Techwords / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Ocado_warehouse_bots.jpg", "alt": "Robotic bots moving inside an Ocado warehouse"}}], "Buildings & BIM": [{"years": "1970s-1990s", "title": "Building description goes digital", "text": "Eastman's 1970s work proposed describing buildings as computer databases instead of drawings, and Graphisoft's ArchiCAD (1987) brought parametric 3D to desktop PCs. Building automation systems ran separately on pneumatic then DDC controls.", "items": [{"name": "Building information modeling, from Eastman's 1970s Building Description System onward", "kind": "milestone", "year": 1975, "url": "https://en.wikipedia.org/wiki/Building_information_modeling", "verified": false}, {"name": "Graphisoft ArchiCAD (1987), early parametric BIM-style design on a PC", "kind": "product", "year": 1987, "url": "https://en.wikipedia.org/wiki/Archicad", "verified": false}], "img": {"src": "img/buildings-bim-0.jpg", "credit": "Flickr user midnightcomm / CC BY 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Honeywell_round_thermostat.jpg", "alt": "Honeywell T87 round thermostat"}}, {"years": "2000-2016", "title": "BIM becomes a mandate", "text": "Revit (2000, bought by Autodesk 2002) made object-based BIM mainstream. The UK required Level 2 BIM on centrally procured public projects from 2016.", "items": [{"name": "Autodesk Revit: object-based BIM, acquired from Charles River Software in 2002", "kind": "product", "year": 2002, "url": "https://en.wikipedia.org/wiki/Revit", "verified": false}, {"name": "UK Government mandates collaborative BIM Level 2 for central public projects by 2016", "kind": "milestone", "year": 2016, "url": "https://www.designingbuildings.co.uk/wiki/BIM_level_2", "verified": false}], "img": {"src": "img/buildings-bim-1.png", "credit": "Drashevski / CC BY 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Xeokit-BIM-viewer.png", "alt": "Open-source BIM viewer showing a building model"}}, {"years": "2017-2024", "title": "Operational twins get venture money", "text": "ISO 19650 internationalized the UK information-management framework. Startups joined BIM to live building data and raised large rounds.", "items": [{"name": "ISO 19650 series evolves UK BS/PAS 1192 into an international BIM standard (2018-19)", "kind": "milestone", "year": 2018, "url": "https://www.designingbuildings.co.uk/wiki/BIM_level_2", "verified": false}, {"name": "Willow raises $43M pre-Series B for WillowTwin deployment (2021)", "kind": "startup", "year": 2021, "url": "https://www.citybiz.co/article/160179/willow-raises-43m-to-scale-digital-twins-deployment/", "verified": false}, {"name": "Willow raises $28.8M (Dec 2022)", "kind": "startup", "year": 2022, "url": "https://www.mannpublications.com/mannreport/2022/12/20/willow-announces-28-8m-capital-raise/", "verified": true}], "img": {"src": "img/buildings-bim-2.jpg", "credit": "Oregon State University / CC BY-SA 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Scan-to-BIM_Mechanical_Room.jpg", "alt": "Building information model of a mechanical room built from lidar data"}}, {"years": "2025-26", "title": "Consolidation around operations", "text": "Willow changed CEO in Jan 2025 and the sector is consolidating around building operations and maintenance. Autodesk agreed to buy MaintainX for $3.6B in May 2026.", "items": [{"name": "Willow: Bert Van Hoof becomes CEO, Joshua Ridley moves to Chief Growth Officer (Jan 22, 2025)", "kind": "company", "year": 2025, "url": "https://willowinc.com/?p=1950", "verified": false}, {"name": "Memoori: 137 digital twin/AI startups mapped; 46 AEC software rounds in H1 2026 (Sep 1, 2026)", "kind": "report", "year": 2026, "url": "https://memoori.com/digital-twin-ai-startups-construction-2026/", "verified": true}, {"name": "Autodesk agrees to acquire MaintainX for $3.6B (May 2026, per Memoori)", "kind": "company", "year": 2026, "url": "https://memoori.com/digital-twin-ai-startups-construction-2026/", "verified": true}], "img": null}], "Urban & city twins": [{"years": "2000s-2014", "title": "3D city models get a standard", "text": "OGC adopted CityGML in 2008 as a common semantic model for 3D cities. Singapore launched its national twin programme in 2014.", "items": [{"name": "OGC CityGML adopted as 3D city data standard (2008)", "kind": "milestone", "year": 2008, "url": "https://en.wikipedia.org/wiki/CityGML", "verified": false}, {"name": "Virtual Singapore: S$73M NRF programme launched Dec 2014, with Dassault Systemes", "kind": "milestone", "year": 2014, "url": "https://digitalnewsasia.com/digital-economy/building-singapores-digital-twin", "verified": true}], "img": {"src": "img/urban-city-twins-0.jpg", "credit": "Basile Morin / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Skylines_of_the_Central_Business_District,_Singapore_at_dusk.jpg", "alt": "Singapore central business district skyline at dusk"}}, {"years": "2015-2019", "title": "Planners test before building", "text": "Helsinki's 3D+ programme was coordinated from 2014 and used to test houses, parks and traffic in new districts before construction. ABI Research forecast 500+ urban twin deployments by 2025.", "items": [{"name": "Helsinki 3D+ lets planners test houses, parks and traffic solutions pre-construction", "kind": "product", "year": 2014, "url": "https://forumvirium.fi/en/cnn-praises-helsinkis-digital-twin-so-what-is-it-exactly/", "verified": false}, {"name": "ABI Research forecast: urban twin deployments from a handful in 2019 to 500+ by 2025", "kind": "report", "year": 2019, "url": "https://hs.abiresearch.com/press/transformative-urban-digital-twin-and-city-modeling-deployments-exceed-500-2025", "verified": false}], "img": {"src": "img/urban-city-twins-1.jpg", "credit": "Markus Säynevirta / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Majakka,_Kalasatama,_Helsinki_(August_2018).jpg", "alt": "Majakka tower under construction in Kalasatama, Helsinki"}}, {"years": "2020-2024", "title": "Public twins, open data", "text": "Zurich published its datasets as open government data and launched a public twin in 2022 for building heights and shadows. Helsinki's twin drew press attention as a long-running programme.", "items": [{"name": "Zurich digital twin: public version launched 2022, built on Open Government Data", "kind": "product", "year": 2022, "url": "https://www.swissinfo.ch/ger/wissenschaft/wie-ki-unsere-st%c3%a4dte-formen-wird/73891900", "verified": false}, {"name": "VentureBeat: Helsinki's pioneering city digital twin (Jun 2022)", "kind": "report", "year": 2022, "url": "https://venturebeat.com/ai/helsinkis-pioneering-city-digital-twin", "verified": false}], "img": {"src": "img/urban-city-twins-2.jpg", "credit": "Kuhnmi / CC BY-SA 4.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Zurich_skyline_blue_hour.jpg", "alt": "Zurich old town skyline at blue hour"}}, {"years": "2025-26", "title": "AI agents inside city twins", "text": "Vendors now frame the twin as a simulation sandbox for video-analytics AI agents over camera and sensor feeds. Adopters include Taiwanese and US cities and SNCF.", "items": [{"name": "NVIDIA Omniverse Blueprint for smart-city AI shown at GTC Paris (Jun 2025)", "kind": "product", "year": 2025, "url": "https://blogs.nvidia.com/blog/smart-city-ai-blueprint-europe/", "verified": true}, {"name": "NVIDIA partners bring city twins to Dublin, Ho Chi Minh City, Raleigh (Smart City Expo)", "kind": "milestone", "year": 2025, "url": "https://blogs.nvidia.com/blog/physical-ai-smart-city-expo-world-congress", "verified": false}, {"name": "NVIDIA: smart-city AI agents for urban operations", "kind": "product", "year": 2025, "url": "https://blogs.nvidia.com/blog/smart-city-ai-agents-urban-operations", "verified": false}], "img": {"src": "img/urban-city-twins-3.jpg", "credit": "United States Department of Transportation - Federal Highway / Public domain / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Traffic_management_center.jpg", "alt": "Traffic management center with operators at screens"}}], "Power grids": [{"years": "1970s-1990s", "title": "State estimation and the phasor", "text": "Control centers estimated network state from noisy SCADA telemetry from the 1970s. Phadke and Thorp's GPS-synchronized phasor measurement unit (1988) turned phasors into real-time measurements.", "items": [{"name": "Phadke and Thorp invent the PMU at Virginia Tech (1988); Macrodyne builds the first commercial PMU in 1992", "kind": "milestone", "year": 1988, "url": "https://en.wikipedia.org/wiki/Phasor_measurement_unit", "verified": false}, {"name": "Phadke and Thorp win Franklin Institute's Benjamin Franklin Medal (2008) for power-system controllers", "kind": "milestone", "year": 2008, "url": "https://en.wikipedia.org/wiki/Arun_Phadke", "verified": false}], "img": {"src": "img/power-grids-0.jpg", "credit": "CEphoto, Uwe Aranas / CC BY-SA 3.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Tuaran_Sabah_Tuaran-SESB-PMU-01.jpg", "alt": "Substation building housing a phasor measurement unit in Tuaran, Sabah"}}, {"years": "2000s-2010s", "title": "Blackouts push wide-area visibility", "text": "The August 2003 Northeast blackout drove wide-area monitoring, and smart-meter rollouts added distribution data. PMU fleets grew with stimulus-funded projects.", "items": [{"name": "2003 Northeast blackout, roughly 50M people affected", "kind": "milestone", "year": 2003, "url": "https://en.wikipedia.org/wiki/Northeast_blackout_of_2003", "verified": false}, {"name": "Advanced metering infrastructure rollout (smart meters) generates distribution-level data", "kind": "milestone", "year": null, "url": "https://en.wikipedia.org/wiki/Smart_meter", "verified": false}], "img": {"src": "img/power-grids-1.jpg", "credit": "Dennis G. Jarvis / CC BY-SA 2.0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Nova_Scotia_DSC03224_-_Control_Room_(8475702461).jpg", "alt": "Control room monitoring power plant turbines, Nova Scotia"}}, {"years": "2020-2024", "title": "Asset twins at the substation", "text": "Vendors began shipping twins of individual high-power assets such as HVDC converters and STATCOMs, plus network twins for planning.", "items": [{"name": "Hitachi Energy IdentiQ: digital twins of HVDC converter stations, STATCOM and power quality (2021)", "kind": "product", "year": 2021, "url": "https://www.arcweb.com/node/119091", "verified": false}, {"name": "ABI Research ranks grid-digitalization vendors incl. Siemens grid digital twins and EMS software", "kind": "report", "year": null, "url": "https://www.abiresearch.com/research-highlight/top-grid-digitalization-technology-companies", "verified": false}], "img": {"src": "img/power-grids-2.jpg", "credit": "PtiBzh / CC0 / Wikimedia Commons", "page": "https://commons.wikimedia.org/wiki/File:Pont-l%27Abb%C3%A9_high-voltage_substation_04_-_Arrival_portal_and_switchgear.jpg", "alt": "Switchgear and arrival portal at a high-v
